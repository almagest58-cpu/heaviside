th_bode_t:["the Bode plot","Bodeov dijagram","el diagrama de Bode","le diagramme de Bode","das Bode-Diagramm","伯德图"],
th_bode_what:["Two graphs against frequency. The upper one is the <b>magnitude</b> in decibels, |H|<sub>dB</sub> = 20·log₁₀|H|: how much of the input sine reaches the output. The lower one is the <b>phase</b> in degrees: how much the output sine is shifted in time relative to the input. The frequency axis is logarithmic, so every step to the right is 10× higher frequency (one decade).","Dva grafika u zavisnosti od frekvencije. Gornji je <b>moduo</b> u decibelima, |H|<sub>dB</sub> = 20·log₁₀|H|: koliki deo ulazne sinusoide stigne na izlaz. Donji je <b>faza</b> u stepenima: koliko je izlazna sinusoida pomerena u vremenu u odnosu na ulaznu. Osa frekvencije je logaritamska, pa je svaki korak udesno 10× veća frekvencija (jedna dekada).","Dos gráficas en función de la frecuencia. La de arriba es el <b>módulo</b> en decibelios, |H|<sub>dB</sub> = 20·log₁₀|H|: cuánto de la senoide de entrada llega a la salida. La de abajo es la <b>fase</b> en grados: cuánto se desplaza en el tiempo la senoide de salida respecto a la de entrada. El eje de frecuencia es logarítmico: cada paso a la derecha es 10× más frecuencia (una década).","Deux graphes en fonction de la fréquence. Celui du haut est le <b>module</b> en décibels, |H|<sub>dB</sub> = 20·log₁₀|H| : quelle part de la sinusoïde d’entrée arrive à la sortie. Celui du bas est la <b>phase</b> en degrés : de combien la sinusoïde de sortie est décalée dans le temps par rapport à l’entrée. L’axe des fréquences est logarithmique : chaque pas vers la droite multiplie la fréquence par 10 (une décade).","Zwei Diagramme über der Frequenz. Oben der <b>Betrag</b> in Dezibel, |H|<sub>dB</sub> = 20·log₁₀|H|: wie viel vom Eingangssinus am Ausgang ankommt. Unten die <b>Phase</b> in Grad: wie weit der Ausgangssinus zeitlich gegenüber dem Eingang verschoben ist. Die Frequenzachse ist logarithmisch, jeder Schritt nach rechts ist die 10-fache Frequenz (eine Dekade).","两张随频率变化的图。上图是以分贝表示的<b>幅值</b>，|H|<sub>dB</sub> = 20·log₁₀|H|：输入正弦波有多少到达输出。下图是以度表示的<b>相位</b>：输出正弦波相对输入在时间上移动了多少。频率轴是对数刻度，向右每一格频率变为 10 倍（一个十倍频程）。"],
th_bode_use:["It is the basic tool for filters: you see at a glance which frequencies pass, which are suppressed, where the cutoff is, how steep the transition is and whether there is a resonance peak. In control engineering the same plot is used to judge stability (phase margin).","To je osnovni alat za filtre: na prvi pogled vidiš koje frekvencije prolaze, koje se guše, gde je granična frekvencija, koliko je strm prelaz i da li postoji rezonantni pik. U automatskom upravljanju isti dijagram služi za procenu stabilnosti (pretek faze).","Es la herramienta básica para filtros: ves de un vistazo qué frecuencias pasan, cuáles se atenúan, dónde está la frecuencia de corte, lo abrupta que es la transición y si hay un pico de resonancia. En control automático el mismo diagrama sirve para juzgar la estabilidad (margen de fase).","C’est l’outil de base pour les filtres : on voit d’un coup d’œil quelles fréquences passent, lesquelles sont atténuées, où se trouve la coupure, la raideur de la transition et s’il y a un pic de résonance. En automatique, le même diagramme sert à juger la stabilité (marge de phase).","Das Grundwerkzeug für Filter: Man sieht sofort, welche Frequenzen durchkommen, welche gedämpft werden, wo die Grenzfrequenz liegt, wie steil der Übergang ist und ob es eine Resonanzüberhöhung gibt. In der Regelungstechnik dient dasselbe Diagramm zur Beurteilung der Stabilität (Phasenreserve).","这是滤波器的基本工具：一眼就能看出哪些频率能通过、哪些被衰减、截止频率在哪、过渡有多陡、是否有谐振峰。在自动控制中，同一张图用来判断稳定性（相位裕度）。"],
th_bode_read:["<ul><li><b>0 dB</b> = the signal passes unchanged. <b>−3 dB</b> = 70.7 % of the amplitude (half the power): this point defines the cutoff frequency f<sub>c</sub>.</li><li><b>−20 dB</b> = 1/10 of the amplitude, <b>−40 dB</b> = 1/100, <b>−60 dB</b> = 1/1000. Positive dB means amplification (e.g. at a resonance).</li><li>The <b>slope</b> tells the order: each reactive element that acts adds about 20 dB per decade (1st order −20 dB/dec, 2nd order −40 dB/dec).</li><li>The <b>phase</b> of a 1st-order filter goes through −45° exactly at f<sub>c</sub>; a 2nd-order one goes through −90° at f₀.</li><li>Tap the graph to move the cursor; the chips below show the found cutoff and resonance points.</li></ul>","<ul><li><b>0 dB</b> = signal prolazi nepromenjen. <b>−3 dB</b> = 70,7 % amplitude (pola snage): ta tačka definiše graničnu frekvenciju f<sub>c</sub>.</li><li><b>−20 dB</b> = 1/10 amplitude, <b>−40 dB</b> = 1/100, <b>−60 dB</b> = 1/1000. Pozitivni dB znače pojačanje (npr. na rezonansi).</li><li><b>Nagib</b> govori o redu filtra: svaki reaktivni element koji deluje dodaje oko 20 dB po dekadi (1. red −20 dB/dek, 2. red −40 dB/dek).</li><li><b>Faza</b> filtra 1. reda prolazi kroz −45° tačno na f<sub>c</sub>; filtra 2. reda kroz −90° na f₀.</li><li>Dodirni grafik da pomeriš kursor; čipovi ispod pokazuju pronađene granične i rezonantne tačke.</li></ul>","<ul><li><b>0 dB</b> = la señal pasa sin cambios. <b>−3 dB</b> = 70,7 % de la amplitud (mitad de la potencia): este punto define la frecuencia de corte f<sub>c</sub>.</li><li><b>−20 dB</b> = 1/10 de la amplitud, <b>−40 dB</b> = 1/100, <b>−60 dB</b> = 1/1000. Los dB positivos significan amplificación (p. ej. en una resonancia).</li><li>La <b>pendiente</b> indica el orden: cada elemento reactivo que actúa añade unos 20 dB por década (1.er orden −20 dB/déc, 2.º orden −40 dB/déc).</li><li>La <b>fase</b> de un filtro de 1.er orden pasa por −45° justo en f<sub>c</sub>; la de uno de 2.º orden por −90° en f₀.</li><li>Toca la gráfica para mover el cursor; las etiquetas de abajo muestran los puntos de corte y resonancia encontrados.</li></ul>","<ul><li><b>0 dB</b> = le signal passe inchangé. <b>−3 dB</b> = 70,7 % de l’amplitude (moitié de la puissance) : ce point définit la fréquence de coupure f<sub>c</sub>.</li><li><b>−20 dB</b> = 1/10 de l’amplitude, <b>−40 dB</b> = 1/100, <b>−60 dB</b> = 1/1000. Des dB positifs signifient une amplification (p. ex. à une résonance).</li><li>La <b>pente</b> indique l’ordre : chaque élément réactif actif ajoute environ 20 dB par décade (1er ordre −20 dB/déc, 2e ordre −40 dB/déc).</li><li>La <b>phase</b> d’un filtre du 1er ordre passe par −45° exactement à f<sub>c</sub> ; celle d’un 2e ordre par −90° à f₀.</li><li>Touchez le graphe pour déplacer le curseur ; les pastilles en dessous montrent les points de coupure et de résonance trouvés.</li></ul>","<ul><li><b>0 dB</b> = das Signal kommt unverändert durch. <b>−3 dB</b> = 70,7 % der Amplitude (halbe Leistung): dieser Punkt definiert die Grenzfrequenz f<sub>c</sub>.</li><li><b>−20 dB</b> = 1/10 der Amplitude, <b>−40 dB</b> = 1/100, <b>−60 dB</b> = 1/1000. Positive dB bedeuten Verstärkung (z. B. bei einer Resonanz).</li><li>Die <b>Steigung</b> verrät die Ordnung: jedes wirksame Blindelement bringt etwa 20 dB pro Dekade (1. Ordnung −20 dB/Dek, 2. Ordnung −40 dB/Dek).</li><li>Die <b>Phase</b> eines Filters 1. Ordnung geht genau bei f<sub>c</sub> durch −45°, eines Filters 2. Ordnung bei f₀ durch −90°.</li><li>Tippe auf das Diagramm, um den Cursor zu bewegen; die Chips darunter zeigen gefundene Grenz- und Resonanzpunkte.</li></ul>","<ul><li><b>0 dB</b> = 信号原样通过。<b>−3 dB</b> = 幅值的 70.7%（功率减半）：这个点定义了截止频率 f<sub>c</sub>。</li><li><b>−20 dB</b> = 幅值的 1/10，<b>−40 dB</b> = 1/100，<b>−60 dB</b> = 1/1000。正的 dB 表示放大（例如在谐振处）。</li><li><b>斜率</b>说明阶数：每个起作用的电抗元件大约增加每十倍频程 20 dB（一阶 −20 dB/十倍频，二阶 −40 dB/十倍频）。</li><li>一阶滤波器的<b>相位</b>恰好在 f<sub>c</sub> 处经过 −45°；二阶滤波器在 f₀ 处经过 −90°。</li><li>点击图表可移动光标；下方的标签显示找到的截止点和谐振点。</li></ul>"],
th_bode_e1:["<b>RC low-pass</b> (R = 1 kΩ, C = 100 nF). Flat at 0 dB, then −3 dB at f<sub>c</sub> = 1/(2πRC) ≈ 1.59 kHz and −20 dB/decade after that; the phase goes from 0° to −90°, passing −45° at f<sub>c</sub>. <i>In practice:</i> removing noise from a sensor signal, or the anti-aliasing filter in front of an ADC.","<b>RC niskopropusni</b> (R = 1 kΩ, C = 100 nF). Ravno na 0 dB, zatim −3 dB na f<sub>c</sub> = 1/(2πRC) ≈ 1,59 kHz i posle toga −20 dB/dekadi; faza ide od 0° do −90°, a kroz −45° prolazi na f<sub>c</sub>. <i>U praksi:</i> uklanjanje šuma sa signala senzora ili anti-aliasing filtar ispred AD konvertora.","<b>Paso bajo RC</b> (R = 1 kΩ, C = 100 nF). Plano en 0 dB, luego −3 dB en f<sub>c</sub> = 1/(2πRC) ≈ 1,59 kHz y después −20 dB/década; la fase va de 0° a −90° y pasa por −45° en f<sub>c</sub>. <i>En la práctica:</i> quitar ruido de la señal de un sensor o el filtro antialiasing delante de un ADC.","<b>Passe-bas RC</b> (R = 1 kΩ, C = 100 nF). Plat à 0 dB, puis −3 dB à f<sub>c</sub> = 1/(2πRC) ≈ 1,59 kHz et ensuite −20 dB/décade ; la phase va de 0° à −90° et passe par −45° à f<sub>c</sub>. <i>En pratique :</i> enlever le bruit d’un signal de capteur, ou le filtre anti-repliement devant un CAN.","<b>RC-Tiefpass</b> (R = 1 kΩ, C = 100 nF). Flach bei 0 dB, dann −3 dB bei f<sub>c</sub> = 1/(2πRC) ≈ 1,59 kHz und danach −20 dB/Dekade; die Phase geht von 0° nach −90° und passiert −45° bei f<sub>c</sub>. <i>In der Praxis:</i> Rauschen aus einem Sensorsignal entfernen oder das Anti-Aliasing-Filter vor einem ADC.","<b>RC 低通</b>（R = 1 kΩ，C = 100 nF）。在 0 dB 处平坦，在 f<sub>c</sub> = 1/(2πRC) ≈ 1.59 kHz 处为 −3 dB，之后以 −20 dB/十倍频下降；相位从 0° 变到 −90°，在 f<sub>c</sub> 处为 −45°。<i>实际应用：</i>去除传感器信号中的噪声，或 ADC 前的抗混叠滤波器。"],
th_bode_e2:["<b>RLC low-pass, 2nd order</b> (R = 141 Ω, L = 10 mH, C = 1 µF). Resonant frequency f₀ = 1/(2π√(LC)) ≈ 1.59 kHz and Q ≈ 0.71, so the curve is maximally flat (Butterworth) with no peak; above f₀ it falls at −40 dB/decade and the phase goes to −180°. Lower R → higher Q → a peak appears at f₀ (try the slider). <i>In practice:</i> output filter of a DC-DC converter, loudspeaker crossover.","<b>RLC niskopropusni, 2. red</b> (R = 141 Ω, L = 10 mH, C = 1 µF). Rezonantna frekvencija f₀ = 1/(2π√(LC)) ≈ 1,59 kHz i Q ≈ 0,71, pa je kriva maksimalno ravna (Batervort) bez pika; iznad f₀ pada −40 dB/dekadi, a faza ide do −180°. Manje R → veće Q → na f₀ se pojavljuje pik (probaj klizač). <i>U praksi:</i> izlazni filtar DC-DC konvertora, skretnica za zvučnike.","<b>Paso bajo RLC de 2.º orden</b> (R = 141 Ω, L = 10 mH, C = 1 µF). Frecuencia de resonancia f₀ = 1/(2π√(LC)) ≈ 1,59 kHz y Q ≈ 0,71, así que la curva es máximamente plana (Butterworth), sin pico; por encima de f₀ cae −40 dB/década y la fase llega a −180°. Menos R → más Q → aparece un pico en f₀ (prueba el deslizador). <i>En la práctica:</i> filtro de salida de un convertidor DC-DC, filtro divisor de altavoces.","<b>Passe-bas RLC du 2e ordre</b> (R = 141 Ω, L = 10 mH, C = 1 µF). Fréquence de résonance f₀ = 1/(2π√(LC)) ≈ 1,59 kHz et Q ≈ 0,71 : la courbe est maximalement plate (Butterworth), sans pic ; au-dessus de f₀ elle descend de −40 dB/décade et la phase va jusqu’à −180°. Moins de R → Q plus grand → un pic apparaît à f₀ (essayez le curseur). <i>En pratique :</i> filtre de sortie d’un convertisseur DC-DC, filtre de haut-parleurs.","<b>RLC-Tiefpass 2. Ordnung</b> (R = 141 Ω, L = 10 mH, C = 1 µF). Resonanzfrequenz f₀ = 1/(2π√(LC)) ≈ 1,59 kHz und Q ≈ 0,71, die Kurve ist also maximal flach (Butterworth) ohne Überhöhung; oberhalb von f₀ fällt sie mit −40 dB/Dekade und die Phase geht bis −180°. Kleineres R → größeres Q → bei f₀ entsteht eine Spitze (probiere den Schieberegler). <i>In der Praxis:</i> Ausgangsfilter eines DC-DC-Wandlers, Lautsprecherweiche.","<b>二阶 RLC 低通</b>（R = 141 Ω，L = 10 mH，C = 1 µF）。谐振频率 f₀ = 1/(2π√(LC)) ≈ 1.59 kHz，Q ≈ 0.71，所以曲线最平坦（巴特沃斯），没有峰；高于 f₀ 时以 −40 dB/十倍频下降，相位到 −180°。减小 R → Q 增大 → 在 f₀ 处出现峰（试试滑块）。<i>实际应用：</i>DC-DC 变换器的输出滤波器、扬声器分频器。"],
th_bode_e3:["<b>LC band-pass</b> (R = 1 kΩ, then L = 100 µH ∥ C = 100 nF to GND). At f₀ = 1/(2π√(LC)) ≈ 50.3 kHz the parallel LC has infinite impedance, so H = 1 (0 dB); away from f₀ the LC shorts the signal to GND. Slopes +20 and −20 dB/decade, phase from +90° through 0° to −90°. <i>In practice:</i> tuning a radio to one station, picking one frequency out of a mixture.","<b>LC propusnik opsega</b> (R = 1 kΩ, pa L = 100 µH ∥ C = 100 nF ka GND). Na f₀ = 1/(2π√(LC)) ≈ 50,3 kHz paralelno LC ima beskonačnu impedansu, pa je H = 1 (0 dB); dalje od f₀ LC kratko spaja signal na GND. Nagibi +20 i −20 dB/dekadi, faza od +90° preko 0° do −90°. <i>U praksi:</i> podešavanje radija na jednu stanicu, izdvajanje jedne frekvencije iz smeše.","<b>Paso banda LC</b> (R = 1 kΩ, luego L = 100 µH ∥ C = 100 nF a GND). En f₀ = 1/(2π√(LC)) ≈ 50,3 kHz el LC en paralelo tiene impedancia infinita, así que H = 1 (0 dB); lejos de f₀ el LC cortocircuita la señal a GND. Pendientes +20 y −20 dB/década, fase de +90° pasando por 0° hasta −90°. <i>En la práctica:</i> sintonizar una emisora de radio, separar una frecuencia de una mezcla.","<b>Passe-bande LC</b> (R = 1 kΩ, puis L = 100 µH ∥ C = 100 nF vers GND). À f₀ = 1/(2π√(LC)) ≈ 50,3 kHz, le LC parallèle a une impédance infinie, donc H = 1 (0 dB) ; loin de f₀, le LC court-circuite le signal vers GND. Pentes +20 et −20 dB/décade, phase de +90° en passant par 0° jusqu’à −90°. <i>En pratique :</i> accorder une radio sur une station, extraire une fréquence d’un mélange.","<b>LC-Bandpass</b> (R = 1 kΩ, dann L = 100 µH ∥ C = 100 nF nach GND). Bei f₀ = 1/(2π√(LC)) ≈ 50,3 kHz hat der Parallelschwingkreis unendliche Impedanz, also H = 1 (0 dB); abseits von f₀ schließt der LC-Kreis das Signal nach GND kurz. Steigungen +20 und −20 dB/Dekade, Phase von +90° über 0° nach −90°. <i>In der Praxis:</i> ein Radio auf einen Sender abstimmen, eine Frequenz aus einem Gemisch herausfiltern.","<b>LC 带通</b>（R = 1 kΩ，然后 L = 100 µH ∥ C = 100 nF 接 GND）。在 f₀ = 1/(2π√(LC)) ≈ 50.3 kHz 处并联 LC 的阻抗为无穷大，所以 H = 1（0 dB）；远离 f₀ 时 LC 把信号短路到 GND。斜率为 +20 和 −20 dB/十倍频，相位从 +90° 经 0° 到 −90°。<i>实际应用：</i>收音机调台，从混合信号中选出一个频率。"],
th_ohm_t:["the impedance plot (Ω)","grafik impedanse (Ω)","la gráfica de impedancia (Ω)","le graphe d’impédance (Ω)","das Impedanzdiagramm (Ω)","阻抗图（Ω）"],
th_ohm_what:["The magnitude |Z<sub>in</sub>| in ohms and the phase of the <b>input impedance</b>: the “resistance” that the source Vin sees between Vin and GND at each frequency. The current drawn from the source is I = V/Z, so where |Z| is small the circuit draws a lot of current, and where it is large it draws little. Both axes are logarithmic.","Moduo |Z<sub>in</sub>| u omima i faza <b>ulazne impedanse</b>: „otpornost\" koju izvor Vin vidi između Vin i GND na svakoj frekvenciji. Struja iz izvora je I = V/Z, pa tamo gde je |Z| malo kolo vuče mnogo struje, a gde je veliko, vuče malo. Obe ose su logaritamske.","El módulo |Z<sub>in</sub>| en ohmios y la fase de la <b>impedancia de entrada</b>: la «resistencia» que ve la fuente Vin entre Vin y GND en cada frecuencia. La corriente que entrega la fuente es I = V/Z: donde |Z| es pequeño el circuito consume mucha corriente y donde es grande, poca. Ambos ejes son logarítmicos.","Le module |Z<sub>in</sub>| en ohms et la phase de l’<b>impédance d’entrée</b> : la « résistance » que voit la source Vin entre Vin et GND à chaque fréquence. Le courant fourni est I = V/Z : là où |Z| est petit, le circuit tire beaucoup de courant, là où il est grand, peu. Les deux axes sont logarithmiques.","Betrag |Z<sub>in</sub>| in Ohm und Phase der <b>Eingangsimpedanz</b>: der „Widerstand“, den die Quelle Vin zwischen Vin und GND bei jeder Frequenz sieht. Der Strom aus der Quelle ist I = V/Z: wo |Z| klein ist, zieht die Schaltung viel Strom, wo es groß ist, wenig. Beide Achsen sind logarithmisch.","<b>输入阻抗</b>的幅值 |Z<sub>in</sub>|（欧姆）和相位：电源 Vin 在每个频率下在 Vin 与 GND 之间“看到”的“电阻”。电源提供的电流为 I = V/Z：|Z| 小的地方电路取很大电流，|Z| 大的地方取很小电流。两个轴都是对数刻度。"],
th_ohm_use:["Choosing and checking decoupling capacitors and power distribution (you want a low impedance over a wide band), finding the self-resonance of real components, checking how hard a circuit loads a source or an op-amp output, and the first step of impedance matching.","Izbor i provera blokadnih kondenzatora i napajanja (želiš nisku impedansu u širokom opsegu), pronalaženje sopstvene rezonanse realnih komponenti, provera koliko kolo opterećuje izvor ili izlaz operacionog pojačavača i prvi korak u prilagođenju impedanse.","Elegir y comprobar condensadores de desacoplo y la alimentación (se busca una impedancia baja en una banda ancha), encontrar la autorresonancia de componentes reales, comprobar cuánto carga un circuito a una fuente o a la salida de un amplificador operacional, y el primer paso de la adaptación de impedancias.","Choisir et vérifier les condensateurs de découplage et l’alimentation (on veut une impédance faible sur une large bande), trouver l’auto-résonance des composants réels, vérifier à quel point un circuit charge une source ou la sortie d’un ampli-op, et première étape de l’adaptation d’impédance.","Auswahl und Prüfung von Abblockkondensatoren und der Stromversorgung (man will eine niedrige Impedanz über ein breites Band), Finden der Eigenresonanz realer Bauteile, Prüfen, wie stark eine Schaltung eine Quelle oder einen OPV-Ausgang belastet, und der erste Schritt der Impedanzanpassung.","选择和检查去耦电容与电源网络（希望在宽频带内阻抗都很低），找出实际元件的自谐振，检查电路对电源或运放输出的负载有多重，以及阻抗匹配的第一步。"],
th_ohm_read:["<ul><li>A <b>resistor</b> is a horizontal line, phase 0°.</li><li>A <b>capacitor</b> falls by a factor of 10 for every decade (phase −90°); an <b>inductor</b> rises by 10× per decade (phase +90°).</li><li>A <b>dip</b> (minimum) is a series resonance: L and C cancel, only the resistance remains. A <b>peak</b> (maximum) is a parallel resonance (antiresonance).</li><li>Phase sign: <b>+</b> = the circuit behaves inductively, <b>−</b> = capacitively, <b>0°</b> = purely resistive (often exactly at a resonance).</li></ul>","<ul><li><b>Otpornik</b> je horizontalna linija, faza 0°.</li><li><b>Kondenzator</b> pada 10 puta po dekadi (faza −90°); <b>kalem</b> raste 10× po dekadi (faza +90°).</li><li><b>Udolina</b> (minimum) je redna rezonansa: L i C se poništavaju i ostaje samo otpornost. <b>Pik</b> (maksimum) je paralelna rezonansa (antirezonansa).</li><li>Znak faze: <b>+</b> = kolo se ponaša induktivno, <b>−</b> = kapacitivno, <b>0°</b> = čisto otporno (često tačno na rezonansi).</li></ul>","<ul><li>Una <b>resistencia</b> es una línea horizontal, fase 0°.</li><li>Un <b>condensador</b> baja 10 veces por década (fase −90°); una <b>bobina</b> sube 10× por década (fase +90°).</li><li>Un <b>valle</b> (mínimo) es una resonancia serie: L y C se anulan y solo queda la resistencia. Un <b>pico</b> (máximo) es una resonancia paralelo (antirresonancia).</li><li>Signo de la fase: <b>+</b> = el circuito es inductivo, <b>−</b> = capacitivo, <b>0°</b> = puramente resistivo (a menudo justo en una resonancia).</li></ul>","<ul><li>Une <b>résistance</b> est une ligne horizontale, phase 0°.</li><li>Un <b>condensateur</b> descend d’un facteur 10 par décade (phase −90°) ; une <b>bobine</b> monte de 10× par décade (phase +90°).</li><li>Un <b>creux</b> (minimum) est une résonance série : L et C s’annulent, il ne reste que la résistance. Un <b>pic</b> (maximum) est une résonance parallèle (antirésonance).</li><li>Signe de la phase : <b>+</b> = le circuit est inductif, <b>−</b> = capacitif, <b>0°</b> = purement résistif (souvent exactement à une résonance).</li></ul>","<ul><li>Ein <b>Widerstand</b> ist eine waagerechte Linie, Phase 0°.</li><li>Ein <b>Kondensator</b> fällt pro Dekade um den Faktor 10 (Phase −90°); eine <b>Spule</b> steigt um 10× pro Dekade (Phase +90°).</li><li>Ein <b>Tal</b> (Minimum) ist eine Reihenresonanz: L und C heben sich auf, nur der Widerstand bleibt. Eine <b>Spitze</b> (Maximum) ist eine Parallelresonanz (Antiresonanz).</li><li>Vorzeichen der Phase: <b>+</b> = induktiv, <b>−</b> = kapazitiv, <b>0°</b> = rein ohmsch (oft genau bei einer Resonanz).</li></ul>","<ul><li><b>电阻</b>是一条水平线，相位 0°。</li><li><b>电容</b>每十倍频程下降到 1/10（相位 −90°）；<b>电感</b>每十倍频程上升 10 倍（相位 +90°）。</li><li><b>谷</b>（最小值）是串联谐振：L 和 C 相互抵消，只剩电阻。<b>峰</b>（最大值）是并联谐振（反谐振）。</li><li>相位符号：<b>+</b> = 电路呈感性，<b>−</b> = 容性，<b>0°</b> = 纯电阻（通常正好在谐振处）。</li></ul>"],
th_ohm_e1:["<b>Real capacitor</b> (100 nF with ESR = 20 mΩ and ESL = 1 nH). The classic “V”: it falls like a capacitor, reaches the minimum at the self-resonant frequency f<sub>SRF</sub> = 1/(2π√(ESL·C)) ≈ 15.9 MHz, where |Z| = ESR, and above that it rises like an inductor. <i>In practice:</i> a 100 nF decoupling capacitor works well up to about this frequency; above it, it is effectively an inductor.","<b>Realan kondenzator</b> (100 nF sa ESR = 20 mΩ i ESL = 1 nH). Klasično „V\": pada kao kondenzator, dostiže minimum na sopstvenoj rezonantnoj frekvenciji f<sub>SRF</sub> = 1/(2π√(ESL·C)) ≈ 15,9 MHz, gde je |Z| = ESR, a iznad nje raste kao kalem. <i>U praksi:</i> blokadni kondenzator od 100 nF radi dobro otprilike do te frekvencije; iznad nje je u stvari kalem.","<b>Condensador real</b> (100 nF con ESR = 20 mΩ y ESL = 1 nH). La clásica «V»: baja como un condensador, llega al mínimo en la frecuencia de autorresonancia f<sub>SRF</sub> = 1/(2π√(ESL·C)) ≈ 15,9 MHz, donde |Z| = ESR, y por encima sube como una bobina. <i>En la práctica:</i> un condensador de desacoplo de 100 nF funciona bien hasta más o menos esta frecuencia; por encima es, en realidad, una bobina.","<b>Condensateur réel</b> (100 nF avec ESR = 20 mΩ et ESL = 1 nH). Le « V » classique : il descend comme un condensateur, atteint le minimum à la fréquence d’auto-résonance f<sub>SRF</sub> = 1/(2π√(ESL·C)) ≈ 15,9 MHz, où |Z| = ESR, puis remonte comme une bobine. <i>En pratique :</i> un condensateur de découplage de 100 nF fonctionne bien jusqu’à environ cette fréquence ; au-delà, c’est en fait une bobine.","<b>Realer Kondensator</b> (100 nF mit ESR = 20 mΩ und ESL = 1 nH). Das klassische „V“: er fällt wie ein Kondensator, erreicht das Minimum bei der Eigenresonanzfrequenz f<sub>SRF</sub> = 1/(2π√(ESL·C)) ≈ 15,9 MHz, wo |Z| = ESR ist, und steigt darüber wie eine Spule. <i>In der Praxis:</i> ein 100-nF-Abblockkondensator wirkt gut bis etwa zu dieser Frequenz; darüber ist er eigentlich eine Spule.","<b>实际电容</b>（100 nF，ESR = 20 mΩ，ESL = 1 nH）。经典的“V”形：先像电容一样下降，在自谐振频率 f<sub>SRF</sub> = 1/(2π√(ESL·C)) ≈ 15.9 MHz 处达到最小值，此时 |Z| = ESR，之后像电感一样上升。<i>实际应用：</i>100 nF 去耦电容大约在这个频率以下工作良好；高于它实际上就是一个电感。"],
th_ohm_e2:["<b>Three decoupling capacitors in parallel</b> (10 µF, 100 nF and 1 nF, each with its own ESR and ESL). Together they keep the impedance low over a much wider band than any single one, but between their resonances <b>antiresonance peaks</b> appear, where one capacitor already acts as an inductor and the next one still as a capacitor. <i>In practice:</i> this is why boards use several capacitor values, and why those peaks have to be checked.","<b>Tri blokadna kondenzatora paralelno</b> (10 µF, 100 nF i 1 nF, svaki sa svojim ESR i ESL). Zajedno drže impedansu niskom u mnogo širem opsegu nego bilo koji sam, ali između njihovih rezonansi nastaju <b>antirezonantni pikovi</b>, gde se jedan kondenzator već ponaša kao kalem, a sledeći još kao kondenzator. <i>U praksi:</i> zato se na pločama stavlja više vrednosti kondenzatora, i zato te pikove treba proveriti.","<b>Tres condensadores de desacoplo en paralelo</b> (10 µF, 100 nF y 1 nF, cada uno con su ESR y ESL). Juntos mantienen la impedancia baja en una banda mucho más ancha que cualquiera solo, pero entre sus resonancias aparecen <b>picos de antirresonancia</b>, donde un condensador ya actúa como bobina y el siguiente todavía como condensador. <i>En la práctica:</i> por eso las placas usan varios valores de condensador, y por eso hay que vigilar esos picos.","<b>Trois condensateurs de découplage en parallèle</b> (10 µF, 100 nF et 1 nF, chacun avec ses ESR et ESL). Ensemble, ils gardent l’impédance basse sur une bande bien plus large qu’un seul, mais entre leurs résonances apparaissent des <b>pics d’antirésonance</b>, où un condensateur se comporte déjà comme une bobine et le suivant encore comme un condensateur. <i>En pratique :</i> c’est pourquoi les cartes utilisent plusieurs valeurs, et pourquoi il faut vérifier ces pics.","<b>Drei Abblockkondensatoren parallel</b> (10 µF, 100 nF und 1 nF, jeder mit eigenem ESR und ESL). Zusammen halten sie die Impedanz über ein viel breiteres Band niedrig als jeder allein, aber zwischen ihren Resonanzen entstehen <b>Antiresonanzspitzen</b>, wo ein Kondensator schon als Spule wirkt und der nächste noch als Kondensator. <i>In der Praxis:</i> deshalb verwendet man auf Platinen mehrere Kondensatorwerte, und deshalb muss man diese Spitzen prüfen.","<b>三个去耦电容并联</b>（10 µF、100 nF 和 1 nF，各有自己的 ESR 和 ESL）。它们一起能在比任何一个单独电容宽得多的频带内保持低阻抗，但在各自谐振之间会出现<b>反谐振峰</b>：一个电容已经表现为电感，而下一个仍是电容。<i>实际应用：</i>这就是电路板上要用多种电容值的原因，也是必须检查这些峰的原因。"],
th_ohm_e3:["<b>Real inductor</b> (10 µH with R<sub>dc</sub> = 0.1 Ω and C<sub>p</sub> = 5 pF between the windings). At low frequency |Z| ≈ R<sub>dc</sub>, then it rises like an inductor, peaks at f<sub>SRF</sub> = 1/(2π√(L·C<sub>p</sub>)) ≈ 22.5 MHz and above that falls like a capacitor. <i>In practice:</i> a choke in a filter stops blocking interference above its self-resonance.","<b>Realan kalem</b> (10 µH sa R<sub>dc</sub> = 0,1 Ω i C<sub>p</sub> = 5 pF između navojaka). Na niskim frekvencijama |Z| ≈ R<sub>dc</sub>, zatim raste kao kalem, ima pik na f<sub>SRF</sub> = 1/(2π√(L·C<sub>p</sub>)) ≈ 22,5 MHz i iznad toga pada kao kondenzator. <i>U praksi:</i> prigušnica u filtru prestaje da blokira smetnje iznad svoje sopstvene rezonanse.","<b>Bobina real</b> (10 µH con R<sub>dc</sub> = 0,1 Ω y C<sub>p</sub> = 5 pF entre espiras). A baja frecuencia |Z| ≈ R<sub>dc</sub>; luego sube como bobina, tiene un pico en f<sub>SRF</sub> = 1/(2π√(L·C<sub>p</sub>)) ≈ 22,5 MHz y por encima baja como un condensador. <i>En la práctica:</i> un choque de filtro deja de bloquear interferencias por encima de su autorresonancia.","<b>Bobine réelle</b> (10 µH avec R<sub>dc</sub> = 0,1 Ω et C<sub>p</sub> = 5 pF entre spires). À basse fréquence |Z| ≈ R<sub>dc</sub> ; ensuite elle monte comme une bobine, culmine à f<sub>SRF</sub> = 1/(2π√(L·C<sub>p</sub>)) ≈ 22,5 MHz et au-delà descend comme un condensateur. <i>En pratique :</i> une self de filtrage cesse de bloquer les parasites au-dessus de son auto-résonance.","<b>Reale Spule</b> (10 µH mit R<sub>dc</sub> = 0,1 Ω und C<sub>p</sub> = 5 pF zwischen den Windungen). Bei niedriger Frequenz ist |Z| ≈ R<sub>dc</sub>, dann steigt sie wie eine Spule, hat eine Spitze bei f<sub>SRF</sub> = 1/(2π√(L·C<sub>p</sub>)) ≈ 22,5 MHz und fällt darüber wie ein Kondensator. <i>In der Praxis:</i> eine Drossel in einem Filter blockiert oberhalb ihrer Eigenresonanz keine Störungen mehr.","<b>实际电感</b>（10 µH，R<sub>dc</sub> = 0.1 Ω，匝间电容 C<sub>p</sub> = 5 pF）。低频时 |Z| ≈ R<sub>dc</sub>，然后像电感一样上升，在 f<sub>SRF</sub> = 1/(2π√(L·C<sub>p</sub>)) ≈ 22.5 MHz 处达到峰值，之后像电容一样下降。<i>实际应用：</i>滤波扼流圈在其自谐振频率以上就不再阻挡干扰。"],
th_nyq_t:["the Nyquist plot","Nikvistov dijagram","el diagrama de Nyquist","le diagramme de Nyquist","das Nyquist-Diagramm","奈奎斯特图"],
th_nyq_what:["The same H(jω) as on the Bode plot, but drawn as one curve in the complex plane: for each frequency there is one point, with the real part horizontally and the imaginary part vertically. The <b>distance from the origin</b> is |H| and the <b>angle</b> from the positive real axis is the phase. Frequency is not on any axis: it runs along the curve (the arrows), and the cursor shows which frequency a point belongs to.","Isto H(jω) kao na Bodeovom dijagramu, ali nacrtano kao jedna kriva u kompleksnoj ravni: za svaku frekvenciju postoji jedna tačka, sa realnim delom horizontalno i imaginarnim vertikalno. <b>Udaljenost od koordinatnog početka</b> je |H|, a <b>ugao</b> od pozitivne realne ose je faza. Frekvencija nije ni na jednoj osi: ona teče duž krive (strelice), a kursor pokazuje kojoj frekvenciji tačka pripada.","El mismo H(jω) del diagrama de Bode, pero dibujado como una sola curva en el plano complejo: cada frecuencia es un punto, con la parte real en horizontal y la imaginaria en vertical. La <b>distancia al origen</b> es |H| y el <b>ángulo</b> respecto al eje real positivo es la fase. La frecuencia no está en ningún eje: recorre la curva (las flechas), y el cursor muestra a qué frecuencia pertenece cada punto.","Le même H(jω) que sur le diagramme de Bode, mais tracé comme une seule courbe dans le plan complexe : chaque fréquence est un point, partie réelle à l’horizontale, partie imaginaire à la verticale. La <b>distance à l’origine</b> est |H| et l’<b>angle</b> par rapport à l’axe réel positif est la phase. La fréquence n’est sur aucun axe : elle parcourt la courbe (les flèches), et le curseur indique à quelle fréquence correspond un point.","Dasselbe H(jω) wie im Bode-Diagramm, aber als eine einzige Kurve in der komplexen Ebene: jede Frequenz ist ein Punkt, Realteil waagerecht, Imaginärteil senkrecht. Der <b>Abstand vom Ursprung</b> ist |H|, der <b>Winkel</b> zur positiven reellen Achse ist die Phase. Die Frequenz steht auf keiner Achse: sie läuft entlang der Kurve (Pfeile), und der Cursor zeigt, zu welcher Frequenz ein Punkt gehört.","与伯德图相同的 H(jω)，但画成复平面上的一条曲线：每个频率是一个点，横轴为实部，纵轴为虚部。<b>到原点的距离</b>是 |H|，与正实轴的<b>夹角</b>是相位。频率不在任何轴上：它沿曲线变化（箭头），光标会显示某个点对应的频率。"],
th_nyq_use:["Above all in control engineering: the Nyquist stability criterion says that a feedback loop becomes unstable if the curve of the loop gain encircles the point −1. The closer the curve passes to −1, the more the system rings and overshoots. For filters it gives a compact view of the whole response: a 1st-order circuit is a semicircle, a resonance is a full circle.","Pre svega u automatskom upravljanju: Nikvistov kriterijum stabilnosti kaže da povratna sprega postaje nestabilna ako kriva pojačanja petlje obiđe tačku −1. Što kriva prolazi bliže tački −1, to sistem više zvoni i ima veći preskok. Za filtre daje sažet pogled na ceo odziv: kolo 1. reda je polukrug, rezonansa je ceo krug.","Sobre todo en control automático: el criterio de estabilidad de Nyquist dice que un lazo realimentado se vuelve inestable si la curva de la ganancia de lazo rodea el punto −1. Cuanto más cerca pasa la curva de −1, más oscila y sobrepasa el sistema. En filtros da una visión compacta de toda la respuesta: un circuito de 1.er orden es un semicírculo, una resonancia es un círculo completo.","Surtout en automatique : le critère de stabilité de Nyquist dit qu’une boucle de rétroaction devient instable si la courbe du gain de boucle entoure le point −1. Plus la courbe passe près de −1, plus le système oscille et dépasse. Pour les filtres, il donne une vue compacte de toute la réponse : un circuit du 1er ordre est un demi-cercle, une résonance un cercle complet.","Vor allem in der Regelungstechnik: Das Nyquist-Kriterium besagt, dass ein Regelkreis instabil wird, wenn die Kurve der Schleifenverstärkung den Punkt −1 umschließt. Je näher die Kurve an −1 vorbeigeht, desto stärker schwingt das System und überschwingt. Für Filter liefert es einen kompakten Blick auf den ganzen Frequenzgang: eine Schaltung 1. Ordnung ist ein Halbkreis, eine Resonanz ein Vollkreis.","主要用于自动控制：奈奎斯特稳定判据指出，如果开环增益曲线包围点 −1，闭环系统就会不稳定。曲线离 −1 越近，系统振荡和超调越厉害。对滤波器来说，它能紧凑地显示整个响应：一阶电路是半圆，谐振是整圆。"],
th_nyq_read:["<ul><li>The empty circle marks the <b>start</b> (lowest frequency); follow the arrows to the end.</li><li>A point on the <b>positive real axis</b> means phase 0°; on the negative real axis, −180°.</li><li>The lower half (Im &lt; 0) means the output lags the input; the upper half means it leads.</li><li>The dashed curve is the mirror image for negative frequencies; it is drawn for completeness (needed for the stability criterion).</li><li>With two fingers you can zoom, the ⟲ button resets the view.</li></ul>","<ul><li>Prazan kružić označava <b>početak</b> (najnižu frekvenciju); prati strelice do kraja.</li><li>Tačka na <b>pozitivnoj realnoj osi</b> znači fazu 0°; na negativnoj realnoj osi −180°.</li><li>Donja polovina (Im &lt; 0) znači da izlaz kasni za ulazom; gornja da prednjači.</li><li>Isprekidana kriva je odraz za negativne frekvencije; crta se radi potpunosti (potrebna je za kriterijum stabilnosti).</li><li>Sa dva prsta zumiraš, a dugme ⟲ vraća pogled.</li></ul>","<ul><li>El círculo vacío marca el <b>inicio</b> (frecuencia más baja); sigue las flechas hasta el final.</li><li>Un punto sobre el <b>eje real positivo</b> significa fase 0°; sobre el eje real negativo, −180°.</li><li>La mitad inferior (Im &lt; 0) significa que la salida va retrasada; la superior, adelantada.</li><li>La curva discontinua es la imagen especular para frecuencias negativas; se dibuja para completar (la necesita el criterio de estabilidad).</li><li>Con dos dedos haces zoom; el botón ⟲ restablece la vista.</li></ul>","<ul><li>Le cercle vide marque le <b>début</b> (fréquence la plus basse) ; suivez les flèches jusqu’à la fin.</li><li>Un point sur l’<b>axe réel positif</b> signifie une phase de 0° ; sur l’axe réel négatif, −180°.</li><li>La moitié inférieure (Im &lt; 0) signifie que la sortie est en retard ; la moitié supérieure, en avance.</li><li>La courbe en pointillés est l’image miroir pour les fréquences négatives ; elle est tracée pour être complet (nécessaire au critère de stabilité).</li><li>Zoomez avec deux doigts ; le bouton ⟲ réinitialise la vue.</li></ul>","<ul><li>Der leere Kreis markiert den <b>Anfang</b> (niedrigste Frequenz); folge den Pfeilen bis zum Ende.</li><li>Ein Punkt auf der <b>positiven reellen Achse</b> bedeutet Phase 0°, auf der negativen reellen Achse −180°.</li><li>Die untere Hälfte (Im &lt; 0) bedeutet, dass der Ausgang nacheilt; die obere, dass er voreilt.</li><li>Die gestrichelte Kurve ist das Spiegelbild für negative Frequenzen; sie wird der Vollständigkeit halber gezeichnet (für das Stabilitätskriterium nötig).</li><li>Mit zwei Fingern zoomen, die Taste ⟲ setzt die Ansicht zurück.</li></ul>","<ul><li>空心圆表示<b>起点</b>（最低频率）；沿箭头看到终点。</li><li>点在<b>正实轴</b>上表示相位 0°；在负实轴上表示 −180°。</li><li>下半平面（Im &lt; 0）表示输出滞后于输入；上半平面表示超前。</li><li>虚线是负频率的镜像；画出来是为了完整（稳定判据需要它）。</li><li>用两指缩放，⟲ 按钮恢复视图。</li></ul>"],
th_nyq_e1:["<b>RC low-pass.</b> A semicircle in the lower half, from 1 (DC passes completely) to 0 (high frequencies are blocked). At the cutoff frequency f<sub>c</sub> ≈ 1.59 kHz the point is at 0.5 − j0.5: the lowest point of the semicircle, phase −45°, |H| = 0.707 (−3 dB). <i>In practice:</i> every 1st-order lag (thermal system, motor, RC delay) looks like this.","<b>RC niskopropusni.</b> Polukrug u donjoj polovini, od 1 (DC prolazi u potpunosti) do 0 (visoke frekvencije su blokirane). Na graničnoj frekvenciji f<sub>c</sub> ≈ 1,59 kHz tačka je u 0,5 − j0,5: najniža tačka polukruga, faza −45°, |H| = 0,707 (−3 dB). <i>U praksi:</i> svako kašnjenje 1. reda (termički sistem, motor, RC kašnjenje) izgleda ovako.","<b>Paso bajo RC.</b> Un semicírculo en la mitad inferior, de 1 (la continua pasa entera) a 0 (las altas frecuencias se bloquean). En la frecuencia de corte f<sub>c</sub> ≈ 1,59 kHz el punto está en 0,5 − j0,5: el punto más bajo del semicírculo, fase −45°, |H| = 0,707 (−3 dB). <i>En la práctica:</i> todo retardo de 1.er orden (sistema térmico, motor, retardo RC) tiene esta forma.","<b>Passe-bas RC.</b> Un demi-cercle dans la moitié inférieure, de 1 (le continu passe entièrement) à 0 (les hautes fréquences sont bloquées). À la coupure f<sub>c</sub> ≈ 1,59 kHz le point est en 0,5 − j0,5 : le point le plus bas du demi-cercle, phase −45°, |H| = 0,707 (−3 dB). <i>En pratique :</i> tout retard du 1er ordre (système thermique, moteur, retard RC) a cette forme.","<b>RC-Tiefpass.</b> Ein Halbkreis in der unteren Hälfte, von 1 (Gleichspannung kommt ganz durch) bis 0 (hohe Frequenzen werden gesperrt). Bei der Grenzfrequenz f<sub>c</sub> ≈ 1,59 kHz liegt der Punkt bei 0,5 − j0,5: der tiefste Punkt des Halbkreises, Phase −45°, |H| = 0,707 (−3 dB). <i>In der Praxis:</i> jede Verzögerung 1. Ordnung (thermisches System, Motor, RC-Glied) sieht so aus.","<b>RC 低通。</b>下半平面的一个半圆，从 1（直流完全通过）到 0（高频被阻断）。在截止频率 f<sub>c</sub> ≈ 1.59 kHz 处，点位于 0.5 − j0.5：半圆的最低点，相位 −45°，|H| = 0.707（−3 dB）。<i>实际应用：</i>所有一阶惯性环节（热系统、电机、RC 延迟）都是这个形状。"],
th_nyq_e2:["<b>RC high-pass</b> (C = 100 nF, R = 1 kΩ). The same semicircle, but in the upper half and running the other way: from 0 (DC blocked) to 1 (high frequencies pass). At f<sub>c</sub> the point is at 0.5 + j0.5, phase +45°. <i>In practice:</i> the coupling capacitor that removes the DC component between two amplifier stages.","<b>RC visokopropusni</b> (C = 100 nF, R = 1 kΩ). Isti polukrug, ali u gornjoj polovini i u suprotnom smeru: od 0 (DC blokiran) do 1 (visoke frekvencije prolaze). Na f<sub>c</sub> tačka je u 0,5 + j0,5, faza +45°. <i>U praksi:</i> sprežni kondenzator koji uklanja DC komponentu između dva stepena pojačavača.","<b>Paso alto RC</b> (C = 100 nF, R = 1 kΩ). El mismo semicírculo, pero en la mitad superior y en sentido contrario: de 0 (continua bloqueada) a 1 (las altas frecuencias pasan). En f<sub>c</sub> el punto está en 0,5 + j0,5, fase +45°. <i>En la práctica:</i> el condensador de acoplo que elimina la componente continua entre dos etapas de un amplificador.","<b>Passe-haut RC</b> (C = 100 nF, R = 1 kΩ). Le même demi-cercle, mais dans la moitié supérieure et dans l’autre sens : de 0 (continu bloqué) à 1 (les hautes fréquences passent). À f<sub>c</sub> le point est en 0,5 + j0,5, phase +45°. <i>En pratique :</i> le condensateur de liaison qui supprime la composante continue entre deux étages d’amplificateur.","<b>RC-Hochpass</b> (C = 100 nF, R = 1 kΩ). Derselbe Halbkreis, aber in der oberen Hälfte und in umgekehrter Richtung: von 0 (Gleichspannung gesperrt) bis 1 (hohe Frequenzen kommen durch). Bei f<sub>c</sub> liegt der Punkt bei 0,5 + j0,5, Phase +45°. <i>In der Praxis:</i> der Koppelkondensator, der den Gleichanteil zwischen zwei Verstärkerstufen entfernt.","<b>RC 高通</b>（C = 100 nF，R = 1 kΩ）。同样的半圆，但在上半平面且方向相反：从 0（直流被阻断）到 1（高频通过）。在 f<sub>c</sub> 处点位于 0.5 + j0.5，相位 +45°。<i>实际应用：</i>两级放大器之间去除直流分量的耦合电容。"],
th_nyq_e3:["<b>LC band-pass</b> (f₀ ≈ 50.3 kHz). A full circle with diameter from 0 to 1: it starts at 0, goes through the upper half, touches 1 exactly at f₀ (phase 0°) and returns to 0 through the lower half. The faster the point moves around the circle near f₀, the narrower the band (higher Q). <i>In practice:</i> resonant circuits in radios and oscillators.","<b>LC propusnik opsega</b> (f₀ ≈ 50,3 kHz). Ceo krug sa prečnikom od 0 do 1: počinje u 0, ide kroz gornju polovinu, dodiruje 1 tačno na f₀ (faza 0°) i vraća se u 0 kroz donju polovinu. Što se tačka brže kreće po krugu oko f₀, to je opseg uži (veće Q). <i>U praksi:</i> rezonantna kola u radio-prijemnicima i oscilatorima.","<b>Paso banda LC</b> (f₀ ≈ 50,3 kHz). Un círculo completo de diámetro 0 a 1: empieza en 0, recorre la mitad superior, toca 1 exactamente en f₀ (fase 0°) y vuelve a 0 por la mitad inferior. Cuanto más rápido gira el punto cerca de f₀, más estrecha es la banda (Q mayor). <i>En la práctica:</i> circuitos resonantes de radios y osciladores.","<b>Passe-bande LC</b> (f₀ ≈ 50,3 kHz). Un cercle complet de diamètre 0 à 1 : il part de 0, parcourt la moitié supérieure, touche 1 exactement à f₀ (phase 0°) et revient à 0 par la moitié inférieure. Plus le point tourne vite autour de f₀, plus la bande est étroite (Q élevé). <i>En pratique :</i> circuits résonants des radios et des oscillateurs.","<b>LC-Bandpass</b> (f₀ ≈ 50,3 kHz). Ein Vollkreis mit Durchmesser von 0 bis 1: er beginnt bei 0, läuft durch die obere Hälfte, berührt 1 genau bei f₀ (Phase 0°) und kehrt durch die untere Hälfte zu 0 zurück. Je schneller der Punkt um f₀ herum läuft, desto schmaler das Band (höheres Q). <i>In der Praxis:</i> Schwingkreise in Radios und Oszillatoren.","<b>LC 带通</b>（f₀ ≈ 50.3 kHz）。一个直径从 0 到 1 的整圆：从 0 开始，经过上半平面，恰好在 f₀ 处碰到 1（相位 0°），再经下半平面回到 0。点在 f₀ 附近转得越快，频带越窄（Q 越高）。<i>实际应用：</i>收音机和振荡器中的谐振电路。"],
th_spec_t:["the Fourier spectrum","Furijeov spektar","el espectro de Fourier","le spectre de Fourier","das Fourier-Spektrum","傅里叶频谱"],
th_spec_what:["Every periodic signal (square, triangle, sawtooth, pulse) is a sum of sines at the fundamental frequency f₀ and its multiples 2f₀, 3f₀, … (harmonics). The upper graph shows the <b>amplitude of each harmonic</b> as a bar, at the input and at the output. The lower graph shows <b>both signals in time</b>. Choose the input waveform and f₀ above the graph.","Svaki periodični signal (pravougaoni, trougaoni, testerasti, impulsni) je zbir sinusoida na osnovnoj frekvenciji f₀ i njenim umnošcima 2f₀, 3f₀, … (harmonici). Gornji grafik prikazuje <b>amplitudu svakog harmonika</b> kao stubić, na ulazu i na izlazu. Donji grafik prikazuje <b>oba signala u vremenu</b>. Talasni oblik ulaza i f₀ biraš iznad grafika.","Toda señal periódica (cuadrada, triangular, diente de sierra, pulso) es una suma de senoides en la frecuencia fundamental f₀ y sus múltiplos 2f₀, 3f₀, … (armónicos). La gráfica de arriba muestra la <b>amplitud de cada armónico</b> como una barra, en la entrada y en la salida. La de abajo muestra <b>ambas señales en el tiempo</b>. La forma de onda de entrada y f₀ se eligen encima de la gráfica.","Tout signal périodique (carré, triangle, dent de scie, impulsion) est une somme de sinusoïdes à la fréquence fondamentale f₀ et à ses multiples 2f₀, 3f₀, … (harmoniques). Le graphe du haut montre l’<b>amplitude de chaque harmonique</b> sous forme de barre, à l’entrée et à la sortie. Celui du bas montre <b>les deux signaux dans le temps</b>. La forme d’onde d’entrée et f₀ se choisissent au-dessus du graphe.","Jedes periodische Signal (Rechteck, Dreieck, Sägezahn, Puls) ist eine Summe von Sinusschwingungen bei der Grundfrequenz f₀ und ihren Vielfachen 2f₀, 3f₀, … (Harmonische). Das obere Diagramm zeigt die <b>Amplitude jeder Harmonischen</b> als Balken, am Eingang und am Ausgang. Das untere zeigt <b>beide Signale im Zeitverlauf</b>. Eingangssignalform und f₀ wählst du oberhalb des Diagramms.","任何周期信号（方波、三角波、锯齿波、脉冲）都是基频 f₀ 及其倍频 2f₀、3f₀ …（谐波）正弦波之和。上图用柱条显示输入和输出中<b>每个谐波的幅值</b>。下图显示<b>两个信号的时域波形</b>。输入波形和 f₀ 在图上方选择。"],
th_spec_use:["To see what a circuit does to a real, non-sinusoidal signal: a clock, PWM, a digital edge, a buzzer tone. You see which harmonics a filter removes, why edges get rounded, how a PWM signal becomes a DC voltage, and how much distortion (THD) remains.","Da vidiš šta kolo radi stvarnom, nesinusnom signalu: taktu, PWM-u, digitalnoj ivici, tonu zujalice. Vidiš koje harmonike filtar uklanja, zašto se ivice zaobljavaju, kako PWM signal postaje DC napon i koliko izobličenja (THD) ostaje.","Ver qué le hace un circuito a una señal real no senoidal: un reloj, un PWM, un flanco digital, el tono de un zumbador. Ves qué armónicos elimina un filtro, por qué se redondean los flancos, cómo un PWM se convierte en tensión continua y cuánta distorsión (THD) queda.","Voir ce qu’un circuit fait à un vrai signal non sinusoïdal : une horloge, un PWM, un front numérique, le son d’un buzzer. On voit quelles harmoniques un filtre enlève, pourquoi les fronts s’arrondissent, comment un PWM devient une tension continue et combien de distorsion (THD) reste.","Um zu sehen, was eine Schaltung mit einem echten, nicht sinusförmigen Signal macht: einem Takt, PWM, einer digitalen Flanke, dem Ton eines Summers. Man sieht, welche Harmonischen ein Filter entfernt, warum Flanken abgerundet werden, wie aus PWM eine Gleichspannung wird und wie viel Verzerrung (THD) übrig bleibt.","用来看电路对真实的非正弦信号做了什么：时钟、PWM、数字边沿、蜂鸣器的声音。可以看到滤波器去掉了哪些谐波、为什么边沿会变圆、PWM 如何变成直流电压，以及还剩多少失真（THD）。"],
th_spec_read:["<ul><li>Each bar is <b>one sine</b>: its position is its frequency (n·f₀), its height is its amplitude.</li><li>The circuit multiplies every bar by |H| at that frequency, which you can read on the Bode plot. That is the whole trick: a linear circuit treats each harmonic separately.</li><li>A square wave has only odd harmonics with amplitudes 4/(nπ): 1, 1/3, 1/5, … The sharper the edges, the more high harmonics.</li><li>If the output bars beyond the first are almost gone, the output is almost a pure sine.</li></ul>","<ul><li>Svaki stubić je <b>jedna sinusoida</b>: položaj je njena frekvencija (n·f₀), visina je amplituda.</li><li>Kolo množi svaki stubić sa |H| na toj frekvenciji, što možeš pročitati na Bodeovom dijagramu. To je ceo trik: linearno kolo svaki harmonik tretira posebno.</li><li>Pravougaoni signal ima samo neparne harmonike sa amplitudama 4/(nπ): 1, 1/3, 1/5, … Što su ivice oštrije, to je više visokih harmonika.</li><li>Ako su na izlazu stubići posle prvog skoro nestali, izlaz je skoro čista sinusoida.</li></ul>","<ul><li>Cada barra es <b>una senoide</b>: su posición es su frecuencia (n·f₀) y su altura, su amplitud.</li><li>El circuito multiplica cada barra por |H| a esa frecuencia, que puedes leer en el diagrama de Bode. Ese es todo el truco: un circuito lineal trata cada armónico por separado.</li><li>Una onda cuadrada solo tiene armónicos impares de amplitud 4/(nπ): 1, 1/3, 1/5, … Cuanto más abruptos los flancos, más armónicos altos.</li><li>Si en la salida casi desaparecen las barras después de la primera, la salida es casi una senoide pura.</li></ul>","<ul><li>Chaque barre est <b>une sinusoïde</b> : sa position est sa fréquence (n·f₀), sa hauteur son amplitude.</li><li>Le circuit multiplie chaque barre par |H| à cette fréquence, que l’on lit sur le diagramme de Bode. C’est tout le principe : un circuit linéaire traite chaque harmonique séparément.</li><li>Un signal carré n’a que des harmoniques impaires d’amplitude 4/(nπ) : 1, 1/3, 1/5, … Plus les fronts sont raides, plus il y a d’harmoniques élevées.</li><li>Si, en sortie, les barres après la première ont presque disparu, la sortie est presque une sinusoïde pure.</li></ul>","<ul><li>Jeder Balken ist <b>eine Sinusschwingung</b>: seine Position ist die Frequenz (n·f₀), seine Höhe die Amplitude.</li><li>Die Schaltung multipliziert jeden Balken mit |H| bei dieser Frequenz, das kannst du im Bode-Diagramm ablesen. Das ist der ganze Trick: eine lineare Schaltung behandelt jede Harmonische einzeln.</li><li>Ein Rechteck hat nur ungerade Harmonische mit den Amplituden 4/(nπ): 1, 1/3, 1/5, … Je steiler die Flanken, desto mehr hohe Harmonische.</li><li>Wenn am Ausgang die Balken nach dem ersten fast verschwunden sind, ist der Ausgang fast ein reiner Sinus.</li></ul>","<ul><li>每根柱条是<b>一个正弦波</b>：位置是它的频率（n·f₀），高度是它的幅值。</li><li>电路把每根柱条乘以该频率处的 |H|，这个值可以在伯德图上读出。这就是全部诀窍：线性电路对每个谐波分别处理。</li><li>方波只有奇次谐波，幅值为 4/(nπ)：1、1/3、1/5 … 边沿越陡，高次谐波越多。</li><li>如果输出中第一根之后的柱条几乎消失，输出就几乎是纯正弦波。</li></ul>"],
th_spec_e1:["<b>Square wave 1 kHz into an RC low-pass</b> (f<sub>c</sub> ≈ 1.59 kHz). The fundamental passes almost unchanged, but the 3rd, 5th, 7th… harmonics are reduced more and more, so the output edges become rounded exponential curves (the capacitor charging and discharging). <i>In practice:</i> why a digital signal on a long cable or a slow line loses its sharp edges.","<b>Pravougaoni 1 kHz u RC niskopropusni</b> (f<sub>c</sub> ≈ 1,59 kHz). Osnovni harmonik prolazi skoro nepromenjen, ali 3., 5., 7.… harmonici su sve više oslabljeni, pa ivice na izlazu postaju zaobljene eksponencijalne krive (punjenje i pražnjenje kondenzatora). <i>U praksi:</i> zašto digitalni signal na dugom kablu ili sporoj liniji gubi oštre ivice.","<b>Cuadrada de 1 kHz en un paso bajo RC</b> (f<sub>c</sub> ≈ 1,59 kHz). El fundamental pasa casi sin cambios, pero los armónicos 3.º, 5.º, 7.º… se atenúan cada vez más, así que los flancos de salida se convierten en curvas exponenciales redondeadas (carga y descarga del condensador). <i>En la práctica:</i> por qué una señal digital en un cable largo o una línea lenta pierde sus flancos abruptos.","<b>Carré 1 kHz dans un passe-bas RC</b> (f<sub>c</sub> ≈ 1,59 kHz). Le fondamental passe presque inchangé, mais les harmoniques 3, 5, 7… sont de plus en plus atténuées : les fronts de sortie deviennent des courbes exponentielles arrondies (charge et décharge du condensateur). <i>En pratique :</i> pourquoi un signal numérique sur un long câble ou une ligne lente perd ses fronts raides.","<b>Rechteck 1 kHz in einen RC-Tiefpass</b> (f<sub>c</sub> ≈ 1,59 kHz). Die Grundschwingung kommt fast unverändert durch, aber die 3., 5., 7. … Harmonische werden immer stärker gedämpft, sodass die Flanken am Ausgang zu abgerundeten Exponentialkurven werden (Laden und Entladen des Kondensators). <i>In der Praxis:</i> warum ein Digitalsignal auf einem langen Kabel oder einer langsamen Leitung seine steilen Flanken verliert.","<b>1 kHz 方波输入 RC 低通</b>（f<sub>c</sub> ≈ 1.59 kHz）。基波几乎原样通过，但 3、5、7 … 次谐波被衰减得越来越多，所以输出边沿变成圆滑的指数曲线（电容充放电）。<i>实际应用：</i>这解释了为什么长电缆或慢速线路上的数字信号会失去陡峭的边沿。"],
th_spec_e2:["<b>Square wave at 50.3 kHz into the LC band-pass</b> tuned to the same frequency. Only the fundamental lands on the resonance; the 3rd harmonic (151 kHz) and higher are strongly suppressed, so the output is almost a pure sine. <i>In practice:</i> making a sine from a square wave, e.g. in wireless charging or class-E transmitters.","<b>Pravougaoni 50,3 kHz u LC propusnik opsega</b> podešen na istu frekvenciju. Samo osnovni harmonik pada na rezonansu; 3. harmonik (151 kHz) i viši su jako oslabljeni, pa je izlaz skoro čista sinusoida. <i>U praksi:</i> pravljenje sinusoide od pravougaonog signala, npr. kod bežičnog punjenja ili predajnika klase E.","<b>Cuadrada de 50,3 kHz en el paso banda LC</b> sintonizado a la misma frecuencia. Solo el fundamental cae en la resonancia; el 3.er armónico (151 kHz) y los superiores se atenúan mucho, así que la salida es casi una senoide pura. <i>En la práctica:</i> obtener una senoide a partir de una cuadrada, p. ej. en carga inalámbrica o transmisores de clase E.","<b>Carré 50,3 kHz dans le passe-bande LC</b> accordé sur la même fréquence. Seul le fondamental tombe sur la résonance ; la 3e harmonique (151 kHz) et les suivantes sont fortement atténuées : la sortie est presque une sinusoïde pure. <i>En pratique :</i> fabriquer une sinusoïde à partir d’un carré, p. ex. en recharge sans fil ou dans les émetteurs de classe E.","<b>Rechteck mit 50,3 kHz in den LC-Bandpass</b>, abgestimmt auf dieselbe Frequenz. Nur die Grundschwingung trifft die Resonanz; die 3. Harmonische (151 kHz) und höhere werden stark gedämpft, der Ausgang ist fast ein reiner Sinus. <i>In der Praxis:</i> aus einem Rechteck einen Sinus machen, z. B. beim kabellosen Laden oder in Klasse-E-Sendern.","<b>50.3 kHz 方波输入调谐在同一频率的 LC 带通</b>。只有基波落在谐振点上；3 次谐波（151 kHz）及更高次被强烈衰减，所以输出几乎是纯正弦波。<i>实际应用：</i>由方波得到正弦波，例如无线充电或 E 类发射机。"],
th_spec_e3:["<b>PWM pulse (20 % duty cycle) at 20 kHz into the 2nd-order RLC low-pass</b> (f₀ ≈ 1.59 kHz). The DC component (the average value, 0.2) passes completely, while the 20 kHz harmonics are far above f₀ and are attenuated by about 40 dB/decade. The output is an almost constant voltage of 0.2 with a tiny ripple. <i>In practice:</i> exactly how a buck converter or a PWM “DAC” on a microcontroller turns pulses into a DC voltage.","<b>PWM impuls (faktor ispune 20 %) na 20 kHz u RLC niskopropusni 2. reda</b> (f₀ ≈ 1,59 kHz). DC komponenta (srednja vrednost, 0,2) prolazi u potpunosti, a harmonici na 20 kHz su daleko iznad f₀ i slabe oko 40 dB/dekadi. Izlaz je skoro konstantan napon 0,2 sa sitnom talasnošću. <i>U praksi:</i> upravo tako buck konvertor ili PWM „DAC\" na mikrokontroleru pretvara impulse u DC napon.","<b>Pulso PWM (ciclo de trabajo del 20 %) a 20 kHz en el paso bajo RLC de 2.º orden</b> (f₀ ≈ 1,59 kHz). La componente continua (el valor medio, 0,2) pasa entera, mientras que los armónicos de 20 kHz están muy por encima de f₀ y se atenúan unos 40 dB/década. La salida es una tensión casi constante de 0,2 con un rizado mínimo. <i>En la práctica:</i> así es exactamente como un convertidor buck o un «DAC» PWM de un microcontrolador convierte pulsos en tensión continua.","<b>Impulsion PWM (rapport cyclique 20 %) à 20 kHz dans le passe-bas RLC du 2e ordre</b> (f₀ ≈ 1,59 kHz). La composante continue (la valeur moyenne, 0,2) passe entièrement, tandis que les harmoniques à 20 kHz sont bien au-dessus de f₀ et atténuées d’environ 40 dB/décade. La sortie est une tension presque constante de 0,2 avec une très faible ondulation. <i>En pratique :</i> c’est exactement ainsi qu’un convertisseur buck ou un « CNA » PWM de microcontrôleur transforme des impulsions en tension continue.","<b>PWM-Puls (20 % Tastgrad) mit 20 kHz in den RLC-Tiefpass 2. Ordnung</b> (f₀ ≈ 1,59 kHz). Der Gleichanteil (der Mittelwert, 0,2) kommt ganz durch, während die 20-kHz-Harmonischen weit über f₀ liegen und mit etwa 40 dB/Dekade gedämpft werden. Am Ausgang liegt eine fast konstante Spannung von 0,2 mit winziger Welligkeit. <i>In der Praxis:</i> genau so macht ein Abwärtswandler oder ein PWM-„DAC“ am Mikrocontroller aus Pulsen eine Gleichspannung.","<b>20 kHz、占空比 20% 的 PWM 脉冲输入二阶 RLC 低通</b>（f₀ ≈ 1.59 kHz）。直流分量（平均值 0.2）完全通过，而 20 kHz 的谐波远高于 f₀，以约 40 dB/十倍频衰减。输出几乎是恒定的 0.2 电压，只有很小的纹波。<i>实际应用：</i>降压（buck）变换器或单片机的 PWM“DAC”正是这样把脉冲变成直流电压的。"],
th_smith_t:["the Smith chart","Smitov dijagram","la carta de Smith","l’abaque de Smith","das Smith-Diagramm","史密斯圆图"],
th_smith_what:["The input impedance Z<sub>in</sub> drawn as the <b>reflection coefficient</b> Γ = (Z<sub>in</sub> − Z₀)/(Z<sub>in</sub> + Z₀) relative to a reference impedance Z₀ (usually 50 Ω, set above the graph). Every passive impedance, from 0 to ∞, fits inside the circle. The <b>centre</b> is a perfect match (Z = Z₀), the <b>left edge</b> is a short circuit, the <b>right edge</b> an open circuit. The upper half is inductive, the lower half capacitive.","Ulazna impedansa Z<sub>in</sub> nacrtana kao <b>koeficijent refleksije</b> Γ = (Z<sub>in</sub> − Z₀)/(Z<sub>in</sub> + Z₀) u odnosu na referentnu impedansu Z₀ (obično 50 Ω, podešava se iznad grafika). Svaka pasivna impedansa, od 0 do ∞, staje u krug. <b>Centar</b> je savršeno prilagođenje (Z = Z₀), <b>leva ivica</b> je kratak spoj, a <b>desna ivica</b> prazan hod. Gornja polovina je induktivna, donja kapacitivna.","La impedancia de entrada Z<sub>in</sub> dibujada como <b>coeficiente de reflexión</b> Γ = (Z<sub>in</sub> − Z₀)/(Z<sub>in</sub> + Z₀) respecto a una impedancia de referencia Z₀ (normalmente 50 Ω, se ajusta encima de la gráfica). Toda impedancia pasiva, de 0 a ∞, cabe dentro del círculo. El <b>centro</b> es la adaptación perfecta (Z = Z₀), el <b>borde izquierdo</b> un cortocircuito y el <b>borde derecho</b> un circuito abierto. La mitad superior es inductiva y la inferior, capacitiva.","L’impédance d’entrée Z<sub>in</sub> tracée comme <b>coefficient de réflexion</b> Γ = (Z<sub>in</sub> − Z₀)/(Z<sub>in</sub> + Z₀) par rapport à une impédance de référence Z₀ (en général 50 Ω, réglable au-dessus du graphe). Toute impédance passive, de 0 à ∞, tient dans le cercle. Le <b>centre</b> est l’adaptation parfaite (Z = Z₀), le <b>bord gauche</b> un court-circuit, le <b>bord droit</b> un circuit ouvert. La moitié supérieure est inductive, la moitié inférieure capacitive.","Die Eingangsimpedanz Z<sub>in</sub>, dargestellt als <b>Reflexionsfaktor</b> Γ = (Z<sub>in</sub> − Z₀)/(Z<sub>in</sub> + Z₀) bezogen auf eine Bezugsimpedanz Z₀ (meist 50 Ω, einstellbar über dem Diagramm). Jede passive Impedanz von 0 bis ∞ passt in den Kreis. Die <b>Mitte</b> ist perfekte Anpassung (Z = Z₀), der <b>linke Rand</b> Kurzschluss, der <b>rechte Rand</b> Leerlauf. Die obere Hälfte ist induktiv, die untere kapazitiv.","把输入阻抗 Z<sub>in</sub> 画成相对参考阻抗 Z₀（通常 50 Ω，可在图上方设置）的<b>反射系数</b> Γ = (Z<sub>in</sub> − Z₀)/(Z<sub>in</sub> + Z₀)。从 0 到 ∞ 的任何无源阻抗都落在圆内。<b>圆心</b>是完美匹配（Z = Z₀），<b>左边缘</b>是短路，<b>右边缘</b>是开路。上半部分为感性，下半部分为容性。"],
th_smith_use:["RF and high-frequency work: antennas, cables, amplifier inputs. It shows how much of the power sent down a cable is reflected instead of reaching the circuit, and it is the standard tool for designing matching networks (adding a series L or C moves the point along a circle, so you can steer it into the centre).","Rad sa RF i visokim frekvencijama: antene, kablovi, ulazi pojačavača. Pokazuje koliki deo snage poslate kroz kabl se odbije umesto da stigne do kola, i standardni je alat za projektovanje kola za prilagođenje (dodavanje rednog L ili C pomera tačku po krugu, pa je možeš dovesti u centar).","Trabajo en RF y alta frecuencia: antenas, cables, entradas de amplificadores. Muestra cuánta de la potencia enviada por un cable se refleja en vez de llegar al circuito, y es la herramienta estándar para diseñar redes de adaptación (añadir una L o C en serie mueve el punto sobre un círculo, así que puedes llevarlo al centro).","Travail en RF et haute fréquence : antennes, câbles, entrées d’amplificateurs. Il montre quelle part de la puissance envoyée dans un câble est réfléchie au lieu d’atteindre le circuit, et c’est l’outil standard pour concevoir des réseaux d’adaptation (ajouter une L ou un C en série déplace le point sur un cercle, on peut donc l’amener au centre).","HF-Technik: Antennen, Kabel, Verstärkereingänge. Es zeigt, wie viel der in ein Kabel geschickten Leistung reflektiert wird, statt die Schaltung zu erreichen, und ist das Standardwerkzeug zum Entwurf von Anpassnetzwerken (eine Reihen-L oder -C verschiebt den Punkt entlang eines Kreises, so kann man ihn in die Mitte steuern).","用于射频和高频：天线、电缆、放大器输入。它显示沿电缆送出的功率有多少被反射回来而没有到达电路，也是设计匹配网络的标准工具（串联一个 L 或 C 会让点沿某个圆移动，所以可以把它引到圆心）。"],
th_smith_read:["<ul><li>The full circles are lines of <b>constant resistance</b> r = R/Z₀ (the one through the centre is r = 1); the arcs from the right edge are lines of <b>constant reactance</b> x = X/Z₀.</li><li>The <b>distance from the centre</b> is |Γ|. |Γ| = 0.1 → 1 % of the power reflected (very good); |Γ| = 0.33 → VSWR = 2, about 11 % reflected; |Γ| = 1 → everything is reflected.</li><li>For circuits made only of L and C the point moves <b>clockwise</b> as the frequency rises.</li><li>The readout above the graph shows Z, |Γ| and VSWR at the cursor; zoom with two fingers.</li></ul>","<ul><li>Puni krugovi su linije <b>konstantne otpornosti</b> r = R/Z₀ (onaj kroz centar je r = 1); lukovi sa desne ivice su linije <b>konstantne reaktanse</b> x = X/Z₀.</li><li><b>Udaljenost od centra</b> je |Γ|. |Γ| = 0,1 → odbije se 1 % snage (vrlo dobro); |Γ| = 0,33 → VSWR = 2, odbije se oko 11 %; |Γ| = 1 → sve se odbija.</li><li>Za kola sastavljena samo od L i C tačka se kreće <b>u smeru kazaljke na satu</b> kako frekvencija raste.</li><li>Očitavanje iznad grafika pokazuje Z, |Γ| i VSWR na kursoru; zumiraš sa dva prsta.</li></ul>","<ul><li>Los círculos completos son líneas de <b>resistencia constante</b> r = R/Z₀ (el que pasa por el centro es r = 1); los arcos que salen del borde derecho son líneas de <b>reactancia constante</b> x = X/Z₀.</li><li>La <b>distancia al centro</b> es |Γ|. |Γ| = 0,1 → se refleja el 1 % de la potencia (muy bien); |Γ| = 0,33 → VSWR = 2, se refleja un 11 %; |Γ| = 1 → se refleja todo.</li><li>En circuitos solo de L y C el punto gira en <b>sentido horario</b> al subir la frecuencia.</li><li>La lectura encima de la gráfica muestra Z, |Γ| y VSWR en el cursor; haz zoom con dos dedos.</li></ul>","<ul><li>Les cercles complets sont des lignes de <b>résistance constante</b> r = R/Z₀ (celui qui passe par le centre est r = 1) ; les arcs partant du bord droit sont des lignes de <b>réactance constante</b> x = X/Z₀.</li><li>La <b>distance au centre</b> est |Γ|. |Γ| = 0,1 → 1 % de la puissance réfléchie (très bien) ; |Γ| = 0,33 → TOS = 2, environ 11 % réfléchis ; |Γ| = 1 → tout est réfléchi.</li><li>Pour des circuits faits uniquement de L et de C, le point tourne dans le <b>sens horaire</b> quand la fréquence augmente.</li><li>L’affichage au-dessus du graphe donne Z, |Γ| et le TOS au curseur ; zoomez avec deux doigts.</li></ul>","<ul><li>Die Vollkreise sind Linien <b>konstanten Widerstands</b> r = R/Z₀ (der durch die Mitte ist r = 1); die Bögen vom rechten Rand sind Linien <b>konstanter Reaktanz</b> x = X/Z₀.</li><li>Der <b>Abstand von der Mitte</b> ist |Γ|. |Γ| = 0,1 → 1 % der Leistung reflektiert (sehr gut); |Γ| = 0,33 → VSWR = 2, etwa 11 % reflektiert; |Γ| = 1 → alles wird reflektiert.</li><li>Bei Schaltungen nur aus L und C läuft der Punkt mit steigender Frequenz im <b>Uhrzeigersinn</b>.</li><li>Die Anzeige über dem Diagramm zeigt Z, |Γ| und VSWR am Cursor; zoomen mit zwei Fingern.</li></ul>","<ul><li>完整的圆是<b>等电阻</b>线 r = R/Z₀（经过圆心的是 r = 1）；从右边缘出发的弧是<b>等电抗</b>线 x = X/Z₀。</li><li><b>到圆心的距离</b>就是 |Γ|。|Γ| = 0.1 → 反射 1% 的功率（很好）；|Γ| = 0.33 → VSWR = 2，约反射 11%；|Γ| = 1 → 全部反射。</li><li>只由 L 和 C 组成的电路，随频率升高点总是<b>顺时针</b>移动。</li><li>图上方的读数显示光标处的 Z、|Γ| 和 VSWR；用两指缩放。</li></ul>"],
th_smith_e1:["<b>Real capacitor</b> (100 nF, ESR 20 mΩ, ESL 1 nH), Z₀ = 50 Ω. At low frequency the point is near the right edge in the lower half (a large capacitive impedance). It runs clockwise along the outer edge (r ≈ 0, almost no losses), crosses the real axis near the left edge at the self-resonance ≈ 15.9 MHz (almost a short circuit) and continues into the upper, inductive half. <i>In practice:</i> exactly at its self-resonance a capacitor is the best RF short to ground.","<b>Realan kondenzator</b> (100 nF, ESR 20 mΩ, ESL 1 nH), Z₀ = 50 Ω. Na niskoj frekvenciji tačka je blizu desne ivice u donjoj polovini (velika kapacitivna impedansa). Kreće se u smeru kazaljke duž spoljašnje ivice (r ≈ 0, skoro bez gubitaka), seče realnu osu blizu leve ivice na sopstvenoj rezonansi ≈ 15,9 MHz (skoro kratak spoj) i nastavlja u gornju, induktivnu polovinu. <i>U praksi:</i> tačno na sopstvenoj rezonansi kondenzator je najbolji RF kratak spoj ka masi.","<b>Condensador real</b> (100 nF, ESR 20 mΩ, ESL 1 nH), Z₀ = 50 Ω. A baja frecuencia el punto está cerca del borde derecho en la mitad inferior (impedancia capacitiva grande). Gira en sentido horario por el borde exterior (r ≈ 0, casi sin pérdidas), cruza el eje real cerca del borde izquierdo en la autorresonancia ≈ 15,9 MHz (casi un cortocircuito) y sigue hacia la mitad superior, inductiva. <i>En la práctica:</i> justo en su autorresonancia un condensador es el mejor cortocircuito de RF a masa.","<b>Condensateur réel</b> (100 nF, ESR 20 mΩ, ESL 1 nH), Z₀ = 50 Ω. À basse fréquence, le point est près du bord droit dans la moitié inférieure (grande impédance capacitive). Il tourne dans le sens horaire le long du bord extérieur (r ≈ 0, presque sans pertes), coupe l’axe réel près du bord gauche à l’auto-résonance ≈ 15,9 MHz (presque un court-circuit) et continue dans la moitié supérieure, inductive. <i>En pratique :</i> exactement à son auto-résonance, un condensateur est le meilleur court-circuit RF vers la masse.","<b>Realer Kondensator</b> (100 nF, ESR 20 mΩ, ESL 1 nH), Z₀ = 50 Ω. Bei niedriger Frequenz liegt der Punkt nahe am rechten Rand in der unteren Hälfte (große kapazitive Impedanz). Er läuft im Uhrzeigersinn am Außenrand entlang (r ≈ 0, fast verlustfrei), schneidet die reelle Achse nahe am linken Rand bei der Eigenresonanz ≈ 15,9 MHz (fast ein Kurzschluss) und läuft weiter in die obere, induktive Hälfte. <i>In der Praxis:</i> genau bei seiner Eigenresonanz ist ein Kondensator der beste HF-Kurzschluss nach Masse.","<b>实际电容</b>（100 nF，ESR 20 mΩ，ESL 1 nH），Z₀ = 50 Ω。低频时点在下半部分靠近右边缘（很大的容性阻抗）。它沿外边缘顺时针移动（r ≈ 0，几乎无损耗），在自谐振 ≈ 15.9 MHz 处靠近左边缘穿过实轴（几乎短路），然后进入上半部分的感性区域。<i>实际应用：</i>恰好在自谐振频率处，电容是对地最好的射频短路。"],
th_smith_e2:["<b>Series RLC</b> (R = 10 Ω, L = 7.33 mH, C = 5.27 µF), Z₀ = 50 Ω. Z<sub>in</sub> = R + jωL + 1/(jωC), so the real part is always 10 Ω and the curve lies on the circle r = 10/50 = 0.2. It comes from the bottom (capacitive), crosses the real axis at the resonance f₀ ≈ 810 Hz (Z = 10 Ω, Γ ≈ −0.67) and goes to the top (inductive). <i>In practice:</i> the source sees a pure resistance only at resonance.","<b>Redno RLC</b> (R = 10 Ω, L = 7,33 mH, C = 5,27 µF), Z₀ = 50 Ω. Z<sub>in</sub> = R + jωL + 1/(jωC), pa je realni deo uvek 10 Ω i kriva leži na krugu r = 10/50 = 0,2. Dolazi odozdo (kapacitivno), seče realnu osu na rezonansi f₀ ≈ 810 Hz (Z = 10 Ω, Γ ≈ −0,67) i ide nagore (induktivno). <i>U praksi:</i> izvor vidi čistu otpornost samo na rezonansi.","<b>RLC serie</b> (R = 10 Ω, L = 7,33 mH, C = 5,27 µF), Z₀ = 50 Ω. Z<sub>in</sub> = R + jωL + 1/(jωC), así que la parte real siempre es 10 Ω y la curva está sobre el círculo r = 10/50 = 0,2. Viene de abajo (capacitivo), cruza el eje real en la resonancia f₀ ≈ 810 Hz (Z = 10 Ω, Γ ≈ −0,67) y sube (inductivo). <i>En la práctica:</i> la fuente ve una resistencia pura solo en la resonancia.","<b>RLC série</b> (R = 10 Ω, L = 7,33 mH, C = 5,27 µF), Z₀ = 50 Ω. Z<sub>in</sub> = R + jωL + 1/(jωC) : la partie réelle vaut toujours 10 Ω et la courbe est sur le cercle r = 10/50 = 0,2. Elle vient du bas (capacitif), coupe l’axe réel à la résonance f₀ ≈ 810 Hz (Z = 10 Ω, Γ ≈ −0,67) et monte (inductif). <i>En pratique :</i> la source ne voit une résistance pure qu’à la résonance.","<b>Reihen-RLC</b> (R = 10 Ω, L = 7,33 mH, C = 5,27 µF), Z₀ = 50 Ω. Z<sub>in</sub> = R + jωL + 1/(jωC), der Realteil ist also immer 10 Ω und die Kurve liegt auf dem Kreis r = 10/50 = 0,2. Sie kommt von unten (kapazitiv), schneidet die reelle Achse bei der Resonanz f₀ ≈ 810 Hz (Z = 10 Ω, Γ ≈ −0,67) und geht nach oben (induktiv). <i>In der Praxis:</i> die Quelle sieht nur bei Resonanz einen reinen Widerstand.","<b>串联 RLC</b>（R = 10 Ω，L = 7.33 mH，C = 5.27 µF），Z₀ = 50 Ω。Z<sub>in</sub> = R + jωL + 1/(jωC)，所以实部始终为 10 Ω，曲线落在 r = 10/50 = 0.2 的圆上。它从下方（容性）来，在谐振 f₀ ≈ 810 Hz 处穿过实轴（Z = 10 Ω，Γ ≈ −0.67），然后向上（感性）。<i>实际应用：</i>只有在谐振时电源看到的才是纯电阻。"],
th_smith_e3:["<b>The same RLC with Z₀ = 10 Ω.</b> Now Z₀ equals the circuit’s resistance, so at the resonance f₀ ≈ 810 Hz the curve passes exactly <b>through the centre</b>: Γ = 0, VSWR = 1, no power is reflected. Away from f₀ the point moves out along the circle r = 1 and reflection grows. <i>In practice:</i> this is what “matched at one frequency” means; antennas and tuned circuits are matched only in a narrow band.","<b>Isto RLC sa Z₀ = 10 Ω.</b> Sada je Z₀ jednako otpornosti kola, pa na rezonansi f₀ ≈ 810 Hz kriva prolazi tačno <b>kroz centar</b>: Γ = 0, VSWR = 1, nimalo snage se ne odbija. Dalje od f₀ tačka se pomera po krugu r = 1 i refleksija raste. <i>U praksi:</i> to znači „prilagođeno na jednoj frekvenciji\"; antene i rezonantna kola su prilagođeni samo u uskom opsegu.","<b>El mismo RLC con Z₀ = 10 Ω.</b> Ahora Z₀ es igual a la resistencia del circuito, así que en la resonancia f₀ ≈ 810 Hz la curva pasa exactamente <b>por el centro</b>: Γ = 0, VSWR = 1, no se refleja nada de potencia. Lejos de f₀ el punto se aleja por el círculo r = 1 y la reflexión crece. <i>En la práctica:</i> esto es «adaptado a una frecuencia»; las antenas y los circuitos sintonizados solo están adaptados en una banda estrecha.","<b>Le même RLC avec Z₀ = 10 Ω.</b> Z₀ est maintenant égal à la résistance du circuit : à la résonance f₀ ≈ 810 Hz la courbe passe exactement <b>par le centre</b> : Γ = 0, TOS = 1, aucune puissance réfléchie. Loin de f₀, le point s’éloigne le long du cercle r = 1 et la réflexion augmente. <i>En pratique :</i> c’est cela « adapté à une fréquence » ; les antennes et circuits accordés ne sont adaptés que sur une bande étroite.","<b>Dieselbe RLC-Schaltung mit Z₀ = 10 Ω.</b> Jetzt ist Z₀ gleich dem Widerstand der Schaltung, also geht die Kurve bei der Resonanz f₀ ≈ 810 Hz genau <b>durch die Mitte</b>: Γ = 0, VSWR = 1, keine Leistung wird reflektiert. Abseits von f₀ wandert der Punkt auf dem Kreis r = 1 nach außen und die Reflexion wächst. <i>In der Praxis:</i> das bedeutet „bei einer Frequenz angepasst“; Antennen und Schwingkreise sind nur in einem schmalen Band angepasst.","<b>同一个 RLC，Z₀ = 10 Ω。</b>现在 Z₀ 等于电路的电阻，所以在谐振 f₀ ≈ 810 Hz 处曲线恰好<b>经过圆心</b>：Γ = 0，VSWR = 1，没有功率被反射。远离 f₀ 时点沿 r = 1 的圆向外移动，反射增大。<i>实际应用：</i>这就是“在一个频率上匹配”；天线和调谐电路只在很窄的频带内匹配。"],

d_realIntro:['In real mode, each component marked “Real” is replaced by its equivalent circuit. The parasitic elements are added to the circuit and solved together with it:','U realnom modu se svaka komponenta označena kao „Realan" zamenjuje svojom ekvivalentnom šemom. Parazitni elementi se dodaju u kolo i rešavaju zajedno sa njim:','En modo real, cada componente marcado como «Real» se sustituye por su circuito equivalente. Los elementos parásitos se añaden al circuito y se resuelven junto con él:','En mode réel, chaque composant marqué « Réel » est remplacé par son schéma équivalent. Les éléments parasites sont ajoutés au circuit et résolus avec lui :','Im Real-Modus wird jedes als „Real“ markierte Bauteil durch sein Ersatzschaltbild ersetzt. Die parasitären Elemente werden der Schaltung hinzugefügt und mit ihr gelöst:','在实际模式下，每个标为“实际”的元件都被其等效电路替代。寄生元件被加入电路并一起求解：'],

  if(r){const par=ensurePar(n);for(const q of PARA[n.kind]){const[key,kind,lab,mn,mx]=q;const v=par[key];const pos=Math.round((Math.log10(v)-Math.log10(mn))/(Math.log10(mx)-Math.log10(mn))*1000);

/* semiconductor parameters: [key, label, min, max, unit, scale]; scale log, lin, log0 (left end of the slider = 0), loginf (right end = ∞, stored as 0) */
const SCPAR={D:[['is','I<sub>S</sub>',1e-18,1e-5,'A','log'],['n','n',1,2,'','lin'],['cj','C<sub>j</sub>',1e-14,1e-9,'F','log0'],['tt','τ<sub>T</sub>',1e-11,1e-5,'s','log0']],
  Q:[['bf','β',10,1000,'','log'],['va','V<sub>A</sub>',5,1000,'V','loginf'],['is','I<sub>S</sub>',1e-18,1e-9,'A','log'],['br','β<sub>R</sub>',0.1,20,'','log'],['cpi','C<sub>π</sub>',1e-14,1e-9,'F','log0'],['cmu','C<sub>μ</sub>',1e-15,1e-10,'F','log0']],
  M:[['vth','|V<sub>th</sub>|',0.1,5,'V','log'],['k','k',1e-6,1,'A/V²','log'],['lam','λ',1e-4,0.5,'V⁻¹','log0'],['cgs','C<sub>gs</sub>',1e-15,1e-9,'F','log0'],['cgd','C<sub>gd</sub>',1e-15,1e-9,'F','log0']]};
const scPos=(q,v)=>{const mn=q[2],mx=q[3],sc=q[5];if(sc==='lin')return Math.round((v-mn)/(mx-mn)*1000);if(sc==='log0'&&!(v>0))return 0;if(sc==='loginf'&&!(v>0))return 1000;
  const r=(Math.log10(v)-Math.log10(mn))/(Math.log10(mx)-Math.log10(mn));return Math.round(sc==='log'?r*1000:20+r*960)};
const scVal=(q,pos)=>{const mn=q[2],mx=q[3],sc=q[5];if(sc==='lin')return Number((mn+pos/1000*(mx-mn)).toPrecision(3));if(sc==='log0'&&pos<10)return 0;if(sc==='loginf'&&pos>990)return 0;
  const r=sc==='log'?pos/1000:Math.min(1,Math.max(0,(pos-20)/960));return Number(Math.pow(10,Math.log10(mn)+r*(Math.log10(mx)-Math.log10(mn))).toPrecision(3))};

/* ================= symbolic algebra: polynomials in s with coefficients over element symbols ================= */
const ORD={R:0,L:1,C:2,A:3,W:4,G:5};
const symCmp=(a,b)=>(ORD[a[0]]-ORD[b[0]])||a.slice(1).localeCompare(b.slice(1),'en',{numeric:true});
function parseKey(k){const m={};if(!k)return m;for(const t of k.split('*')){const i=t.indexOf('^');if(i<0)m[t]=(m[t]||0)+1;else m[t.slice(0,i)]=(m[t.slice(0,i)]||0)+ +t.slice(i+1)}return m}
const makeKey=m=>Object.keys(m).filter(s=>m[s]>0).sort(symCmp).map(s=>m[s]===1?s:s+'^'+m[s]).join('*');
function keyMul(a,b){if(!a)return b;if(!b)return a;const m=parseKey(a),n=parseKey(b);for(const s in n)m[s]=(m[s]||0)+n[s];return makeKey(m)}
const mpC=(k,c=1)=>new Map([[k,c]]);
function mpAdd(a,b){const r=new Map(a);for(const[k,c]of b){const v=(r.get(k)||0)+c;if(Math.abs(v)<1e-9)r.delete(k);else r.set(k,v)}return r}
let OPS=0,DEADLINE=Infinity;const OPS_MAX=3e5;
function mpMul(a,b){OPS+=a.size*b.size;if(OPS>OPS_MAX||performance.now()>DEADLINE)throw new Error('__TOO_COMPLEX__');const r=new Map();let cnt=0;for(const[k1,c1]of a)for(const[k2,c2]of b){if((++cnt&255)===0&&performance.now()>DEADLINE)throw new Error('__TOO_COMPLEX__');const k=keyMul(k1,k2);const v=(r.get(k)||0)+c1*c2;if(Math.abs(v)<1e-9)r.delete(k);else r.set(k,v)}return r}
const mpScale=(a,s)=>{const r=new Map();for(const[k,c]of a)r.set(k,c*s);return r};
const mpEq=(a,b)=>a.size===b.size&&[...a].every(([k,c])=>b.has(k)&&Math.abs(b.get(k)-c)<1e-9);
const spTrim=p=>{while(p.length&&p[p.length-1].size===0)p.pop();return p};
function spAdd(a,b){const r=[];for(let i=0;i<Math.max(a.length,b.length);i++)r.push(mpAdd(a[i]||new Map(),b[i]||new Map()));return spTrim(r)}
function spMul(a,b){if(!a.length||!b.length)return[];const r=Array.from({length:a.length+b.length-1},()=>new Map());
  for(let i=0;i<a.length;i++){if(!a[i].size)continue;for(let j=0;j<b.length;j++){if(!b[j].size)continue;r[i+j]=mpAdd(r[i+j],mpMul(a[i],b[j]))}}return spTrim(r)}
const spScale=(a,s)=>a.map(m=>mpScale(m,s));
const spEq=(a,b)=>a.length===b.length&&a.every((m,i)=>mpEq(m,b[i]));
const spTerms=p=>p.reduce((s,m)=>s+m.size,0);
function gcdInt(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function spCancel(polys){let shift=Infinity;for(const p of polys){const i=p.findIndex(m=>m.size);if(i>=0)shift=Math.min(shift,i)}if(!isFinite(shift))shift=0;
  let ps=polys.map(p=>p.slice(shift));let mins=null,g=0,allInt=true;
  for(const p of ps)for(const m of p)for(const[k,c]of m){const e=parseKey(k);if(mins===null)mins={...e};else for(const s in mins)mins[s]=Math.min(mins[s],e[s]||0);if(Math.abs(c-Math.round(c))<1e-9)g=gcdInt(g,Math.round(c));else allInt=false}
  const hasMin=!!mins&&Object.values(mins).some(v=>v>0);const dv=allInt&&g>1?g:1;
  if(hasMin||dv!==1)ps=ps.map(p=>p.map(m=>{const r=new Map();for(const[k,c]of m){let key=k;if(hasMin){const e=parseKey(k);for(const s in mins)e[s]-=mins[s];key=makeKey(e)}r.set(key,c/dv)}return r}));
  return{ps,shift}}
function ratCancel(r){let[N,D]=spCancel([r.N,r.D]).ps;const lead=D.find(m=>m.size);if(lead){const c=[...lead.entries()].sort((a,b)=>a[0].length-b[0].length)[0][1];if(c<0){N=spScale(N,-1);D=spScale(D,-1)}}return{N:spTrim(N),D:spTrim(D)}}
function elemRat(n){const s=n.name;if(n.kind==='R')return{N:[mpC(s)],D:[mpC('')]};if(n.kind==='L')return{N:[new Map(),mpC(s)],D:[mpC('')]};return{N:[mpC('')],D:[new Map(),mpC(s)]}}
function ser(a,b){if(spEq(a.D,b.D))return ratCancel({N:spAdd(a.N,b.N),D:a.D});return ratCancel({N:spAdd(spMul(a.N,b.D),spMul(b.N,a.D)),D:spMul(a.D,b.D)})}
function par(a,b){return ratCancel({N:spMul(a.N,b.N),D:spAdd(spMul(a.N,b.D),spMul(b.N,a.D))})}
function reIm(p){const re=p.map(()=>new Map()),im=p.map(()=>new Map());p.forEach((m,k)=>{if(!m.size)return;if(k%2===0)re[k]=mpScale(m,(k/2)%2?-1:1);else im[k]=mpScale(m,((k-1)/2)%2?-1:1)});return{re:spTrim(re),im:spTrim(im)}}
function mpVal(m,vals){let s=0;for(const[k,c]of m){let t=c;const e=parseKey(k);for(const x in e)t*=Math.pow(vals[x],e[x]);s+=t}return s}
const JP=[[1,0],[0,1],[-1,0],[0,-1]];
function spValJ(p,w,vals){let r=[0,0];p.forEach((m,k)=>{if(!m.size)return;const a=mpVal(m,vals)*Math.pow(w,k);r=cx.add(r,[a*JP[k%4][0],a*JP[k%4][1]])});return r}
function detPoly(M){const n=M.length;if(!n)return[mpC('')];const memo=new Map();
  function rec(row,mask){if(row===n)return[mpC('')];if(memo.has(mask))return memo.get(mask);let acc=[];let sign=1;
    for(let c=0;c<n;c++){if(mask&(1<<c))continue;const e=M[row][c];if(e.length){const sub=rec(row+1,mask|(1<<c));if(sub.length){const t=spMul(e,sub);acc=spAdd(acc,sign>0?t:spScale(t,-1))}}sign=-sign}
    memo.set(mask,acc);return acc}

const symTex=s=>SYMTEX[s]||(s[0]+'_{'+s.slice(1)+'}');
function monoTex(k){if(!k)return'';const e=parseKey(k);return Object.keys(e).sort(symCmp).map(s=>symTex(s)+(e[s]>1?'^{'+e[s]+'}':'')).join(' ')}
const coefStr=c=>Number.isInteger(c)?String(c):String(parseFloat(c.toPrecision(4)));
const keyDeg=k=>{const e=parseKey(k);return Object.values(e).reduce((a,b)=>a+b,0)};
function mpPieces(m){return[...m.entries()].sort((a,b)=>keyDeg(a[0])-keyDeg(b[0])||(a[0]<b[0]?-1:1)).map(([k,c])=>{const sc=Math.abs(c)!==1||k==='';return{neg:c<0,txt:[sc?coefStr(Math.abs(c)):'',monoTex(k)].filter(Boolean).join(' ')}})}
function joinPieces(p){if(!p.length)return'0';return p.map((x,i)=>i===0?(x.neg?'-':'')+x.txt:(x.neg?' - ':' + ')+x.txt).join('')}
const mpTex=m=>joinPieces(mpPieces(m));
function spTex(p,v){const pcs=[];p.forEach((m,k)=>{if(!m.size)return;const vp=k===0?'':k===1?v:v+'^{'+k+'}';
  if(m.size===1){const[[key,c]]=[...m.entries()];const sc=Math.abs(c)!==1||(key===''&&k===0);pcs.push({neg:c<0,txt:[sc?coefStr(Math.abs(c)):'',vp,monoTex(key)].filter(Boolean).join(' ')})}
  else if(k===0)pcs.push(...mpPieces(m));else{const allNeg=[...m.values()].every(c=>c<0);pcs.push({neg:allNeg,txt:vp+'\\left('+mpTex(allNeg?mpScale(m,-1):m)+'\\right)'})}});return joinPieces(pcs)}
const MAXT=80;
const tooLong=n=>'\\text{('+t('tx_tooLong',n)+')}';
const isOne=p=>p.length===1&&mpEq(p[0],mpC(''));
function ratTex(r,v){const n=spTerms(r.N)+spTerms(r.D);if(n>MAXT)return tooLong(n);return isOne(r.D)?spTex(r.N,v):'\\frac{'+spTex(r.N,v)+'}{'+spTex(r.D,v)+'}'}
const ratTexP=(r,v)=>{const t=ratTex(r,v);return(isOne(r.D)&&spTerms(r.N)>1)?'\\left('+t+'\\right)':t};
function polyTex(p,v){const n=spTerms(p);return n>MAXT?tooLong(n):spTex(p,v)}
const spAbs=p=>p.map(m=>{const r=new Map();for(const[k,c]of m)r.set(k,Math.abs(c));return r});
function sqrtTex(re,im){const one=p=>spTerms(p)===1;/* a single term is squared as a whole: (ωR₁C₁)², not ωR₁C₁² (which would square only C₁); a bare number needs no brackets */
  const sq=p=>{if(one(p)){const t=polyTex(spAbs(p),'\\omega');if(/^[0-9.]+$/.test(t))return t==='1'?'1':t+'^{2}';if(/^(\\?[A-Za-z]+)(_\{[^{}]*(\{[^{}]*\}[^{}]*)*\})?$/.test(t))return t+'^{2}';return'\\left('+t+'\\right)^{2}'}return'\\left('+polyTex(p,'\\omega')+'\\right)^{2}'};

  if(!im.length)return ab(re);if(!re.length)return ab(im);return'\\sqrt{'+sq(re)+' + '+sq(im)+'}'}

/* ================= series/parallel reduction ================= */
function topo(n){if(!n)return'—';if(isEl(n))return n.disp||n.name;return n.ch.map(c=>isEl(c)?(c.disp||c.name):'('+topo(c)+')').join(n.kind==='S'?' + ':' ∥ ')}
function spReduce(N){let E=N.edges.map(e=>({a:e.a,b:e.b,t:e.el}));const T=new Set([N.vin,N.gnd]);if(N.vout!==null)T.add(N.vout);
  const mk=(kind,x,y)=>{const ch=[];for(const t of[x,y]){if(!isEl(t)&&t.kind===kind)ch.push(...t.ch);else ch.push(t)}return{kind,ch}};
  for(let guard=0;guard<1000;guard++){E=E.filter(e=>e.a!==e.b);
    const deg={};E.forEach(e=>{deg[e.a]=(deg[e.a]||0)+1;deg[e.b]=(deg[e.b]||0)+1});
    const d=E.findIndex(e=>(!T.has(e.a)&&deg[e.a]===1)||(!T.has(e.b)&&deg[e.b]===1));if(d>=0){E.splice(d,1);continue}
    let done=false;
    for(let i=0;i<E.length&&!done;i++)for(let j=i+1;j<E.length&&!done;j++){const A=E[i],B=E[j];if((A.a===B.a&&A.b===B.b)||(A.a===B.b&&A.b===B.a)){A.t=mk('P',A.t,B.t);E.splice(j,1);done=true}}
    if(done)continue;
    for(const nd in deg){const n=+nd;if(T.has(n)||deg[n]!==2)continue;const[e1,e2]=E.filter(e=>e.a===n||e.b===n);const x=e1.a===n?e1.b:e1.a,y=e2.a===n?e2.b:e2.a;
      E=E.filter(e=>e!==e1&&e!==e2);E.push({a:x,b:y,t:mk('S',e1.t,e2.t)});done=true;break}
    if(!done)break}
  return E}

const fmtTexNum=v=>{if(!isFinite(v))return'\\infty';const a=Math.abs(v);if(a===0)return'0';if(a>=1e-3&&a<1e5)return String(parseFloat(v.toPrecision(4)));let e=Math.floor(Math.log10(a)+1e-12);let m=parseFloat((v/Math.pow(10,e)).toPrecision(4));if(Math.abs(m)>=10){m=parseFloat((m/10).toPrecision(4));e++}return m+'\\cdot 10^{'+e+'}'};
