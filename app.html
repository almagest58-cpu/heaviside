d_goalZ:['Vout is not placed, so we look for the <b>impedance between Vin and GND</b>: <code>Z = V_in / I_in</code>, i.e. how much the circuit “resists” the source.','Vout nije postavljen, pa tražimo <b>impedansu između Vin i GND</b>: <code>Z = V_in / I_in</code>, odnosno koliki „otpor" kolo pruža izvoru.','Vout no está colocado, así que buscamos la <b>impedancia entre Vin y GND</b>: <code>Z = V_in / I_in</code>, es decir, cuánto se «opone» el circuito a la fuente.','Vout n’est pas placé, on cherche donc l’<b>impédance entre Vin et GND</b> : <code>Z = V_in / I_in</code>, c’est-à-dire à quel point le circuit « s’oppose » à la source.','Vout ist nicht gesetzt, daher suchen wir die <b>Impedanz zwischen Vin und GND</b>: <code>Z = V_in / I_in</code>, also wie stark sich die Schaltung der Quelle „widersetzt“.','未放置 Vout，因此求 <b>Vin 与 GND 之间的阻抗</b>：<code>Z = V_in / I_in</code>，即电路对信号源呈现的“阻力”。'],
d_goalH:['We look for the <b>transfer function</b> <code>H = Vout/Vin</code>: what part of the input voltage reaches the output, and with what phase shift.','Tražimo <b>prenosnu funkciju</b> <code>H = Vout/Vin</code>: koliki deo ulaznog napona stiže na izlaz i sa kojim faznim pomakom.','Buscamos la <b>función de transferencia</b> <code>H = Vout/Vin</code>: qué parte de la tensión de entrada llega a la salida y con qué desfase.','On cherche la <b>fonction de transfert</b> <code>H = Vout/Vin</code> : quelle part de la tension d’entrée arrive à la sortie, et avec quel déphasage.','Wir suchen die <b>Übertragungsfunktion</b> <code>H = Vout/Vin</code>: welcher Teil der Eingangsspannung am Ausgang ankommt und mit welcher Phasenverschiebung.','求<b>传递函数</b> <code>H = Vout/Vin</code>：输入电压有多少到达输出，以及相移是多少。'],

d_impIntro:['Each element has a relation between voltage <code>u</code> and current <code>i</code>. The Laplace transform turns the derivative <code>d/dt</code> into multiplication by <code>s</code>, so each element gets an impedance <code>Z = U/I</code>, a “resistance that depends on frequency”.','Svaki element ima vezu između napona <code>u</code> i struje <code>i</code>. Laplasova transformacija pretvara izvod <code>d/dt</code> u množenje sa <code>s</code>, pa svaki element dobija impedansu <code>Z = U/I</code>, kao „otpor koji zavisi od frekvencije".','Cada elemento tiene una relación entre la tensión <code>u</code> y la corriente <code>i</code>. La transformada de Laplace convierte la derivada <code>d/dt</code> en una multiplicación por <code>s</code>, así que cada elemento obtiene una impedancia <code>Z = U/I</code>, una «resistencia que depende de la frecuencia».','Chaque élément relie la tension <code>u</code> et le courant <code>i</code>. La transformée de Laplace change la dérivée <code>d/dt</code> en multiplication par <code>s</code>, donc chaque élément reçoit une impédance <code>Z = U/I</code>, une « résistance qui dépend de la fréquence ».','Jedes Bauteil verknüpft Spannung <code>u</code> und Strom <code>i</code>. Die Laplace-Transformation macht aus der Ableitung <code>d/dt</code> eine Multiplikation mit <code>s</code>, so erhält jedes Bauteil eine Impedanz <code>Z = U/I</code>, einen „frequenzabhängigen Widerstand“.','每个元件都有电压 <code>u</code> 与电流 <code>i</code> 之间的关系。拉普拉斯变换把导数 <code>d/dt</code> 变成乘以 <code>s</code>，因此每个元件都有阻抗 <code>Z = U/I</code>，即“随频率变化的电阻”。'],

d_impNote:['A resistor does not depend on frequency. Inductor: |Z| = ωL grows with frequency (a short circuit at DC). Capacitor: |Z| = 1/(ωC) falls with frequency (an open circuit at DC).','Otpornik ne zavisi od frekvencije. Kalem: |Z| = ωL raste sa frekvencijom (na DC je kratak spoj). Kondenzator: |Z| = 1/(ωC) opada sa frekvencijom (na DC je prekid).','Una resistencia no depende de la frecuencia. Bobina: |Z| = ωL crece con la frecuencia (cortocircuito en DC). Condensador: |Z| = 1/(ωC) disminuye con la frecuencia (circuito abierto en DC).','Une résistance ne dépend pas de la fréquence. Bobine : |Z| = ωL croît avec la fréquence (court-circuit en continu). Condensateur : |Z| = 1/(ωC) diminue avec la fréquence (circuit ouvert en continu).','Ein Widerstand hängt nicht von der Frequenz ab. Spule: |Z| = ωL steigt mit der Frequenz (bei Gleichstrom ein Kurzschluss). Kondensator: |Z| = 1/(ωC) sinkt mit der Frequenz (bei Gleichstrom eine Unterbrechung).','电阻与频率无关。电感：|Z| = ωL 随频率升高（直流时相当于短路）。电容：|Z| = 1/(ωC) 随频率降低（直流时相当于开路）。'],
d_spIntro:['The circuit reduces to series and parallel connections. Rules:','Kolo se može svesti na redne i paralelne veze. Pravila:','El circuito se reduce a conexiones en serie y en paralelo. Reglas:','Le circuit se réduit à des associations série et parallèle. Règles :','Die Schaltung lässt sich auf Reihen- und Parallelschaltungen zurückführen. Regeln:','该电路可化简为串联和并联。规则：'],

d_spWhy:['The same current flows through series elements, so voltages (and impedances) add up. Parallel elements share the same voltage, so currents (and admittances <code>Y = 1/Z</code>) add up. Groups are solved from the innermost outwards.','Kroz redno vezane elemente teče ista struja, pa se naponi (i impedanse) sabiraju. Na paralelno vezanim elementima je isti napon, pa se struje (i admitanse <code>Y = 1/Z</code>) sabiraju. Grupe rešavamo od najdublje ka spoljašnjoj.','Por los elementos en serie circula la misma corriente, así que las tensiones (y las impedancias) se suman. Los elementos en paralelo tienen la misma tensión, así que se suman las corrientes (y las admitancias <code>Y = 1/Z</code>). Los grupos se resuelven de dentro hacia fuera.','Le même courant traverse les éléments en série, donc les tensions (et les impédances) s’additionnent. Les éléments en parallèle ont la même tension, donc les courants (et les admittances <code>Y = 1/Z</code>) s’additionnent. Les groupes se résolvent du plus intérieur vers l’extérieur.','Durch Reihenelemente fließt derselbe Strom, also addieren sich die Spannungen (und Impedanzen). Parallele Elemente haben dieselbe Spannung, also addieren sich die Ströme (und Admittanzen <code>Y = 1/Z</code>). Gruppen werden von innen nach außen gelöst.','串联元件中流过相同电流，因此电压（以及阻抗）相加。并联元件两端电压相同，因此电流（以及导纳 <code>Y = 1/Z</code>）相加。各组从最内层向外依次求解。'],

d_extra:['Branch {0} is directly between Vin and GND. An ideal source keeps Vin fixed regardless, so it does not affect H (but it loads the source).','Grana {0} je direktno između Vin i GND. Idealan izvor drži napon Vin bez obzira na nju, pa ona ne utiče na H (ali opterećuje izvor).','La rama {0} está directamente entre Vin y GND. Una fuente ideal mantiene Vin igualmente, así que no afecta a H (pero carga la fuente).','La branche {0} est directement entre Vin et GND. Une source idéale maintient Vin quoi qu’il arrive, elle n’influe donc pas sur H (mais elle charge la source).','Der Zweig {0} liegt direkt zwischen Vin und GND. Eine ideale Quelle hält Vin trotzdem fest, daher beeinflusst er H nicht (belastet aber die Quelle).','支路 {0} 直接接在 Vin 与 GND 之间。理想信号源无论如何都保持 Vin 不变，因此它不影响 H（但会给信号源带来负载）。'],
d_commonDen:['Bring to a common denominator, <code>N₁/D₁ + N₂/D₂ = (N₁D₂ + N₂D₁)/(D₁D₂)</code>, and simplify:','Svodimo na zajednički imenilac, <code>N₁/D₁ + N₂/D₂ = (N₁D₂ + N₂D₁)/(D₁D₂)</code>, i sređujemo:','Llevamos a común denominador, <code>N₁/D₁ + N₂/D₂ = (N₁D₂ + N₂D₁)/(D₁D₂)</code>, y simplificamos:','On met au même dénominateur, <code>N₁/D₁ + N₂/D₂ = (N₁D₂ + N₂D₁)/(D₁D₂)</code>, puis on simplifie :','Auf einen gemeinsamen Nenner bringen, <code>N₁/D₁ + N₂/D₂ = (N₁D₂ + N₂D₁)/(D₁D₂)</code>, und vereinfachen:','通分：<code>N₁/D₁ + N₂/D₂ = (N₁D₂ + N₂D₁)/(D₁D₂)</code>，然后化简：'],
d_parMul:['Multiply numerator and denominator so the fractions inside the fraction disappear, then collect powers of s:','Pomnožimo brojilac i imenilac tako da nestanu razlomci unutar razlomka, pa sredimo po stepenima od s:','Multiplicamos numerador y denominador para eliminar las fracciones internas y agrupamos por potencias de s:','On multiplie numérateur et dénominateur pour faire disparaître les fractions internes, puis on regroupe par puissances de s :','Zähler und Nenner so multiplizieren, dass die Brüche im Bruch verschwinden, dann nach Potenzen von s ordnen:','分子分母同乘，消去分式中的分式，再按 s 的幂次整理：'],
d_divIntro:['The same current flows through <code>Z_A</code> and <code>Z_B</code> (the output is unloaded), so this is a <b>voltage divider</b>:','Kroz <code>Z_A</code> i <code>Z_B</code> teče ista struja (izlaz nije opterećen), pa je to <b>naponski delitelj</b>:','Por <code>Z_A</code> y <code>Z_B</code> circula la misma corriente (la salida no tiene carga), así que es un <b>divisor de tensión</b>:','Le même courant traverse <code>Z_A</code> et <code>Z_B</code> (la sortie n’est pas chargée), c’est donc un <b>diviseur de tension</b> :','Durch <code>Z_A</code> und <code>Z_B</code> fließt derselbe Strom (der Ausgang ist unbelastet), also ist das ein <b>Spannungsteiler</b>:','<code>Z_A</code> 与 <code>Z_B</code> 中流过相同电流（输出端空载），因此这是一个<b>分压器</b>：'],
d_divMul:['With <code>Z_A = N_A/D_A</code> and <code>Z_B = N_B/D_B</code>, multiplying numerator and denominator by <code>D_A·D_B</code> removes the inner fractions:','Uz <code>Z_A = N_A/D_A</code> i <code>Z_B = N_B/D_B</code>, množenjem brojioca i imenioca sa <code>D_A·D_B</code> nestaju unutrašnji razlomci:','Con <code>Z_A = N_A/D_A</code> y <code>Z_B = N_B/D_B</code>, multiplicando numerador y denominador por <code>D_A·D_B</code> desaparecen las fracciones internas:','Avec <code>Z_A = N_A/D_A</code> et <code>Z_B = N_B/D_B</code>, multiplier numérateur et dénominateur par <code>D_A·D_B</code> supprime les fractions internes :','Mit <code>Z_A = N_A/D_A</code> und <code>Z_B = N_B/D_B</code> verschwinden die inneren Brüche, wenn man Zähler und Nenner mit <code>D_A·D_B</code> multipliziert:','设 <code>Z_A = N_A/D_A</code>、<code>Z_B = N_B/D_B</code>，分子分母同乘 <code>D_A·D_B</code> 即可消去内部分式：'],
d_nodalIntro:['The circuit <b>cannot</b> be reduced to series and parallel connections alone (for example a bridge, or interwoven loops), so we use the <b>node voltage method</b>:</p><p>1) Ground (GND) is the reference, potential 0. 2) For each node we write Kirchhoff’s current law: the sum of currents leaving the node is zero. 3) The current through a branch is written with the potentials at its ends: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) We solve the system of equations.','Kolo se <b>ne može</b> svesti samo na redne i paralelne veze (na primer most, ili petlje koje se prepliću), pa koristimo <b>metodu potencijala čvorova</b>:</p><p>1) Masa (GND) je referenca, potencijal 0. 2) Za svaki čvor napišemo prvi Kirhofov zakon: zbir struja koje izlaze iz čvora je nula. 3) Struju kroz granu izrazimo preko potencijala na njenim krajevima: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) Rešimo sistem jednačina.','El circuito <b>no</b> se puede reducir solo a conexiones en serie y en paralelo (por ejemplo un puente, o mallas entrelazadas), así que usamos el <b>método de tensiones de nodo</b>:</p><p>1) La tierra (GND) es la referencia, potencial 0. 2) Para cada nodo escribimos la ley de corrientes de Kirchhoff: la suma de corrientes que salen del nodo es cero. 3) La corriente de una rama se expresa con los potenciales de sus extremos: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) Resolvemos el sistema de ecuaciones.','Le circuit <b>ne peut pas</b> se réduire à des associations série et parallèle (par exemple un pont, ou des mailles entrelacées), on utilise donc la <b>méthode des potentiels de nœuds</b> :</p><p>1) La masse (GND) est la référence, potentiel 0. 2) Pour chaque nœud on écrit la loi des nœuds de Kirchhoff : la somme des courants sortant du nœud est nulle. 3) Le courant d’une branche s’exprime avec les potentiels à ses extrémités : <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) On résout le système d’équations.','Die Schaltung lässt sich <b>nicht</b> nur auf Reihen- und Parallelschaltungen zurückführen (zum Beispiel eine Brücke oder verschachtelte Maschen), daher verwenden wir das <b>Knotenpotenzialverfahren</b>:</p><p>1) Masse (GND) ist der Bezug, Potenzial 0. 2) Für jeden Knoten schreiben wir die Kirchhoffsche Knotenregel: Die Summe der aus dem Knoten fließenden Ströme ist null. 3) Der Strom durch einen Zweig wird über die Potenziale an seinen Enden ausgedrückt: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) Wir lösen das Gleichungssystem.','该电路<b>不能</b>仅化简为串联和并联（例如电桥或相互交织的回路），因此使用<b>节点电压法</b>：</p><p>1）地（GND）为参考点，电位为 0。2）对每个节点写出基尔霍夫电流定律：流出节点的电流之和为零。3）支路电流用其两端电位表示：<code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>。4）求解方程组。'],

d_kclZ:['We imagine a current source <code>I_in</code> at Vin. Then <code>Z = V_in / I_in</code>. Equations for every node except ground:','Na Vin zamislimo strujni izvor <code>I_in</code>. Tada je <code>Z = V_in / I_in</code>. Jednačine za svaki čvor osim mase:','Imaginamos una fuente de corriente <code>I_in</code> en Vin. Entonces <code>Z = V_in / I_in</code>. Ecuaciones para cada nodo excepto tierra:','On imagine une source de courant <code>I_in</code> sur Vin. Alors <code>Z = V_in / I_in</code>. Équations pour chaque nœud sauf la masse :','Wir denken uns eine Stromquelle <code>I_in</code> an Vin. Dann ist <code>Z = V_in / I_in</code>. Gleichungen für jeden Knoten außer Masse:','假设在 Vin 处接一个电流源 <code>I_in</code>，则 <code>Z = V_in / I_in</code>。除地以外每个节点的方程：'],
d_kclH:['Vin is given (an ideal voltage source), so we write no equation for it. Equations for each unknown node:','Vin je zadat (idealan naponski izvor), pa za njega ne pišemo jednačinu. Jednačine za svaki nepoznat čvor:','Vin está dado (fuente de tensión ideal), así que no escribimos ecuación para él. Ecuaciones para cada nodo desconocido:','Vin est imposé (source de tension idéale), on n’écrit donc pas d’équation pour lui. Équations pour chaque nœud inconnu :','Vin ist vorgegeben (ideale Spannungsquelle), daher schreiben wir dafür keine Gleichung. Gleichungen für jeden unbekannten Knoten:','Vin 已给定（理想电压源），因此不为它列方程。每个未知节点的方程：'],

d_matrix:['Grouping the terms with the same potential in each equation gives the matrix form <code>Y·V = b</code>. On the diagonal is the sum of the admittances of all branches touching the node; off the diagonal is minus the admittance of the branches between those two nodes:','Kad se u svakoj jednačini grupišu članovi uz isti potencijal, dobija se matrični oblik <code>Y·V = b</code>. Na dijagonali je zbir admitansi svih grana koje dodiruju čvor, a van dijagonale minus admitansa grana između ta dva čvora:','Agrupando en cada ecuación los términos con el mismo potencial se obtiene la forma matricial <code>Y·V = b</code>. En la diagonal está la suma de las admitancias de todas las ramas que tocan el nodo; fuera de la diagonal, menos la admitancia de las ramas entre esos dos nodos:','En regroupant dans chaque équation les termes du même potentiel, on obtient la forme matricielle <code>Y·V = b</code>. Sur la diagonale se trouve la somme des admittances de toutes les branches touchant le nœud ; hors diagonale, moins l’admittance des branches entre ces deux nœuds :','Fasst man in jeder Gleichung die Terme mit demselben Potenzial zusammen, ergibt sich die Matrixform <code>Y·V = b</code>. Auf der Diagonale steht die Summe der Admittanzen aller Zweige am Knoten, außerhalb der Diagonale minus die Admittanz der Zweige zwischen diesen beiden Knoten:','把每个方程中同一电位的项合并，得到矩阵形式 <code>Y·V = b</code>。对角线上是与该节点相连的所有支路导纳之和；非对角线上是这两个节点之间支路导纳的负值：'],
d_matBig:['The matrix is {0}×{0}, too large to display nicely, but it is solved the same way.','Matrica je {0}×{0}, prevelika za lep prikaz, ali se rešava na isti način.','La matriz es de {0}×{0}, demasiado grande para mostrarla bien, pero se resuelve igual.','La matrice est {0}×{0}, trop grande pour un bel affichage, mais elle se résout de la même façon.','Die Matrix ist {0}×{0}, zu groß für eine schöne Darstellung, wird aber genauso gelöst.','矩阵为 {0}×{0}，太大无法清晰显示，但求解方法相同。'],
d_tooMany:['The circuit has too many nodes for symbolic solving. The graph is still correct, because it is computed numerically.','Kolo ima previše čvorova za simboličko rešavanje. Grafik je i dalje tačan, jer se računa numerički.','El circuito tiene demasiados nodos para resolverlo simbólicamente. El gráfico sigue siendo correcto, porque se calcula numéricamente.','Le circuit a trop de nœuds pour une résolution symbolique. Le graphique reste correct, car il est calculé numériquement.','Die Schaltung hat zu viele Knoten für eine symbolische Lösung. Das Diagramm stimmt trotzdem, da es numerisch berechnet wird.','电路节点太多，无法进行符号求解。图表仍然正确，因为它是数值计算的。'],
d_cramerZ:['By Cramer’s rule <code>V_in = I_in·Δ_in,in/Δ</code>. Here <code>Δ</code> is the determinant of the whole matrix, and <code>Δ_in,in</code> the determinant with the row and column of node Vin removed. Therefore:','Po Kramerovom pravilu je <code>V_in = I_in·Δ_in,in/Δ</code>. Ovde je <code>Δ</code> determinanta cele matrice, a <code>Δ_in,in</code> determinanta kad se izbace vrsta i kolona čvora Vin. Zato je:','Por la regla de Cramer, <code>V_in = I_in·Δ_in,in/Δ</code>. Aquí <code>Δ</code> es el determinante de toda la matriz y <code>Δ_in,in</code> el determinante sin la fila y la columna del nodo Vin. Por tanto:','Par la règle de Cramer, <code>V_in = I_in·Δ_in,in/Δ</code>. Ici <code>Δ</code> est le déterminant de toute la matrice, et <code>Δ_in,in</code> le déterminant sans la ligne et la colonne du nœud Vin. Donc :','Nach der Cramerschen Regel ist <code>V_in = I_in·Δ_in,in/Δ</code>. Dabei ist <code>Δ</code> die Determinante der ganzen Matrix und <code>Δ_in,in</code> die Determinante ohne Zeile und Spalte des Knotens Vin. Also:','由克莱姆法则，<code>V_in = I_in·Δ_in,in/Δ</code>。其中 <code>Δ</code> 是整个矩阵的行列式，<code>Δ_in,in</code> 是去掉 Vin 节点所在行和列后的行列式。因此：'],
d_cramerH:['By Cramer’s rule <code>V_out = Δ_out/Δ</code>. Here <code>Δ</code> is the determinant of matrix Y, and <code>Δ_out</code> the same determinant with the V_out column replaced by the right-hand side b. Since b is proportional to V_in:','Po Kramerovom pravilu je <code>V_out = Δ_out/Δ</code>. Ovde je <code>Δ</code> determinanta matrice Y, a <code>Δ_out</code> ista determinanta kad se kolona za V_out zameni desnom stranom b. Pošto je b srazmerno sa V_in:','Por la regla de Cramer, <code>V_out = Δ_out/Δ</code>. Aquí <code>Δ</code> es el determinante de la matriz Y y <code>Δ_out</code> el mismo determinante con la columna de V_out sustituida por el lado derecho b. Como b es proporcional a V_in:','Par la règle de Cramer, <code>V_out = Δ_out/Δ</code>. Ici <code>Δ</code> est le déterminant de la matrice Y, et <code>Δ_out</code> le même déterminant où la colonne de V_out est remplacée par le second membre b. Comme b est proportionnel à V_in :','Nach der Cramerschen Regel ist <code>V_out = Δ_out/Δ</code>. Dabei ist <code>Δ</code> die Determinante der Matrix Y und <code>Δ_out</code> dieselbe Determinante, bei der die Spalte von V_out durch die rechte Seite b ersetzt ist. Da b proportional zu V_in ist:','由克莱姆法则，<code>V_out = Δ_out/Δ</code>。其中 <code>Δ</code> 是矩阵 Y 的行列式，<code>Δ_out</code> 是把 V_out 所在列替换为右端向量 b 后的行列式。由于 b 与 V_in 成正比：'],
d_scale:['To make every term a polynomial, all admittances are multiplied by <code>M = s·{0}</code>. This factor cancels in the ratio.','Da bi svi članovi bili polinomi, sve admitanse se pomnože sa <code>M = s·{0}</code>. Taj faktor se u količniku skrati.','Para que todos los términos sean polinomios, todas las admitancias se multiplican por <code>M = s·{0}</code>. Ese factor se cancela en el cociente.','Pour que tous les termes soient des polynômes, toutes les admittances sont multipliées par <code>M = s·{0}</code>. Ce facteur se simplifie dans le quotient.','Damit alle Terme Polynome sind, werden alle Admittanzen mit <code>M = s·{0}</code> multipliziert. Dieser Faktor kürzt sich im Quotienten.','为使每一项都是多项式，所有导纳都乘以 <code>M = s·{0}</code>。该因子在比值中约去。'],
d_afterDet:['After expanding the determinants and cancelling:','Posle razvijanja determinanti i skraćivanja:','Tras desarrollar los determinantes y simplificar:','Après développement des déterminants et simplification :','Nach dem Entwickeln der Determinanten und Kürzen:','展开行列式并约分后：'],
d_numden:['The result is always a ratio of two polynomials in s. Roots of the numerator are the <b>zeros</b> of the function (the response drops there), and roots of the denominator are the <b>poles</b> (the response would “blow up” there without losses).','Rezultat je uvek količnik dva polinoma po s. Nule brojioca su <b>nule</b> funkcije (tu odziv pada), a nule imenioca su <b>polovi</b> (tu bi odziv „eksplodirao" da nema gubitaka).','El resultado siempre es un cociente de dos polinomios en s. Las raíces del numerador son los <b>ceros</b> de la función (ahí la respuesta cae) y las del denominador son los <b>polos</b> (ahí la respuesta «explotaría» sin pérdidas).','Le résultat est toujours un quotient de deux polynômes en s. Les racines du numérateur sont les <b>zéros</b> de la fonction (la réponse y chute), celles du dénominateur sont les <b>pôles</b> (la réponse y « exploserait » sans pertes).','Das Ergebnis ist immer ein Quotient zweier Polynome in s. Nullstellen des Zählers sind die <b>Nullstellen</b> der Funktion (dort fällt die Antwort ab), Nullstellen des Nenners sind die <b>Pole</b> (dort würde die Antwort ohne Verluste „explodieren“).','结果总是关于 s 的两个多项式之比。分子的根是函数的<b>零点</b>（响应在此下降），分母的根是<b>极点</b>（若无损耗，响应会在此“发散”）。'],
d_deg:['The numerator has degree {0} and the denominator {1}. The circuit order (number of independent L and C that store energy) is {2}.','Stepen brojioca je {0}, a imenioca {1}. Red kola (broj nezavisnih L i C koji čuvaju energiju) je {2}.','El numerador tiene grado {0} y el denominador {1}. El orden del circuito (número de L y C independientes que almacenan energía) es {2}.','Le numérateur est de degré {0} et le dénominateur {1}. L’ordre du circuit (nombre de L et C indépendants qui stockent de l’énergie) est {2}.','Der Zähler hat Grad {0}, der Nenner {1}. Die Ordnung der Schaltung (Anzahl unabhängiger, energiespeichernder L und C) ist {2}.','分子次数为 {0}，分母次数为 {1}。电路阶数（独立储能 L 和 C 的个数）为 {2}。'],
d_sub:['For a sinusoidal signal we substitute <code>s = jω</code>. Powers of j repeat every four, so even powers of s give the real part and odd powers the imaginary part:','Za sinusni signal stavljamo <code>s = jω</code>. Stepeni od j se ponavljaju na svaka četiri, pa parni stepeni od s daju realni deo, a neparni imaginarni:','Para una señal senoidal sustituimos <code>s = jω</code>. Las potencias de j se repiten cada cuatro, así que las potencias pares de s dan la parte real y las impares la imaginaria:','Pour un signal sinusoïdal on remplace <code>s = jω</code>. Les puissances de j se répètent tous les quatre, donc les puissances paires de s donnent la partie réelle et les impaires la partie imaginaire :','Für ein Sinussignal setzen wir <code>s = jω</code> ein. Die Potenzen von j wiederholen sich alle vier, daher liefern gerade Potenzen von s den Realteil und ungerade den Imaginärteil:','对于正弦信号，代入 <code>s = jω</code>。j 的幂每四次循环一次，因此 s 的偶次幂给出实部，奇次幂给出虚部：'],
d_mag:['A complex number <code>a + jb</code> has magnitude <code>√(a² + b²)</code>. The magnitude of a ratio is the ratio of magnitudes:','Kompleksan broj <code>a + jb</code> ima moduo <code>√(a² + b²)</code>. Moduo količnika je količnik modula:','Un número complejo <code>a + jb</code> tiene módulo <code>√(a² + b²)</code>. El módulo de un cociente es el cociente de los módulos:','Un nombre complexe <code>a + jb</code> a pour module <code>√(a² + b²)</code>. Le module d’un quotient est le quotient des modules :','Eine komplexe Zahl <code>a + jb</code> hat den Betrag <code>√(a² + b²)</code>. Der Betrag eines Quotienten ist der Quotient der Beträge:','复数 <code>a + jb</code> 的模为 <code>√(a² + b²)</code>。商的模等于模的商：'],

d_magZ:['On the Bode plot it is also drawn as <code>20·log₁₀|Z|</code> in dBΩ, and on the Ω tab as |Z| in ohms.','Na Bodeovom grafiku se crta i kao <code>20·log₁₀|Z|</code> u dBΩ, a na kartici Ω kao |Z| u omima.','En el diagrama de Bode también se dibuja como <code>20·log₁₀|Z|</code> en dBΩ, y en la pestaña Ω como |Z| en ohmios.','Sur le diagramme de Bode, il est aussi tracé comme <code>20·log₁₀|Z|</code> en dBΩ, et dans l’onglet Ω comme |Z| en ohms.','Im Bode-Diagramm wird es auch als <code>20·log₁₀|Z|</code> in dBΩ gezeichnet, im Reiter Ω als |Z| in Ohm.','在伯德图中也画成 <code>20·log₁₀|Z|</code>（单位 dBΩ），在 Ω 选项卡中画成以欧姆为单位的 |Z|。'],
d_dbIntro:['In decibels (this is what the Bode plot shows):','U decibelima (to je ono što je na Bodeovom grafiku):','En decibelios (esto es lo que muestra el diagrama de Bode):','En décibels (c’est ce que montre le diagramme de Bode) :','In Dezibel (das zeigt das Bode-Diagramm):','以分贝表示（即伯德图所显示的）：'],
d_dbMean:['0 dB means output = input, −20 dB that the output is 10 times smaller, −3 dB that the output is ≈ 70.7 % of the input (half the power).','0 dB znači da izlaz = ulaz, −20 dB da je izlaz 10 puta manji, −3 dB da je izlaz ≈ 70,7 % ulaza (pola snage).','0 dB significa salida = entrada, −20 dB que la salida es 10 veces menor, −3 dB que la salida es ≈ 70,7 % de la entrada (la mitad de la potencia).','0 dB signifie sortie = entrée, −20 dB que la sortie est 10 fois plus petite, −3 dB que la sortie vaut ≈ 70,7 % de l’entrée (la moitié de la puissance).','0 dB heißt Ausgang = Eingang, −20 dB dass der Ausgang 10-mal kleiner ist, −3 dB dass der Ausgang ≈ 70,7 % des Eingangs beträgt (halbe Leistung).','0 dB 表示输出等于输入，−20 dB 表示输出小 10 倍，−3 dB 表示输出约为输入的 70.7%（功率减半）。'],
d_phase:['The phase of a complex number <code>a + jb</code> is the angle <code>atan2(b, a)</code>. The phase of a ratio is the difference of the phases of numerator and denominator:','Faza kompleksnog broja <code>a + jb</code> je ugao <code>atan2(b, a)</code>. Faza količnika je razlika faza brojioca i imenioca:','La fase de un número complejo <code>a + jb</code> es el ángulo <code>atan2(b, a)</code>. La fase de un cociente es la diferencia de las fases del numerador y del denominador:','La phase d’un nombre complexe <code>a + jb</code> est l’angle <code>atan2(b, a)</code>. La phase d’un quotient est la différence des phases du numérateur et du dénominateur :','Die Phase einer komplexen Zahl <code>a + jb</code> ist der Winkel <code>atan2(b, a)</code>. Die Phase eines Quotienten ist die Differenz der Phasen von Zähler und Nenner:','复数 <code>a + jb</code> 的相位是角度 <code>atan2(b, a)</code>。商的相位等于分子与分母相位之差：'],
d_rad:['The result is in radians; multiply by 180/π for degrees.','Rezultat je u radijanima, a za stepene se množi sa 180/π.','El resultado está en radianes; para grados se multiplica por 180/π.','Le résultat est en radians ; pour les degrés on multiplie par 180/π.','Das Ergebnis ist in Radiant; für Grad mit 180/π multiplizieren.','结果单位为弧度，乘以 180/π 即为角度。'],
d_phZ:['Positive phase means the circuit behaves inductively (current lags voltage), negative that it behaves capacitively.','Pozitivna faza znači da se kolo ponaša induktivno (struja kasni za naponom), a negativna da se ponaša kapacitivno.','Una fase positiva significa que el circuito se comporta de forma inductiva (la corriente va retrasada respecto a la tensión); una negativa, de forma capacitiva.','Une phase positive signifie que le circuit est inductif (le courant est en retard sur la tension), une phase négative qu’il est capacitif.','Positive Phase heißt, die Schaltung verhält sich induktiv (der Strom eilt der Spannung nach), negative heißt kapazitiv.','相位为正表示电路呈感性（电流滞后于电压），为负表示呈容性。'],
d_phH:['Negative phase means the output lags the input.','Negativna faza znači da izlaz kasni za ulazom.','Una fase negativa significa que la salida va retrasada respecto a la entrada.','Une phase négative signifie que la sortie est en retard sur l’entrée.','Negative Phase heißt, der Ausgang eilt dem Eingang nach.','相位为负表示输出滞后于输入。'],
d_nyq:['The Nyquist plot draws the same number <code>{0}(jω) = Re + j·Im</code> as a point in the plane, for every frequency. The distance from zero is the magnitude, and the angle is the phase.','Nyquistov dijagram crta isti broj <code>{0}(jω) = Re + j·Im</code> kao tačku u ravni, za svaku frekvenciju. Rastojanje od nule je moduo, a ugao je faza.','El diagrama de Nyquist dibuja el mismo número <code>{0}(jω) = Re + j·Im</code> como un punto del plano, para cada frecuencia. La distancia al origen es el módulo y el ángulo es la fase.','Le diagramme de Nyquist trace ce même nombre <code>{0}(jω) = Re + j·Im</code> comme un point du plan, pour chaque fréquence. La distance à l’origine est le module et l’angle est la phase.','Das Nyquist-Diagramm zeichnet dieselbe Zahl <code>{0}(jω) = Re + j·Im</code> für jede Frequenz als Punkt in der Ebene. Der Abstand vom Ursprung ist der Betrag, der Winkel die Phase.','奈奎斯特图把同一个数 <code>{0}(jω) = Re + j·Im</code> 在每个频率下画成平面上的一个点。到原点的距离是模，角度是相位。'],
d_asymIntro:['At low frequencies (ω → 0) the terms with the lowest power of s dominate, and at high frequencies (ω → ∞) those with the highest. Each power of s gives a slope of 20 dB per decade.','Na niskim frekvencijama (ω → 0) dominiraju članovi sa najnižim stepenom od s, a na visokim (ω → ∞) članovi sa najvišim. Svaki stepen s daje nagib 20 dB po dekadi.','A bajas frecuencias (ω → 0) dominan los términos con la menor potencia de s, y a altas (ω → ∞) los de mayor potencia. Cada potencia de s da una pendiente de 20 dB por década.','Aux basses fréquences (ω → 0) dominent les termes de plus faible puissance de s, aux hautes (ω → ∞) ceux de plus forte puissance. Chaque puissance de s donne une pente de 20 dB par décade.','Bei tiefen Frequenzen (ω → 0) dominieren die Terme mit der niedrigsten Potenz von s, bei hohen (ω → ∞) die mit der höchsten. Jede Potenz von s ergibt eine Steigung von 20 dB pro Dekade.','低频时（ω → 0）s 的最低次项占主导，高频时（ω → ∞）最高次项占主导。s 的每一次幂对应每十倍频程 20 dB 的斜率。'],

k_lp:['Low-pass filter: passes DC, attenuates high frequencies.','Niskopropusni filtar: propušta DC, guši visoke frekvencije.','Filtro paso bajo: deja pasar DC y atenúa las altas frecuencias.','Filtre passe-bas : laisse passer le continu, atténue les hautes fréquences.','Tiefpass: lässt Gleichstrom durch, dämpft hohe Frequenzen.','低通滤波器：通过直流，衰减高频。'],
k_hp:['High-pass filter: attenuates low, passes high frequencies.','Visokopropusni filtar: guši niske, propušta visoke frekvencije.','Filtro paso alto: atenúa las bajas y deja pasar las altas frecuencias.','Filtre passe-haut : atténue les basses, laisse passer les hautes fréquences.','Hochpass: dämpft tiefe, lässt hohe Frequenzen durch.','高通滤波器：衰减低频，通过高频。'],
k_bp:['Band-pass: attenuates both low and high frequencies, passes only around the middle.','Pojasni propusnik: guši i niske i visoke, propušta samo oko sredine.','Paso banda: atenúa las bajas y las altas, solo deja pasar alrededor del centro.','Passe-bande : atténue les basses et les hautes, ne laisse passer qu’autour du milieu.','Bandpass: dämpft tiefe und hohe Frequenzen, lässt nur um die Mitte durch.','带通：低频和高频都被衰减，只通过中间频段。'],
k_both:['Finite gain at both ends; if there is a dip in the middle, it is a band-stop (notch).','Na oba kraja ima konačno pojačanje; ako u sredini ima dolinu, to je nepropusnik opsega (zarez).','Ganancia finita en ambos extremos; si hay un valle en el centro, es un rechaza banda (muesca).','Gain fini aux deux extrémités ; s’il y a un creux au milieu, c’est un coupe-bande (encoche).','Endliche Verstärkung an beiden Enden; gibt es in der Mitte eine Senke, ist es eine Bandsperre (Kerbe).','两端增益均为有限值；若中间有凹陷，则为带阻（陷波）滤波器。'],
k_z:['At low frequencies the circuit behaves {0}, and at high frequencies {1}.','Na niskim frekvencijama kolo se ponaša {0}, a na visokim {1}.','A bajas frecuencias el circuito se comporta de forma {0}, y a altas de forma {1}.','Aux basses fréquences le circuit est {0}, et aux hautes {1}.','Bei tiefen Frequenzen verhält sich die Schaltung {0}, bei hohen {1}.','低频时电路呈{0}，高频时呈{1}。'],

d_conj:['Multiplying numerator and denominator by the conjugate of the denominator <code>(D_r − jD_i)</code> makes the denominator real:','Množenjem brojioca i imenioca konjugovanim imeniocem <code>(D_r − jD_i)</code> imenilac postaje realan:','Multiplicando numerador y denominador por el conjugado del denominador <code>(D_r − jD_i)</code>, el denominador se vuelve real:','En multipliant numérateur et dénominateur par le conjugué du dénominateur <code>(D_r − jD_i)</code>, le dénominateur devient réel :','Multipliziert man Zähler und Nenner mit dem konjugierten Nenner <code>(D_r − jD_i)</code>, wird der Nenner reell:','分子分母同乘分母的共轭 <code>(D_r − jD_i)</code>，分母变为实数：'],
d_imZ:['At resonance the impedance is purely real (current and voltage in phase), i.e. <code>Im = 0</code>.','Na rezonanciji je impedansa čisto realna (struja i napon u fazi), odnosno <code>Im = 0</code>.','En resonancia la impedancia es puramente real (corriente y tensión en fase), es decir <code>Im = 0</code>.','À la résonance l’impédance est purement réelle (courant et tension en phase), c’est-à-dire <code>Im = 0</code>.','Bei Resonanz ist die Impedanz rein reell (Strom und Spannung in Phase), also <code>Im = 0</code>.','谐振时阻抗为纯实数（电流与电压同相），即 <code>Im = 0</code>。'],
d_imH:['The phase of H is zero when <code>Im = 0</code>.','Faza H je nula kada je <code>Im = 0</code>.','La fase de H es cero cuando <code>Im = 0</code>.','La phase de H est nulle quand <code>Im = 0</code>.','Die Phase von H ist null, wenn <code>Im = 0</code>.','当 <code>Im = 0</code> 时 H 的相位为零。'],
d_denPos:[' The denominator is always positive, so the numerator must be zero:',' Imenilac je uvek pozitivan, pa je dovoljno da brojilac bude nula:',' El denominador siempre es positivo, así que basta con que el numerador sea cero:',' Le dénominateur est toujours positif, il suffit donc que le numérateur soit nul :',' Der Nenner ist immer positiv, also muss der Zähler null sein:','分母恒为正，因此只需分子为零：'],
d_P0Z:['P(ω) is identically zero: the circuit is purely resistive and the phase is always 0°.','P(ω) je identički nula: kolo je čisto otporno i faza je stalno 0°.','P(ω) es idénticamente cero: el circuito es puramente resistivo y la fase siempre es 0°.','P(ω) est identiquement nul : le circuit est purement résistif et la phase vaut toujours 0°.','P(ω) ist identisch null: die Schaltung ist rein ohmsch und die Phase immer 0°.','P(ω) 恒为零：电路为纯阻性，相位始终为 0°。'],
d_P0H:['P(ω) is identically zero: the phase of H is always 0°.','P(ω) je identički nula: faza H je stalno 0°.','P(ω) es idénticamente cero: la fase de H siempre es 0°.','P(ω) est identiquement nul : la phase de H vaut toujours 0°.','P(ω) ist identisch null: die Phase von H ist immer 0°.','P(ω) 恒为零：H 的相位始终为 0°。'],
d_afterCancel:['After cancelling common factors{0}:','Posle skraćivanja zajedničkih činilaca{0}:','Tras cancelar factores comunes{0}:','Après simplification des facteurs communs{0} :','Nach dem Kürzen gemeinsamer Faktoren{0}:','约去公因子后{0}：'],
d_trivial:[' (ω = 0 is the trivial solution and is dropped)',' (ω = 0 je trivijalno rešenje i izbacuje se)',' (ω = 0 es la solución trivial y se descarta)',' (ω = 0 est la solution triviale et on l’écarte)',' (ω = 0 ist die triviale Lösung und entfällt)','（ω = 0 为平凡解，舍去）'],
d_oneZ:['Only one term is left, so there is no solution for ω &gt; 0: the circuit has no resonance.','Ostao je jedan član, pa za ω &gt; 0 nema rešenja: kolo nema rezonanciju.','Solo queda un término, así que no hay solución para ω &gt; 0: el circuito no tiene resonancia.','Il ne reste qu’un terme, donc pas de solution pour ω &gt; 0 : le circuit n’a pas de résonance.','Es bleibt nur ein Term, daher gibt es für ω &gt; 0 keine Lösung: die Schaltung hat keine Resonanz.','只剩一项，因此 ω &gt; 0 时无解：电路没有谐振。'],
d_oneH:['Only one term is left, so there is no solution for ω &gt; 0: the phase of H never crosses 0°.','Ostao je jedan član, pa za ω &gt; 0 nema rešenja: faza H nikad ne prolazi kroz 0°.','Solo queda un término, así que no hay solución para ω &gt; 0: la fase de H nunca pasa por 0°.','Il ne reste qu’un terme, donc pas de solution pour ω &gt; 0 : la phase de H ne passe jamais par 0°.','Es bleibt nur ein Term, daher gibt es für ω &gt; 0 keine Lösung: die Phase von H geht nie durch 0°.','只剩一项，因此 ω &gt; 0 时无解：H 的相位从不经过 0°。'],

d_negRhs:['The right-hand side is negative, so there is no real solution.','Desna strana je negativna, pa realnog rešenja nema.','El lado derecho es negativo, así que no hay solución real.','Le membre de droite est négatif, il n’y a donc pas de solution réelle.','Die rechte Seite ist negativ, daher gibt es keine reelle Lösung.','右边为负，因此没有实数解。'],
d_higher:['This is a higher-order equation in ω, so it is solved numerically.','Ovo je jednačina višeg reda po ω, pa se rešava numerički.','Es una ecuación de orden superior en ω, así que se resuelve numéricamente.','C’est une équation d’ordre supérieur en ω, elle est donc résolue numériquement.','Das ist eine Gleichung höherer Ordnung in ω, sie wird numerisch gelöst.','这是关于 ω 的高阶方程，因此用数值方法求解。'],
d_numSol:['Numerically found solutions in the displayed range:','Numerički pronađena rešenja u prikazanom opsegu:','Soluciones halladas numéricamente en el rango mostrado:','Solutions trouvées numériquement dans la plage affichée :','Numerisch gefundene Lösungen im angezeigten Bereich:','在显示范围内数值求得的解：'],
d_noSol:['No solutions in the displayed frequency range.','U prikazanom opsegu frekvencija nema rešenja.','No hay soluciones en el rango de frecuencias mostrado.','Aucune solution dans la plage de fréquences affichée.','Keine Lösungen im angezeigten Frequenzbereich.','在显示的频率范围内无解。'],
d_fcIntro:['The denominator is first order, <code>D(s) = a₀ + a₁·s</code>. The pole is at <code>s = −a₀/a₁</code>. At ω = a₀/a₁ the real and imaginary parts of the denominator are equal, so |D| = √2·a₀ and the response has dropped by 3 dB:','Imenilac je prvog reda, <code>D(s) = a₀ + a₁·s</code>. Pol je na <code>s = −a₀/a₁</code>. Na frekvenciji ω = a₀/a₁ realni i imaginarni deo imenioca su jednaki, pa je |D| = √2·a₀ i odziv je pao za 3 dB:','El denominador es de primer orden, <code>D(s) = a₀ + a₁·s</code>. El polo está en <code>s = −a₀/a₁</code>. En ω = a₀/a₁ las partes real e imaginaria del denominador son iguales, así que |D| = √2·a₀ y la respuesta ha caído 3 dB:','Le dénominateur est du premier ordre, <code>D(s) = a₀ + a₁·s</code>. Le pôle est en <code>s = −a₀/a₁</code>. À ω = a₀/a₁, les parties réelle et imaginaire du dénominateur sont égales, donc |D| = √2·a₀ et la réponse a baissé de 3 dB :','Der Nenner ist erster Ordnung, <code>D(s) = a₀ + a₁·s</code>. Der Pol liegt bei <code>s = −a₀/a₁</code>. Bei ω = a₀/a₁ sind Real- und Imaginärteil des Nenners gleich, also |D| = √2·a₀, und die Antwort ist um 3 dB gefallen:','分母为一阶，<code>D(s) = a₀ + a₁·s</code>。极点位于 <code>s = −a₀/a₁</code>。在 ω = a₀/a₁ 处分母的实部与虚部相等，故 |D| = √2·a₀，响应下降 3 dB：'],
d_tau:['time constant','vremenska konstanta','constante de tiempo','constante de temps','Zeitkonstante','时间常数'],
d_qIntro:['The denominator is second order, <code>D(s) = a₀ + a₁·s + a₂·s²</code>. Compare it with the standard form <code>a₀·(1 + s/(Q·ω₀) + s²/ω₀²)</code>: the s² term gives ω₀, and the s term gives Q (quality factor, “how much the circuit rings”):','Imenilac je drugog reda, <code>D(s) = a₀ + a₁·s + a₂·s²</code>. Uporedimo ga sa standardnim oblikom <code>a₀·(1 + s/(Q·ω₀) + s²/ω₀²)</code>: član uz s² daje ω₀, a član uz s daje Q (faktor dobrote, „koliko kolo zvoni"):','El denominador es de segundo orden, <code>D(s) = a₀ + a₁·s + a₂·s²</code>. Lo comparamos con la forma estándar <code>a₀·(1 + s/(Q·ω₀) + s²/ω₀²)</code>: el término en s² da ω₀ y el término en s da Q (factor de calidad, «cuánto resuena el circuito»):','Le dénominateur est du second ordre, <code>D(s) = a₀ + a₁·s + a₂·s²</code>. On le compare à la forme standard <code>a₀·(1 + s/(Q·ω₀) + s²/ω₀²)</code> : le terme en s² donne ω₀ et le terme en s donne Q (facteur de qualité, « à quel point le circuit résonne ») :','Der Nenner ist zweiter Ordnung, <code>D(s) = a₀ + a₁·s + a₂·s²</code>. Vergleich mit der Standardform <code>a₀·(1 + s/(Q·ω₀) + s²/ω₀²)</code>: der s²-Term liefert ω₀, der s-Term Q (Güte, „wie stark die Schaltung schwingt“):','分母为二阶，<code>D(s) = a₀ + a₁·s + a₂·s²</code>。与标准形式 <code>a₀·(1 + s/(Q·ω₀) + s²/ω₀²)</code> 比较：s² 项给出 ω₀，s 项给出 Q（品质因数，“电路振荡的程度”）：'],
d_qNote:['Q &gt; 0.707: the response has a peak around f₀ (about Q times, i.e. 20·log₁₀Q dB). Q = 0.707: the flattest response without a peak (Butterworth). Q &lt; 0.5: two real poles, the curve falls gently and early.','Q &gt; 0,707: odziv ima pik oko f₀ (visine ≈ Q puta, odnosno 20·log₁₀Q dB). Q = 0,707: najravniji odziv bez pika (Batervort). Q &lt; 0,5: dva realna pola, kriva pada blago i rano.','Q &gt; 0,707: la respuesta tiene un pico cerca de f₀ (de unas Q veces, es decir 20·log₁₀Q dB). Q = 0,707: la respuesta más plana sin pico (Butterworth). Q &lt; 0,5: dos polos reales, la curva cae suave y pronto.','Q &gt; 0,707 : la réponse a un pic autour de f₀ (environ Q fois, soit 20·log₁₀Q dB). Q = 0,707 : la réponse la plus plate sans pic (Butterworth). Q &lt; 0,5 : deux pôles réels, la courbe descend doucement et tôt.','Q &gt; 0,707: die Antwort hat eine Spitze um f₀ (etwa Q-fach, also 20·log₁₀Q dB). Q = 0,707: flachste Antwort ohne Spitze (Butterworth). Q &lt; 0,5: zwei reelle Pole, die Kurve fällt sanft und früh.','Q &gt; 0.707：响应在 f₀ 附近有峰值（约 Q 倍，即 20·log₁₀Q dB）。Q = 0.707：无峰值的最平坦响应（巴特沃斯）。Q &lt; 0.5：两个实极点，曲线下降平缓且较早。'],

d_spec:['A periodic input signal is a sum of sines at f₀, 2f₀, 3f₀, … (Fourier series). The circuit is linear, so each harmonic passes through on its own: its amplitude is multiplied by |{0}(n·f₀)| and its phase is shifted by φ(n·f₀):','Periodičan ulazni signal je zbir sinusa na f₀, 2f₀, 3f₀, … (Furijeov red). Kolo je linearno, pa svaki harmonik prolazi nezavisno: amplituda mu se množi sa |{0}(n·f₀)|, a faza pomera za φ(n·f₀):','Una señal de entrada periódica es una suma de senos en f₀, 2f₀, 3f₀, … (serie de Fourier). El circuito es lineal, así que cada armónico pasa por separado: su amplitud se multiplica por |{0}(n·f₀)| y su fase se desplaza φ(n·f₀):','Un signal d’entrée périodique est une somme de sinus à f₀, 2f₀, 3f₀, … (série de Fourier). Le circuit est linéaire, donc chaque harmonique passe indépendamment : son amplitude est multipliée par |{0}(n·f₀)| et sa phase décalée de φ(n·f₀) :','Ein periodisches Eingangssignal ist eine Summe von Sinusschwingungen bei f₀, 2f₀, 3f₀, … (Fourier-Reihe). Die Schaltung ist linear, daher läuft jede Harmonische unabhängig durch: ihre Amplitude wird mit |{0}(n·f₀)| multipliziert und ihre Phase um φ(n·f₀) verschoben:','周期输入信号是 f₀、2f₀、3f₀…… 处正弦波之和（傅里叶级数）。电路是线性的，因此每个谐波独立通过：其幅值乘以 |{0}(n·f₀)|，相位移动 φ(n·f₀)：'],
d_square:['For example, a square wave (±1) has only odd harmonics, with amplitudes 4/(nπ):','Na primer, pravougaoni signal (±1) ima samo neparne harmonike, sa amplitudama 4/(nπ):','Por ejemplo, una onda cuadrada (±1) solo tiene armónicos impares, de amplitud 4/(nπ):','Par exemple, un signal carré (±1) n’a que des harmoniques impairs, d’amplitude 4/(nπ) :','Zum Beispiel hat ein Rechtecksignal (±1) nur ungerade Harmonische mit den Amplituden 4/(nπ):','例如，方波（±1）只有奇次谐波，幅值为 4/(nπ)：'],
d_smith:['The Smith chart shows the input impedance <code>Z_in</code> (the one on the Ω tab) as the reflection coefficient relative to a reference impedance Z₀ (usually 50 Ω):','Smitov dijagram prikazuje ulaznu impedansu <code>Z_in</code> (onu sa kartice Ω) kao koeficijent refleksije u odnosu na referentnu impedansu Z₀ (obično 50 Ω):','La carta de Smith muestra la impedancia de entrada <code>Z_in</code> (la de la pestaña Ω) como coeficiente de reflexión respecto a una impedancia de referencia Z₀ (normalmente 50 Ω):','L’abaque de Smith montre l’impédance d’entrée <code>Z_in</code> (celle de l’onglet Ω) sous forme de coefficient de réflexion par rapport à une impédance de référence Z₀ (souvent 50 Ω) :','Das Smith-Diagramm zeigt die Eingangsimpedanz <code>Z_in</code> (die vom Reiter Ω) als Reflexionsfaktor bezogen auf eine Bezugsimpedanz Z₀ (meist 50 Ω):','史密斯圆图把输入阻抗 <code>Z_in</code>（即 Ω 选项卡中的阻抗）表示为相对于参考阻抗 Z₀（通常为 50 Ω）的反射系数：'],
d_smith2:['The centre of the chart is a perfect match (Z = Z₀, Γ = 0), the left edge a short circuit, the right edge an open circuit. The upper half is inductive, the lower half capacitive.','Centar dijagrama je savršeno prilagođenje (Z = Z₀, Γ = 0), leva ivica kratak spoj, desna prazan hod. Gornja polovina je induktivna, donja kapacitivna.','El centro de la carta es una adaptación perfecta (Z = Z₀, Γ = 0), el borde izquierdo un cortocircuito y el derecho un circuito abierto. La mitad superior es inductiva y la inferior capacitiva.','Le centre de l’abaque correspond à une adaptation parfaite (Z = Z₀, Γ = 0), le bord gauche à un court-circuit, le bord droit à un circuit ouvert. La moitié supérieure est inductive, l’inférieure capacitive.','Die Mitte des Diagramms ist perfekte Anpassung (Z = Z₀, Γ = 0), der linke Rand ein Kurzschluss, der rechte ein Leerlauf. Die obere Hälfte ist induktiv, die untere kapazitiv.','圆图中心表示完全匹配（Z = Z₀，Γ = 0），左边缘为短路，右边缘为开路。上半部分为感性，下半部分为容性。'],

d_tfFrom:['This function is derived step by step on the {0} tab at the top of this screen. Here we only use the result:','Ova funkcija je izvedena korak po korak na kartici {0} na vrhu ovog ekrana. Ovde koristimo samo rezultat:','Esta función se deduce paso a paso en la pestaña {0} de arriba. Aquí solo usamos el resultado:','Cette fonction est dérivée pas à pas dans l’onglet {0} en haut de cet écran. Ici, on utilise seulement le résultat :','Diese Funktion wird im Reiter {0} oben auf diesem Bildschirm Schritt für Schritt hergeleitet. Hier verwenden wir nur das Ergebnis:','该函数在本页顶部的 {0} 标签中逐步推导。这里只使用其结果：'],
d_ohmIntro:['The Ω graph shows the input impedance Z_in: what the source Vin “sees” between Vin and GND. Vout is ignored here, because nothing is connected to it and no current flows out of it. Its full derivation follows.','Grafik Ω prikazuje ulaznu impedansu Z_in, odnosno ono što izvor Vin „vidi" između Vin i GND. Vout se ovde zanemaruje, jer na njega ništa nije priključeno i iz njega ne teče struja. Sledi kompletno izvođenje.','La gráfica Ω muestra la impedancia de entrada Z_in: lo que la fuente Vin «ve» entre Vin y GND. Aquí se ignora Vout, porque no hay nada conectado y no sale corriente por él. A continuación, la deducción completa.','Le graphe Ω montre l’impédance d’entrée Z_in : ce que la source Vin « voit » entre Vin et GND. Vout est ignoré ici, car rien n’y est branché et aucun courant n’en sort. Voici la dérivation complète.','Das Ω-Diagramm zeigt die Eingangsimpedanz Z_in: das, was die Quelle Vin zwischen Vin und GND „sieht“. Vout wird hier ignoriert, da nichts daran angeschlossen ist und kein Strom herausfließt. Es folgt die vollständige Herleitung.','Ω 图显示输入阻抗 Z_in，即电源 Vin 在 Vin 与 GND 之间“看到”的阻抗。这里忽略 Vout，因为它没有连接任何东西，也没有电流流出。下面是完整推导。'],
d_ohmSame:['This circuit has no Vout, so the Bode tab already shows this same impedance and the derivation is identical.','Ovo kolo nema Vout, pa kartica Bode već prikazuje istu impedansu i izvođenje je identično.','Este circuito no tiene Vout, así que la pestaña Bode ya muestra esta misma impedancia y la deducción es idéntica.','Ce circuit n’a pas de Vout : l’onglet Bode montre déjà cette impédance et la dérivation est identique.','Diese Schaltung hat kein Vout, daher zeigt der Bode-Reiter bereits dieselbe Impedanz und die Herleitung ist identisch.','该电路没有 Vout，因此 Bode 标签已显示同一阻抗，推导完全相同。'],
st_nyqDef:['What the Nyquist plot shows','Šta prikazuje Nikvistov dijagram','Qué muestra el diagrama de Nyquist','Ce que montre le diagramme de Nyquist','Was das Nyquist-Diagramm zeigt','奈奎斯特图表示什么'],
d_nyqDef:['For each frequency, {0}(jω) is one complex number. Drawn as a point (horizontal axis = real part, vertical axis = imaginary part), it traces a curve as ω goes from 0 to ∞. The distance from the origin is the magnitude |{0}|, and the angle from the positive real axis is the phase φ. These are the same two quantities as on the Bode plot, shown in one picture.','Za svaku frekvenciju {0}(jω) je jedan kompleksan broj. Nacrtan kao tačka (horizontalna osa = realni deo, vertikalna = imaginarni deo), on iscrtava krivu dok ω ide od 0 do ∞. Udaljenost od koordinatnog početka je moduo |{0}|, a ugao od pozitivne realne ose je faza φ. To su iste dve veličine kao na Bodeovom dijagramu, prikazane na jednoj slici.','Para cada frecuencia, {0}(jω) es un número complejo. Dibujado como un punto (eje horizontal = parte real, eje vertical = parte imaginaria), traza una curva cuando ω va de 0 a ∞. La distancia al origen es el módulo |{0}|, y el ángulo respecto al eje real positivo es la fase φ. Son las mismas dos magnitudes que en el diagrama de Bode, en una sola imagen.','Pour chaque fréquence, {0}(jω) est un nombre complexe. Dessiné comme un point (axe horizontal = partie réelle, axe vertical = partie imaginaire), il trace une courbe quand ω va de 0 à ∞. La distance à l’origine est le module |{0}|, et l’angle par rapport à l’axe réel positif est la phase φ. Ce sont les deux mêmes grandeurs que sur le diagramme de Bode, réunies sur une seule image.','Für jede Frequenz ist {0}(jω) eine komplexe Zahl. Als Punkt gezeichnet (waagerecht = Realteil, senkrecht = Imaginärteil), beschreibt sie eine Kurve, während ω von 0 bis ∞ läuft. Der Abstand vom Ursprung ist der Betrag |{0}|, und der Winkel zur positiven reellen Achse ist die Phase φ. Das sind dieselben zwei Größen wie im Bode-Diagramm, nur in einem Bild.','对每个频率，{0}(jω) 都是一个复数。把它画成一个点（横轴为实部，纵轴为虚部），当 ω 从 0 变到 ∞ 时就描出一条曲线。点到原点的距离是幅值 |{0}|，与正实轴的夹角是相位 φ。这与伯德图上的两个量相同，只是画在一张图里。'],

d_atInf:['very far from the origin (|{0}| → ∞), so the curve comes in from outside the picture.','veoma daleko od koordinatnog početka (|{0}| → ∞), pa kriva dolazi spolja, izvan slike.','muy lejos del origen (|{0}| → ∞), así que la curva entra desde fuera de la imagen.','très loin de l’origine (|{0}| → ∞) : la courbe arrive donc de l’extérieur de l’image.','sehr weit vom Ursprung (|{0}| → ∞), die Kurve kommt also von außerhalb des Bildes.','离原点非常远（|{0}| → ∞），因此曲线从图外进入。'],

d_nyqDir:['The small arrows show the direction of increasing frequency. The dashed curve is the mirror image for negative frequencies, because {0}(−jω) is the complex conjugate of {0}(jω).','Male strelice pokazuju smer rasta frekvencije. Isprekidana kriva je odraz u ogledalu za negativne frekvencije, jer je {0}(−jω) konjugovano kompleksan broj od {0}(jω).','Las flechas pequeñas indican el sentido de frecuencia creciente. La curva discontinua es la imagen especular para frecuencias negativas, porque {0}(−jω) es el conjugado complejo de {0}(jω).','Les petites flèches indiquent le sens des fréquences croissantes. La courbe en pointillés est l’image miroir pour les fréquences négatives, car {0}(−jω) est le conjugué complexe de {0}(jω).','Die kleinen Pfeile zeigen die Richtung steigender Frequenz. Die gestrichelte Kurve ist das Spiegelbild für negative Frequenzen, denn {0}(−jω) ist das konjugiert Komplexe von {0}(jω).','小箭头表示频率增大的方向。虚线是负频率的镜像，因为 {0}(−jω) 是 {0}(jω) 的共轭复数。'],

d_nyqCrRe:['The curve crosses the real axis where the imaginary part is zero. The denominator D_r² + D_i² is always positive, so only the numerator matters:','Kriva seče realnu osu tamo gde je imaginarni deo nula. Imenilac D_r² + D_i² je uvek pozitivan, pa je bitan samo brojilac:','La curva cruza el eje real donde la parte imaginaria es cero. El denominador D_r² + D_i² siempre es positivo, así que solo importa el numerador:','La courbe coupe l’axe réel là où la partie imaginaire est nulle. Le dénominateur D_r² + D_i² est toujours positif, seul le numérateur compte :','Die Kurve schneidet die reelle Achse dort, wo der Imaginärteil null ist. Der Nenner D_r² + D_i² ist immer positiv, es zählt also nur der Zähler:','曲线在虚部为零处穿过实轴。分母 D_r² + D_i² 总为正，所以只看分子：'],

d_atCur:['Put the cursor frequency f = {0} (ω = 2πf = {1}) into the formulas above:','Ubaci frekvenciju kursora f = {0} (ω = 2πf = {1}) u formule iznad:','Sustituye la frecuencia del cursor f = {0} (ω = 2πf = {1}) en las fórmulas anteriores:','Injectez la fréquence du curseur f = {0} (ω = 2πf = {1}) dans les formules ci-dessus :','Setze die Cursorfrequenz f = {0} (ω = 2πf = {1}) in die obigen Formeln ein:','把光标频率 f = {0}（ω = 2πf = {1}）代入上面的公式：'],

d_fourier:['Any periodic signal with period T = 1/f₀ can be written as a constant plus a sum of sines and cosines at multiples of f₀. Each coefficient is the average, over one period, of the signal multiplied by that sine or cosine:','Svaki periodični signal sa periodom T = 1/f₀ može se napisati kao konstanta plus zbir sinusa i kosinusa na umnošcima od f₀. Svaki koeficijent je srednja vrednost, na jednoj periodi, signala pomnoženog tim sinusom ili kosinusom:','Cualquier señal periódica de periodo T = 1/f₀ puede escribirse como una constante más una suma de senos y cosenos en múltiplos de f₀. Cada coeficiente es el promedio, en un periodo, de la señal multiplicada por ese seno o coseno:','Tout signal périodique de période T = 1/f₀ s’écrit comme une constante plus une somme de sinus et cosinus aux multiples de f₀. Chaque coefficient est la moyenne, sur une période, du signal multiplié par ce sinus ou ce cosinus :','Jedes periodische Signal mit der Periode T = 1/f₀ lässt sich als Konstante plus eine Summe von Sinus- und Kosinusschwingungen bei Vielfachen von f₀ schreiben. Jeder Koeffizient ist der Mittelwert des Signals, multipliziert mit diesem Sinus oder Kosinus, über eine Periode:','任何周期为 T = 1/f₀ 的周期信号都可以写成一个常数加上 f₀ 整数倍频率的正弦和余弦之和。每个系数是信号乘以对应正弦或余弦后在一个周期内的平均：'],
d_ampPh:['Each cosine–sine pair is one sinusoid with amplitude A_n and phase θ_n:','Svaki par kosinus–sinus je jedna sinusoida sa amplitudom A_n i fazom θ_n:','Cada par coseno–seno es una sinusoide con amplitud A_n y fase θ_n:','Chaque paire cosinus–sinus est une sinusoïde d’amplitude A_n et de phase θ_n :','Jedes Kosinus-Sinus-Paar ist eine Sinusschwingung mit Amplitude A_n und Phase θ_n:','每一对余弦–正弦就是一个幅值为 A_n、相位为 θ_n 的正弦波：'],
st_wave:['Coefficients of the selected input ({0})','Koeficijenti izabranog ulaza ({0})','Coeficientes de la entrada elegida ({0})','Coefficients de l’entrée choisie ({0})','Koeffizienten des gewählten Eingangs ({0})','所选输入的系数（{0}）'],
d_w_square:['The square wave is +1 for the first half of the period and −1 for the second half. It is an odd function, so all a_n = 0 and X₀ = 0. For b_n:','Pravougaoni signal je +1 u prvoj polovini periode i −1 u drugoj. To je neparna funkcija, pa su svi a_n = 0 i X₀ = 0. Za b_n:','La onda cuadrada vale +1 en la primera mitad del periodo y −1 en la segunda. Es una función impar, así que todos los a_n = 0 y X₀ = 0. Para b_n:','Le signal carré vaut +1 pendant la première moitié de la période et −1 pendant la seconde. C’est une fonction impaire : tous les a_n = 0 et X₀ = 0. Pour b_n :','Die Rechteckschwingung ist in der ersten Periodenhälfte +1 und in der zweiten −1. Sie ist ungerade, daher sind alle a_n = 0 und X₀ = 0. Für b_n:','方波在前半个周期为 +1，后半个周期为 −1。它是奇函数，所以所有 a_n = 0，X₀ = 0。对 b_n：'],
d_w_square2:['cos(nπ) = (−1)ⁿ, so the bracket is 0 for even n and 2 for odd n:','cos(nπ) = (−1)ⁿ, pa je zagrada 0 za parno n i 2 za neparno n:','cos(nπ) = (−1)ⁿ, así que el paréntesis vale 0 para n par y 2 para n impar:','cos(nπ) = (−1)ⁿ : la parenthèse vaut 0 pour n pair et 2 pour n impair :','cos(nπ) = (−1)ⁿ, die Klammer ist also 0 für gerades n und 2 für ungerades n:','cos(nπ) = (−1)ⁿ，所以括号在 n 为偶数时为 0，为奇数时为 2：'],
d_w_tri:['The triangle wave rises linearly from 0 to +1 (at T/4), falls to −1 (at 3T/4) and rises back. It is odd (a_n = 0, X₀ = 0) and symmetric within each half-period, so only odd harmonics remain. Integrating piece by piece with integration by parts:','Trougaoni signal raste linearno od 0 do +1 (u T/4), pada do −1 (u 3T/4) i ponovo raste. Neparan je (a_n = 0, X₀ = 0) i simetričan unutar svake poluperiode, pa ostaju samo neparni harmonici. Integracija deo po deo, parcijalnom integracijom:','La onda triangular sube linealmente de 0 a +1 (en T/4), baja a −1 (en 3T/4) y vuelve a subir. Es impar (a_n = 0, X₀ = 0) y simétrica en cada semiperiodo, así que solo quedan armónicos impares. Integrando por tramos con integración por partes:','Le signal triangulaire monte linéairement de 0 à +1 (en T/4), descend à −1 (en 3T/4) puis remonte. Il est impair (a_n = 0, X₀ = 0) et symétrique dans chaque demi-période : seules les harmoniques impaires restent. En intégrant par morceaux, par parties :','Die Dreieckschwingung steigt linear von 0 auf +1 (bei T/4), fällt auf −1 (bei 3T/4) und steigt wieder. Sie ist ungerade (a_n = 0, X₀ = 0) und in jeder Halbperiode symmetrisch, daher bleiben nur ungerade Harmonische. Stückweise Integration mit partieller Integration:','三角波从 0 线性上升到 +1（在 T/4），下降到 −1（在 3T/4），再回升。它是奇函数（a_n = 0，X₀ = 0），且在每个半周期内对称，所以只剩奇次谐波。分段并用分部积分：'],
d_w_saw:['The sawtooth is x(t) = 2t/T on (−T/2, T/2) and then jumps back. It is odd, so a_n = 0 and X₀ = 0. Integration by parts:','Testerasti signal je x(t) = 2t/T na (−T/2, T/2), a zatim skače nazad. Neparan je, pa je a_n = 0 i X₀ = 0. Parcijalna integracija:','El diente de sierra es x(t) = 2t/T en (−T/2, T/2) y luego salta hacia atrás. Es impar, así que a_n = 0 y X₀ = 0. Integración por partes:','La dent de scie vaut x(t) = 2t/T sur (−T/2, T/2), puis revient brusquement. Elle est impaire : a_n = 0 et X₀ = 0. Intégration par parties :','Der Sägezahn ist x(t) = 2t/T auf (−T/2, T/2) und springt dann zurück. Er ist ungerade, also a_n = 0 und X₀ = 0. Partielle Integration:','锯齿波在 (−T/2, T/2) 上为 x(t) = 2t/T，然后跳回。它是奇函数，所以 a_n = 0，X₀ = 0。分部积分：'],
d_w_pulse:['The pulse is 1 for the first D·T of each period (here D = {0}) and 0 for the rest:','Impuls je 1 tokom prvih D·T svake periode (ovde D = {0}) i 0 ostatak vremena:','El pulso vale 1 durante los primeros D·T de cada periodo (aquí D = {0}) y 0 el resto:','L’impulsion vaut 1 pendant les premiers D·T de chaque période (ici D = {0}) et 0 le reste du temps :','Der Puls ist in den ersten D·T jeder Periode 1 (hier D = {0}) und sonst 0:','脉冲在每个周期的前 D·T 时间内为 1（这里 D = {0}），其余时间为 0：'],
d_w_pulse2:['The amplitudes follow a sinc-shaped envelope and are zero whenever n·D is a whole number:','Amplitude prate anvelopu oblika sinc i jednake su nuli kad god je n·D ceo broj:','Las amplitudes siguen una envolvente tipo sinc y son cero siempre que n·D sea entero:','Les amplitudes suivent une enveloppe en sinc et s’annulent chaque fois que n·D est entier :','Die Amplituden folgen einer sinc-förmigen Hüllkurve und sind null, wann immer n·D ganzzahlig ist:','各幅值遵循 sinc 形包络，当 n·D 为整数时为零：'],
d_w_sine:['A pure sine has only the first harmonic. The circuit just scales it by |{0}(jω₀)| and shifts it by φ(ω₀); no other frequencies appear.','Čista sinusoida ima samo prvi harmonik. Kolo je samo pomnoži sa |{0}(jω₀)| i pomeri za φ(ω₀); druge frekvencije se ne pojavljuju.','Un seno puro solo tiene el primer armónico. El circuito solo lo escala por |{0}(jω₀)| y lo desplaza φ(ω₀); no aparecen otras frecuencias.','Un sinus pur n’a que la première harmonique. Le circuit le multiplie simplement par |{0}(jω₀)| et le décale de φ(ω₀) ; aucune autre fréquence n’apparaît.','Ein reiner Sinus hat nur die erste Harmonische. Die Schaltung skaliert ihn nur mit |{0}(jω₀)| und verschiebt ihn um φ(ω₀); andere Frequenzen entstehen nicht.','纯正弦只有一次谐波。电路只是把它乘以 |{0}(jω₀)| 并移相 φ(ω₀)，不会出现其他频率。'],
st_specOut:['What the circuit does to each harmonic','Šta kolo radi svakom harmoniku','Qué hace el circuito con cada armónico','Ce que le circuit fait à chaque harmonique','Was die Schaltung mit jeder Harmonischen macht','电路对每个谐波的作用'],
d_specOutH:['The circuit is linear, so every harmonic passes through on its own. Harmonic n (frequency n·f₀) is multiplied by the complex number H(jnω₀):','Kolo je linearno, pa svaki harmonik prolazi nezavisno. Harmonik n (frekvencija n·f₀) množi se kompleksnim brojem H(jnω₀):','El circuito es lineal, así que cada armónico pasa por separado. El armónico n (frecuencia n·f₀) se multiplica por el número complejo H(jnω₀):','Le circuit est linéaire : chaque harmonique passe indépendamment. L’harmonique n (fréquence n·f₀) est multipliée par le nombre complexe H(jnω₀) :','Die Schaltung ist linear, daher läuft jede Harmonische für sich hindurch. Die n-te Harmonische (Frequenz n·f₀) wird mit der komplexen Zahl H(jnω₀) multipliziert:','电路是线性的，所以每个谐波独立通过。第 n 次谐波（频率 n·f₀）乘以复数 H(jnω₀)：'],
d_specOutZ:['Without Vout, the app applies the voltage x(t) between Vin and GND and shows the current i(t) that flows. Each harmonic is divided by Z(jnω₀):','Bez Vout aplikacija dovodi napon x(t) između Vin i GND i prikazuje struju i(t) koja teče. Svaki harmonik se deli sa Z(jnω₀):','Sin Vout, la app aplica la tensión x(t) entre Vin y GND y muestra la corriente i(t) que circula. Cada armónico se divide entre Z(jnω₀):','Sans Vout, l’application applique la tension x(t) entre Vin et GND et montre le courant i(t) qui circule. Chaque harmonique est divisée par Z(jnω₀) :','Ohne Vout legt die App die Spannung x(t) zwischen Vin und GND an und zeigt den fließenden Strom i(t). Jede Harmonische wird durch Z(jnω₀) geteilt:','没有 Vout 时，应用在 Vin 与 GND 之间施加电压 x(t)，并显示流过的电流 i(t)。每个谐波都除以 Z(jnω₀)：'],

d_gamma:['Imagine the circuit at the end of a cable with characteristic impedance Z₀. If Z_in = Z₀, the wave sent down the cable is fully absorbed; otherwise part of it bounces back. The reflected part (amplitude and phase) is Γ:','Zamisli kolo na kraju kabla karakteristične impedanse Z₀. Ako je Z_in = Z₀, talas poslat kroz kabl potpuno se apsorbuje; inače se deo odbija nazad. Odbijeni deo (amplituda i faza) je Γ:','Imagina el circuito al final de un cable de impedancia característica Z₀. Si Z_in = Z₀, la onda enviada por el cable se absorbe por completo; si no, parte de ella rebota. La parte reflejada (amplitud y fase) es Γ:','Imaginez le circuit au bout d’un câble d’impédance caractéristique Z₀. Si Z_in = Z₀, l’onde envoyée est entièrement absorbée ; sinon, une partie revient. La partie réfléchie (amplitude et phase) est Γ :','Stell dir die Schaltung am Ende eines Kabels mit dem Wellenwiderstand Z₀ vor. Ist Z_in = Z₀, wird die Welle vollständig absorbiert; sonst wird ein Teil zurückgeworfen. Der reflektierte Anteil (Amplitude und Phase) ist Γ:','设想电路接在特性阻抗为 Z₀ 的电缆末端。若 Z_in = Z₀，沿电缆传来的波被完全吸收；否则一部分会反射回来。反射部分（幅值和相位）就是 Γ：'],
d_gammaNorm:['Dividing by Z₀ gives the normalised impedance z = r + jx, and Γ depends only on z:','Deljenjem sa Z₀ dobija se normalizovana impedansa z = r + jx, a Γ zavisi samo od z:','Al dividir entre Z₀ se obtiene la impedancia normalizada z = r + jx, y Γ solo depende de z:','En divisant par Z₀, on obtient l’impédance normalisée z = r + jx, et Γ ne dépend que de z :','Teilen durch Z₀ ergibt die normierte Impedanz z = r + jx, und Γ hängt nur von z ab:','除以 Z₀ 得到归一化阻抗 z = r + jx，Γ 只取决于 z：'],
d_gammaS:['With Z_in = N(s)/D(s) from step 1, multiply the numerator and denominator by D(s):','Sa Z_in = N(s)/D(s) iz koraka 1, pomnoži brojilac i imenilac sa D(s):','Con Z_in = N(s)/D(s) del paso 1, multiplica numerador y denominador por D(s):','Avec Z_in = N(s)/D(s) de l’étape 1, multipliez numérateur et dénominateur par D(s) :','Mit Z_in = N(s)/D(s) aus Schritt 1 Zähler und Nenner mit D(s) multiplizieren:','用第 1 步的 Z_in = N(s)/D(s)，分子分母同乘 D(s)：'],
d_gammaPass:['For any passive impedance r ≥ 0, so |Γ| ≤ 1: the whole right half of the z-plane maps into the unit circle. That circle is the Smith chart.','Za svaku pasivnu impedansu r ≥ 0, pa je |Γ| ≤ 1: cela desna poluravan z preslikava se u jedinični krug. Taj krug je Smitov dijagram.','Para cualquier impedancia pasiva r ≥ 0, así que |Γ| ≤ 1: todo el semiplano derecho de z se transforma en el círculo unidad. Ese círculo es la carta de Smith.','Pour toute impédance passive r ≥ 0, donc |Γ| ≤ 1 : tout le demi-plan droit des z est envoyé dans le cercle unité. Ce cercle est l’abaque de Smith.','Für jede passive Impedanz gilt r ≥ 0, also |Γ| ≤ 1: Die ganze rechte z-Halbebene wird in den Einheitskreis abgebildet. Dieser Kreis ist das Smith-Diagramm.','对任何无源阻抗 r ≥ 0，所以 |Γ| ≤ 1：整个 z 右半平面都映射到单位圆内。这个圆就是史密斯圆图。'],

d_circ1:['Invert the relation and write Γ = u + jv (u is horizontal, v is vertical on the chart):','Obrni vezu i napiši Γ = u + jv (u je horizontalno, v vertikalno na dijagramu):','Invierte la relación y escribe Γ = u + jv (u horizontal, v vertical en la carta):','Inversez la relation et écrivez Γ = u + jv (u horizontal, v vertical sur l’abaque) :','Kehre die Beziehung um und schreibe Γ = u + jv (u waagerecht, v senkrecht im Diagramm):','反解该关系，并写 Γ = u + jv（图上 u 为横向，v 为纵向）：'],
d_circ2:['Multiplying by the conjugate (1 − u + jv) and separating real and imaginary parts:','Množenjem konjugovanim (1 − u + jv) i razdvajanjem realnog i imaginarnog dela:','Multiplicando por el conjugado (1 − u + jv) y separando parte real e imaginaria:','En multipliant par le conjugué (1 − u + jv) et en séparant parties réelle et imaginaire :','Multiplizieren mit dem Konjugierten (1 − u + jv) und Trennen von Real- und Imaginärteil:','乘以共轭 (1 − u + jv) 并分开实部和虚部：'],
d_circR:['Keep r constant and complete the square: you get a circle. These are the circles of constant resistance:','Drži r konstantnim i dopuni do kvadrata: dobija se krug. To su krugovi konstantne otpornosti:','Mantén r constante y completa el cuadrado: sale un círculo. Son los círculos de resistencia constante:','Gardez r constant et complétez le carré : on obtient un cercle. Ce sont les cercles à résistance constante :','Halte r konstant und ergänze quadratisch: Es entsteht ein Kreis. Das sind die Kreise konstanten Widerstands:','保持 r 不变并配方，得到一个圆。这就是等电阻圆：'],

d_circNote:['r = 0 is the outer circle and r = 1 passes through the centre. Arcs with x > 0 are in the upper half and arcs with x < 0 in the lower half.','r = 0 je spoljašnji krug, a r = 1 prolazi kroz centar. Lukovi sa x > 0 su u gornjoj polovini, a sa x < 0 u donjoj.','r = 0 es el círculo exterior y r = 1 pasa por el centro. Los arcos con x > 0 están en la mitad superior y los de x < 0 en la inferior.','r = 0 est le cercle extérieur et r = 1 passe par le centre. Les arcs x > 0 sont dans la moitié supérieure, les arcs x < 0 dans la moitié inférieure.','r = 0 ist der Außenkreis, r = 1 geht durch die Mitte. Bögen mit x > 0 liegen in der oberen Hälfte, mit x < 0 in der unteren.','r = 0 是外圆，r = 1 经过圆心。x > 0 的弧在上半部分，x < 0 的弧在下半部分。'],
st_smRead:['Reading the chart','Čitanje dijagrama','Cómo leer la carta','Lire l’abaque','Das Diagramm lesen','如何读图'],
d_smRead2:['For circuits made only of L and C (no losses), the point always moves clockwise as the frequency rises (Foster’s reactance theorem). Resistors pull the curve inwards, towards the centre.','Za kola sastavljena samo od L i C (bez gubitaka) tačka se uvek kreće u smeru kazaljke na satu kako frekvencija raste (Fosterova teorema o reaktansi). Otpornici povlače krivu ka unutra, prema centru.','En circuitos solo de L y C (sin pérdidas), el punto siempre gira en sentido horario al subir la frecuencia (teorema de reactancia de Foster). Las resistencias llevan la curva hacia dentro, hacia el centro.','Pour un circuit composé uniquement de L et de C (sans pertes), le point tourne toujours dans le sens horaire quand la fréquence augmente (théorème de réactance de Foster). Les résistances tirent la courbe vers l’intérieur, vers le centre.','Bei Schaltungen nur aus L und C (verlustfrei) läuft der Punkt mit steigender Frequenz immer im Uhrzeigersinn (Reaktanztheorem von Foster). Widerstände ziehen die Kurve nach innen, zur Mitte.','对只由 L 和 C 组成（无损耗）的电路，随着频率升高，点总是顺时针移动（福斯特电抗定理）。电阻会把曲线拉向内部、靠近圆心。'],

d_smMetrics:['From |Γ| follow the standing-wave ratio, the return loss and the mismatch loss (how much power does not reach the circuit):','Iz |Γ| slede odnos stojećih talasa, povratni gubitak i gubitak neprilagođenja (koliko snage ne stigne do kola):','De |Γ| se obtienen la relación de onda estacionaria, las pérdidas de retorno y las pérdidas por desadaptación (cuánta potencia no llega al circuito):','De |Γ| découlent le rapport d’ondes stationnaires, l’affaiblissement de réflexion et la perte de désadaptation (la puissance qui n’atteint pas le circuit) :','Aus |Γ| folgen Stehwellenverhältnis, Rückflussdämpfung und Fehlanpassungsverlust (wie viel Leistung die Schaltung nicht erreicht):','由 |Γ| 可得驻波比、回波损耗和失配损耗（有多少功率没有到达电路）：'],

d_maxErr:['Largest relative difference between the formula and the circuit: {0} (a value below 10⁻⁴ means they agree; the rest is rounding).','Najveća relativna razlika između formule i kola: {0} (vrednost ispod 10⁻⁴ znači da se slažu; ostatak je zaokruživanje).','Mayor diferencia relativa entre la fórmula y el circuito: {0} (un valor menor que 10⁻⁴ significa que coinciden; el resto es redondeo).','Plus grand écart relatif entre la formule et le circuit : {0} (une valeur inférieure à 10⁻⁴ signifie qu’ils concordent ; le reste est de l’arrondi).','Größte relative Abweichung zwischen Formel und Schaltung: {0} (ein Wert unter 10⁻⁴ bedeutet Übereinstimmung; der Rest ist Rundung).','公式与电路之间的最大相对差：{0}（小于 10⁻⁴ 表示两者一致，剩下的是舍入误差）。'],
d_zeroN:['The numerator is zero for every s, so {0}(s) = 0 at all frequencies. In this circuit no signal can reach the output (for example, Vout is connected only to GND, or to a part of the circuit with no path from Vin).','Brojilac je nula za svako s, pa je {0}(s) = 0 na svim frekvencijama. U ovom kolu signal ne može da stigne do izlaza (na primer, Vout je vezan samo za GND ili za deo kola do kog nema puta od Vin).','El numerador es cero para todo s, así que {0}(s) = 0 en todas las frecuencias. En este circuito ninguna señal llega a la salida (por ejemplo, Vout solo está unido a GND o a una parte sin camino desde Vin).','Le numérateur est nul pour tout s : {0}(s) = 0 à toutes les fréquences. Dans ce circuit, aucun signal n’atteint la sortie (par exemple, Vout n’est relié qu’à GND, ou à une partie sans chemin depuis Vin).','Der Zähler ist für jedes s null, also {0}(s) = 0 bei allen Frequenzen. In dieser Schaltung erreicht kein Signal den Ausgang (z. B. ist Vout nur mit GND verbunden oder mit einem Teil ohne Pfad von Vin).','分子对所有 s 都为零，所以 {0}(s) 在所有频率下都为 0。在这个电路中信号无法到达输出（例如 Vout 只接到 GND，或接到与 Vin 没有通路的部分）。'],
d_zeroD:['The denominator is zero for every s, so {0} is infinite: there is no closed path for current between Vin and GND.','Imenilac je nula za svako s, pa je {0} beskonačno: između Vin i GND nema zatvorene putanje za struju.','El denominador es cero para todo s, así que {0} es infinito: no hay camino cerrado para la corriente entre Vin y GND.','Le dénominateur est nul pour tout s : {0} est infini, il n’y a pas de chemin fermé pour le courant entre Vin et GND.','Der Nenner ist für jedes s null, also ist {0} unendlich: Zwischen Vin und GND gibt es keinen geschlossenen Strompfad.','分母对所有 s 都为零，所以 {0} 为无穷大：Vin 与 GND 之间没有闭合电流路径。'],
d_tooComplex:['This circuit is too complex for a readable symbolic formula: the expression would have thousands of terms (this happens quickly in real mode, where every component adds 2–3 extra symbols). The graphs are still computed exactly. Tip: switch some components to ideal, or simplify the circuit.','Ovo kolo je previše složeno za čitljivu simboličku formulu: izraz bi imao hiljade članova (to se brzo dešava u realnom modu, gde svaka komponenta dodaje 2–3 dodatna simbola). Grafici se i dalje računaju tačno. Savet: prebaci neke komponente na idealne ili pojednostavi kolo.','Este circuito es demasiado complejo para una fórmula simbólica legible: la expresión tendría miles de términos (pasa rápido en modo real, donde cada componente añade 2–3 símbolos). Las gráficas se siguen calculando con exactitud. Consejo: pasa algunos componentes a ideales o simplifica el circuito.','Ce circuit est trop complexe pour une formule symbolique lisible : l’expression aurait des milliers de termes (cela arrive vite en mode réel, où chaque composant ajoute 2 à 3 symboles). Les graphes restent calculés exactement. Astuce : repassez certains composants en idéal ou simplifiez le circuit.','Diese Schaltung ist zu komplex für eine lesbare symbolische Formel: Der Ausdruck hätte Tausende Terme (das passiert im Realmodus schnell, weil jedes Bauteil 2–3 zusätzliche Symbole bringt). Die Diagramme werden weiterhin exakt berechnet. Tipp: Stelle einige Bauteile auf ideal oder vereinfache die Schaltung.','该电路过于复杂，无法给出可读的符号公式：表达式会有成千上万项（在真实模式下很快会出现，因为每个元件会增加 2–3 个符号）。图表仍然精确计算。建议：把部分元件切换为理想元件，或简化电路。'],
