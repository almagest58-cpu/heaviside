<title>Heaviside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen instrument — graph panel on top (left on wide screens), schematic canvas fills the rest; floating buttons over the canvas */
:root{
  --bg:#e9ecf0; --panel:#ffffff; --bg2:#f4f6f8; --canvas:#f7f8fa; --ink:#141a23; --muted:#5a6473; --line:#d6dbe2;
  --chip:#eceff3; --accent:#2350c8; --phase:#b8520c; --mark:#b0245a; --bad:#c22b2b; --ok:#1f7a45;
  --grid:#e5e8ed; --axis:#a3abb7; --dot:#c3c9d2; --fab:#ffffff; --fabink:#141a23; --add:#f2b632; --addink:#2a1d00; --scrim:rgba(10,14,20,.42);
  --kR:#8a5a2b; --kL:#0e7469; --kC:#6a3cc4; --kPt:#a1600a; --kOA:#2556b8; --port:#b0245a; --kD:#2e7d32; --kQ:#b23c1c; --kM:#9a2f8e; --kS:#5f6d00;
  --font-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07090c; --panel:#11151b; --bg2:#171c23; --canvas:#050608; --ink:#e7eaef; --muted:#9aa4b3; --line:#262d37;
  --chip:#1c222b; --accent:#7ea4ff; --phase:#f0a060; --mark:#f27aa6; --bad:#ff7b7b; --ok:#5fd393;
  --grid:#1f252e; --axis:#56606e; --dot:#252b34; --fab:#2a313c; --fabink:#e7eaef; --add:#f6c94e; --addink:#2a1d00; --scrim:rgba(0,0,0,.55);
  --kR:#e0b07e; --kL:#4fd1c1; --kC:#b69cff; --kPt:#f2b04a; --kOA:#8fb0ff; --port:#f27aa6; --kD:#7fd88a; --kQ:#ff9a7a; --kM:#f08ade; --kS:#c8d660; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07090c; --panel:#11151b; --bg2:#171c23; --canvas:#050608; --ink:#e7eaef; --muted:#9aa4b3; --line:#262d37;
  --chip:#1c222b; --accent:#7ea4ff; --phase:#f0a060; --mark:#f27aa6; --bad:#ff7b7b; --ok:#5fd393;
  --grid:#1f252e; --axis:#56606e; --dot:#252b34; --fab:#2a313c; --fabink:#e7eaef; --add:#f6c94e; --addink:#2a1d00; --scrim:rgba(0,0,0,.55);
  --kR:#e0b07e; --kL:#4fd1c1; --kC:#b69cff; --kPt:#f2b04a; --kOA:#8fb0ff; --port:#f27aa6; --kD:#7fd88a; --kQ:#ff9a7a; --kM:#f08ade; --kS:#c8d660; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
/* graph panel */
.graph{flex:0 0 40%;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.graph.hidden{flex:0 0 auto}
.graph.hidden .gbody,.graph.hidden .gfoot,.graph.hidden .readout{display:none}
@media (min-width:900px){.app{flex-direction:row}.graph{flex:0 0 46%;border-bottom:0;border-right:1px solid var(--line)}.graph.hidden{flex:0 0 auto;width:auto}}
.ghead{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}
.tabs{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.gctl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:0 12px 4px;font-size:12.5px;color:var(--muted)}
.gctl label{display:flex;align-items:center;gap:5px}
.gctl input,.gctl select{font:500 12.5px var(--font-mono);padding:4px 7px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
.gctl input{width:56px}#spWave{max-width:122px}.gctl select{padding:4px 3px}.gctl .cinfo{margin-left:-2px}
.gctl input.bad{border-color:var(--bad)}
.exgrp{font-size:13px;font-weight:700;color:var(--muted);margin:12px 2px 2px;text-transform:none}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;flex:none}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ib{border:0;background:transparent;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--chip);color:var(--ink)}
.ib svg{width:20px;height:20px}
.spacer{flex:1}
.readout{display:flex;flex-wrap:wrap;gap:0 12px;font:500 12.5px var(--font-mono);font-variant-numeric:tabular-nums;padding:0 12px 2px;min-height:20px}
.readout b{font-weight:600}.readout .m{color:var(--accent)}.readout .p{color:var(--phase)}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 8px;gap:2px}
.cvw{position:relative;min-height:0}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#wMag{flex:62}#wPh{flex:38}#wNyq{flex:1}
.graph.big{flex:0 0 80%}
@media (min-width:900px){.graph.big{flex:0 0 72%}}
.zbtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zbtns button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 20px/1 var(--font-ui);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18);padding:0}
.zbtns button svg{width:18px;height:18px}
.fxtabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
.fxtabs button{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700}
.fxtabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.dsec>h2{font-size:18px;margin:26px 0 2px;padding-top:10px;border-top:2px solid var(--ink)}
.dsec:first-child>h2{margin-top:6px}
.vtable th{text-align:left;padding:2px 14px 2px 0;font-weight:700;border-bottom:1px solid var(--line)}
.tscroll{overflow-x:auto;max-width:100%}
.theory{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:8px 0 18px}
.theory[open]{padding-bottom:10px}
.theory>summary{font-weight:700;font-size:16px;padding:10px 0;cursor:pointer}
.theory h4{font-size:14px;margin:14px 0 2px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.theory p,.theory li{max-width:68ch}
.theory ul{padding-left:20px;margin:6px 0}
.theory li{margin:4px 0}
.thex{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0}
.thex p{margin:4px 0 8px}
.derh{font-size:17px;margin:22px 0 0}
.report .thex .btn{display:none}
.stage.compact .status,.stage.compact .fab .lbl{display:none}
.gfoot{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none;min-height:34px}
.gfoot::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:2px 9px;font-size:12px;display:inline-flex;gap:5px;align-items:baseline;white-space:nowrap}
.chip .v{font:600 12px var(--font-mono)}.chip i{font-style:normal;color:var(--mark)}
.gfoot .none{font-size:12px;color:var(--muted);white-space:nowrap;padding:3px 0}
.langbtn{border:0;background:transparent;height:36px;border-radius:9px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;color:var(--muted);font:700 12.5px var(--font-mono)}
.langbtn:hover{background:var(--chip);color:var(--ink)}
.langbtn svg{width:18px;height:18px}
.langmenu{position:absolute;right:10px;top:46px;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:160px;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
.langmenu button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--ink);display:flex;justify-content:space-between;gap:12px}
.langmenu button:hover{background:var(--chip)}
.langmenu button[aria-checked="true"]{background:var(--chip);font-weight:700}
.langmenu button span{font:600 12px var(--font-mono);color:var(--muted)}
.rangebox{position:absolute;right:10px;top:46px;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);font-size:13px;color:var(--muted)}
.fq{display:inline-flex;gap:4px;align-items:center}.rangebox select{font:500 13px var(--font-mono);padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
.rangebox input{width:72px;font:500 13px var(--font-mono);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
.rangebox input.bad{border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* stage */
.stage{position:relative;flex:1;min-height:0;min-width:0;background:var(--canvas);overflow:hidden}
.sch{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sch .gd{fill:var(--dot)}
.sch .sym{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sch .part.sel .sym{stroke:var(--accent);stroke-width:2.8}
.sch .selbox{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--accent);stroke-width:1.2}
.sch .wire{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.sch .wire.sel{stroke:var(--accent);stroke-width:3.2}
.sch .whit{fill:none;stroke:transparent;stroke-width:16}
.sch .hit{fill:transparent}
.sch .part.lift .sym{stroke:var(--add);stroke-width:3.4}
.sch .part.lift .selbox{fill:color-mix(in srgb,var(--add) 18%,transparent);stroke:var(--add)}
.sch .pkg{fill:none;stroke:var(--add);stroke-width:1.4;stroke-dasharray:5 4}
.fab.realbtn.on{background:var(--add);color:var(--addink);border-color:transparent}
.fab .eser{font:700 11px var(--font-mono);letter-spacing:-.02em}.fab.stdbtn.on{background:var(--accent);color:var(--panel);border-color:transparent}
.stage.hassel #fStd{display:none}
.pill.stdp{color:var(--accent);cursor:pointer}
.chip .dv{color:var(--accent);font-weight:600}
.hint.stdh{color:var(--accent);margin:2px 0 0}
.sch .cv.cvs{stroke:var(--accent);stroke-width:1.4}
.seg3{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;gap:2px}
.seg3 button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:7px}
.seg3 button[aria-pressed="true"]{background:var(--add);color:var(--addink)}
.realblk{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) 96px;gap:8px;align-items:center;margin-top:4px}
.prow .ptag{font:700 12px var(--font-mono);color:var(--muted);min-width:48px}
.prow input[type=range]{width:100%;accent-color:var(--add)}
.prow .posl{accent-color:var(--kPt)}
.prow .posv,.prow .pval,.prow .sval{font:500 13px var(--font-mono);border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:7px;padding:4px 6px;width:100%}
.prow .sval.bad{border-color:var(--bad);color:var(--bad)}.opln{margin:6px 0 2px;line-height:1.45}
.slhead{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.btn.tolbtn[aria-pressed="true"]{background:var(--accent);color:var(--panel);border-color:transparent}
.tolrow{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-size:13px;color:var(--muted)}.tolrow .tolin{width:72px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:500 14px var(--font-mono)}
.sch .cn{stroke:none}.sch .cnt{font:700 11px var(--font-mono);fill:var(--canvas)}
.sch .kR{fill:var(--kR)}.sch .kL{fill:var(--kL)}.sch .kC{fill:var(--kC)}.sch .kPt{fill:var(--kPt)}.sch .kOA{fill:var(--kOA)}.sch .kD{fill:var(--kD)}.sch .kQ{fill:var(--kQ)}.sch .kM{fill:var(--kM)}.sch .kVDC,.sch .kIDC{fill:var(--kS)}
.sch .symb{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:butt}.sch .symc{fill:none;stroke:var(--ink);stroke-width:1.3;opacity:.55}.sch .cv.rok{stroke:var(--ok)}.sch .cv.rwarn{stroke:#c77700}.sch .cv.roff{stroke:var(--muted);stroke-dasharray:3 2}
.sch .symf{fill:var(--ink);stroke:none}.sch .oas{font:700 15px var(--font-mono);fill:var(--ink)}
.sch .cv{fill:var(--panel);stroke:var(--line);stroke-width:1}.sch .cvt{font:500 11px var(--font-mono);fill:var(--ink)}
.sch .pl{font:700 12px var(--font-mono);fill:var(--port)}
.sch .pbox{fill:var(--panel);stroke:var(--port);stroke-width:1.5}
.sch .open{fill:var(--canvas);stroke:var(--ink);stroke-width:1.5}
.sch .jn{fill:var(--ink)}
.sch .pend{fill:var(--accent)}
.sch .thit{fill:transparent}
.sch .pv{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
@media (prefers-reduced-motion:no-preference){.sch .pend{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{from{opacity:1}to{opacity:.4}}}
.status{position:absolute;left:12px;top:10px;right:12px;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.status .pills{display:flex;flex-wrap:wrap;gap:6px}
.ctitle{pointer-events:auto;max-width:100%;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;text-shadow:0 0 6px var(--canvas),0 0 2px var(--canvas)}
.pill{pointer-events:auto;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.pill.err{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.pill b{color:var(--ink);font-family:var(--font-mono)}
.hint{font-size:12px;color:var(--muted)}
.fabs{position:absolute;left:12px;bottom:calc(12px + var(--barh,0px));z-index:4;display:flex;flex-direction:column-reverse;gap:8px;transition:bottom .15s}
.fab{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--fab);color:var(--fabink);display:grid;place-items:center;box-shadow:0 5px 13px -5px rgba(0,0,0,.45);position:relative}
.fab svg{width:20px;height:20px}
.stage.hassel #fHelp{display:none}
.fab .hlp{width:19px;height:19px;border:1.8px solid currentColor;border-radius:50%;display:grid;place-items:center;font:italic 700 12.5px/1 Georgia,'Times New Roman',serif}
.gsec{margin:14px 0 4px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.grow{display:flex;gap:12px;align-items:flex-start;margin:8px 0}
.grow p{margin:2px 0 0;line-height:1.45}
.gic{flex:0 0 38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--fab);color:var(--fabink);display:grid;place-items:center;font-weight:700;font-size:12px}
.gic svg{width:20px;height:20px}.gic.add{background:var(--add);color:#111;border-color:transparent}.gic.txt{border-radius:10px;flex-basis:auto;min-width:38px;padding:0 6px}
.gic .hlp{width:20px;height:20px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font:italic 700 13px/1 Georgia,serif}
.prst{margin-left:auto;display:inline-flex;align-items:center;gap:5px;flex:none;font:600 12.5px var(--font-ui);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.prst svg{width:14px;height:14px}.prst:active{background:var(--chip)}
.fab.small{width:38px;height:38px}
.fab .lbl{position:absolute;left:48px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--muted);pointer-events:none;opacity:0;transition:opacity .5s ease}
.stage.labels .fab .lbl{opacity:1}
.fabs.r{left:auto;right:19px;bottom:calc(74px + var(--barh,0px))}
.fabs.r .lbl{left:auto;right:48px}
.fab.sel-only{display:none}
.stage.hassel .fabs:not(.r) .fab:not(#fFx):not(#fUndo){display:none}
.stage.hassel .fab.add{display:none}
.stage.hassel .fabs.r{bottom:calc(14px + var(--barh,0px))}
.selbar{max-height:44%;overflow:auto;overscroll-behavior:contain}
.stage.hassel .fab.sel-only{display:grid}
.fab.rot{background:var(--accent);color:var(--panel);border-color:transparent}
.fab.del{color:var(--bad)}
.fab.add{position:absolute;left:auto;right:14px;bottom:calc(14px + var(--barh,0px));width:48px;height:48px;background:var(--add);color:var(--addink);border-color:transparent;z-index:4;transition:bottom .15s}
.fab.add svg{width:23px;height:23px}
.fx{font:700 12.5px var(--font-mono)}
.selbar{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 10px 30px -14px rgba(0,0,0,.5)}
.selrow{display:flex;align-items:center;gap:8px}
.tag{font:700 13px var(--font-mono);color:var(--k,var(--ink));background:color-mix(in srgb,var(--k,var(--ink)) 15%,transparent);padding:4px 8px;border-radius:7px;min-width:42px;text-align:center;border:0}
.kR{--k:var(--kR)}.kL{--k:var(--kL)}.kC{--k:var(--kC)}.kP{--k:var(--port)}.kPt{--k:var(--kPt)}.kOA{--k:var(--kOA)}.kD{--k:var(--kD)}.kQ{--k:var(--kQ)}.kM{--k:var(--kM)}.kVDC,.kIDC{--k:var(--kS)}
.val{flex:1;min-width:0;font:500 15px var(--font-mono);font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;padding:6px 8px}
.val.bad{border-color:var(--bad);color:var(--bad)}
.sl{width:100%;margin:8px 0 0;accent-color:var(--k)}
.scale{display:flex;justify-content:space-between;font:11px var(--font-mono);color:var(--muted)}
/* drawer & sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.cinfo{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--muted);font:italic 700 12px/18px Georgia,serif;text-align:center;color:var(--muted);background:var(--bg2);padding:0;cursor:pointer}
.dinfo{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font:italic 700 12px/19px Georgia,serif;text-align:center;color:var(--muted);background:var(--bg2)}
.imodal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.imodal[hidden]{display:none!important}
.ibg{position:absolute;inset:0;background:var(--scrim)}
.icard{position:relative;width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px 18px;color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ihead{display:flex;align-items:center;gap:8px;position:sticky;top:-10px;background:var(--panel);padding:4px 0;z-index:1}.ihead h2{flex:1;margin:2px 0;font-size:18px}
.icard p{margin:6px 0;line-height:1.45;font-size:14px}
.ibox{border:1px solid var(--line);border-radius:12px;padding:6px 10px 8px;margin-top:10px;background:var(--bg2)}
.ibox h3{margin:4px 0;font-size:14px}.ibox h4{margin:8px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.isvg{display:block;width:100%;max-width:440px;height:auto;margin:4px auto;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.isvg text{fill:var(--accent);stroke:none;font:600 12px var(--font-mono)}.isvg text.tm{fill:var(--muted);font-weight:500}
.isvg .dt{fill:var(--ink);stroke:none}.isvg .tr{fill:var(--panel)}

.drawer{position:absolute;left:0;top:0;bottom:0;width:min(290px,82%);z-index:21;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 14px 24px}
.drawer h3{font-size:17px;font-weight:700;margin:6px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--add)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.ditem{position:relative;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.ditem svg{width:56px;height:30px;color:var(--ink)}
.ditem:active{background:var(--chip)}
.ditem.fltab[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.flfield{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px}
.flfield input,.flfield textarea{font:15px var(--font-ui);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink);resize:vertical;width:100%}
.flfield input:focus,.flfield textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.flbtn{width:100%;padding:11px 12px;font-size:14px}
.flmsg{font-size:13px;color:var(--muted);min-height:18px;margin:8px 0 0}
.flmsg.bad{color:var(--bad)}.flmsg.ok{color:var(--ok)}
.fllist{list-style:none;margin:0;padding:0}
.fllist li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.fllist .flname{flex:1;min-width:0;text-align:left;border:0;background:none;padding:13px 4px;font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fllist .flname:active{background:var(--chip)}
.fllist .fldel{border:0;background:none;color:var(--muted);padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;flex:none}
.fllist .fldel.arm{background:var(--bad);color:#fff}
.flempty{font-size:13px;color:var(--muted);padding:6px 2px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:78%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:6px 14px 20px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.shead h2{font-size:17px;margin:0;font-weight:700}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 12px}
.ex b{display:block;font-size:14px}.ex span{font-size:12.5px;color:var(--muted)}
.ex svg{flex:none;width:64px;height:36px;color:var(--ink)}
.el{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;margin-bottom:6px}
.full{position:absolute;inset:0;z-index:22;background:var(--panel);display:flex;flex-direction:column}
.fhead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.fhead h2{font-size:17px;margin:0;font-weight:700}
.fbody{flex:1;overflow:auto;padding:4px 16px 40px}
.fbody .wrap{max-width:760px;margin:0 auto}
.stale{font-size:13px;color:var(--phase);margin:8px 0 0}
.step{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.step h3{font-size:15px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.num{font:600 12px var(--font-mono);background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--muted)}
.step p{margin:6px 0;max-width:68ch}
.step code{font:500 13px var(--font-mono);background:var(--chip);padding:1px 5px;border-radius:5px}
.note{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);padding:6px 10px;border-radius:0 8px 8px 0;font-size:14px}
.eq{overflow-x:auto;overflow-y:hidden;padding:2px 0;max-width:100%}
.eq mjx-container{margin:6px 0!important}
.nomath .eq{font:12.5px var(--font-mono);white-space:pre-wrap;word-break:break-word;background:var(--chip);padding:8px 10px;border-radius:8px;margin:6px 0}
.vtable{border-collapse:collapse;font:13px var(--font-mono);font-variant-numeric:tabular-nums}
.vtable td{padding:2px 14px 2px 0}
.check{font:500 13px var(--font-mono)}
.okmark{color:var(--ok);font-weight:600}
.pdfnote{font-size:12px;color:var(--muted)}
.report{display:none}
@media print{
  @page{margin:14mm}
  html,body{height:auto;overflow:visible}
  .app{display:none!important}
  body{background:#fff!important;color:#000!important}
  .report{display:block;color:#000;font-family:var(--font-ui);font-size:11pt;line-height:1.45;
    --ink:#141a23;--muted:#555;--accent:#141a23;--bg2:#fff;--panel:#fff;--canvas:#fff;--line:#bbb;--port:#8a1c47;--kR:#6b4420;--kL:#0b5b52;--kC:#52309a;--kPt:#6e4207;--kOA:#1d3f87;--kD:#1b5e20;--kQ:#8a2a10;--kM:#6f1f66;--kS:#454f00;--chip:#eee;--ok:#1f7a45}
  .report h1{font-size:18pt;margin:0 0 2pt}
  .report h2{font-size:13pt;margin:14pt 0 4pt}
  .report .meta{color:#444;margin:0 0 8pt}
  .report img{width:100%;display:block;margin:4pt 0;break-inside:avoid}
  /* a heading stays on the same page as its graph */
  .report .rblk{break-inside:avoid;page-break-inside:avoid}
  .report h2{break-after:avoid;page-break-after:avoid}
  .report .rcover{break-after:page;page-break-after:always}
  .report .rcover h1{font-size:22pt;margin:0 0 4pt}
  .report .rcover .sub{font-size:12pt;font-weight:600;color:#333;margin:0 0 2pt}
  /* the schematic keeps its aspect ratio with a padding box, so it can never spill over the content below it */
  .report .rsw{width:100%;margin:6pt auto 0;border:1px solid #ccc;break-inside:avoid}
  .report .rsw>div{position:relative;width:100%;height:0}
  .report .rsw svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
  .report .step{border-top:1px solid #ccc;break-inside:auto}
  .report .eq{overflow:visible}
  .report mjx-container[display="true"] svg{max-width:100%;height:auto}
}

<script>
/* order: en, sr, es, fr, de, zh */
const LANGS=[['en','English','EN','en-GB'],['sr','Srpski','SR','sr-Latn-RS'],['es','Español','ES','es-ES'],['fr','Français','FR','fr-FR'],['de','Deutsch','DE','de-DE'],['zh','中文','中','zh-CN']];
const I18N={
cinf_spd:['Duty cycle D of the pulse: the share of each period during which the signal is 1 V (the rest is 0 V). The average value (DC) equals D, and the harmonics vanish at every n for which n·D is a whole number (e.g. every 5th harmonic for D = 20 %).', 'Faktor ispune D impulsa: deo svake periode tokom kog je signal 1 V (ostatak je 0 V). Srednja vrednost (DC) jednaka je D, a harmonici nestaju za svako n za koje je n·D ceo broj (npr. svaki 5. harmonik za D = 20 %).', 'Ciclo de trabajo D del pulso: la fracción de cada periodo en la que la señal vale 1 V (el resto 0 V). El valor medio (DC) es D, y los armónicos se anulan en cada n con n·D entero (p. ej. cada 5.º armónico para D = 20 %).', 'Rapport cyclique D de l’impulsion : la part de chaque période où le signal vaut 1 V (le reste 0 V). La valeur moyenne (continu) vaut D, et les harmoniques s’annulent pour tout n tel que n·D est entier (p. ex. chaque 5e harmonique pour D = 20 %).', 'Tastgrad D des Pulses: der Anteil jeder Periode, in dem das Signal 1 V ist (sonst 0 V). Der Mittelwert (DC) ist D, und die Harmonischen verschwinden bei jedem n, für das n·D ganzzahlig ist (z. B. jede 5. bei D = 20 %).', '脉冲的占空比 D：每个周期中信号为 1 V 的时间比例（其余为 0 V）。平均值（直流）等于 D，凡 n·D 为整数的谐波都为零（例如 D = 20 % 时每第 5 次谐波）。'],
cinf_spw:['Input signal for the Spectrum tab: a periodic wave (square, triangle, sawtooth, pulse with adjustable duty cycle D or sine) of amplitude 1 V. It is split into sine harmonics (grey bars); the circuit changes each harmonic by |H| and φ at its frequency (blue bars), and the harmonics added back together give the output wave in the lower graph.', 'Ulazni signal za karticu Spektar: periodični talas (pravougaoni, trougaoni, testerasti, impuls sa podesivim faktorom ispune D ili sinus) amplitude 1 V. Razlaže se na sinusne harmonike (sivi stubići); kolo svaki harmonik promeni za |H| i φ na njegovoj frekvenciji (plavi stubići), a sabrani harmonici daju izlazni talas na donjem grafiku.', 'Señal de entrada para la pestaña Espectro: una onda periódica (cuadrada, triangular, diente de sierra, pulso con ciclo de trabajo D ajustable o seno) de 1 V de amplitud. Se descompone en armónicos senoidales (barras grises); el circuito cambia cada armónico en |H| y φ a su frecuencia (barras azules) y, sumados de nuevo, dan la onda de salida del gráfico inferior.', 'Signal d’entrée de l’onglet Spectre : une onde périodique (carrée, triangulaire, dent de scie, impulsion à rapport cyclique D réglable ou sinus) d’amplitude 1 V. Elle est décomposée en harmoniques sinusoïdaux (barres grises) ; le circuit modifie chacun de |H| et φ à sa fréquence (barres bleues), et leur somme donne l’onde de sortie du graphe du bas.', 'Eingangssignal für den Reiter Spektrum: eine periodische Welle (Rechteck, Dreieck, Sägezahn, Puls mit einstellbarem Tastgrad D oder Sinus) mit 1 V Amplitude. Sie wird in Sinus-Harmonische zerlegt (graue Balken); die Schaltung ändert jede um |H| und φ bei ihrer Frequenz (blaue Balken), die Summe ergibt die Ausgangswelle im unteren Graphen.', '频谱页的输入信号：幅值 1 V 的周期波（方波、三角波、锯齿波、占空比 D 可调的脉冲或正弦）。它被分解为正弦谐波（灰色柱）；电路按各谐波频率处的 |H| 和 φ 改变每个谐波（蓝色柱），谐波再相加得到下方图中的输出波形。'],
cinf_spf:['f₀ is the repetition frequency (fundamental) of the input wave; one period is T = 1/f₀. The harmonics lie at f₀, 2f₀, 3f₀, … — choose f₀ near the cutoff of your filter to see the waveform change the most.', 'f₀ je frekvencija ponavljanja (osnovni harmonik) ulaznog talasa; jedna perioda je T = 1/f₀. Harmonici su na f₀, 2f₀, 3f₀, … — izaberi f₀ blizu granične frekvencije filtra da vidiš najveću promenu oblika talasa.', 'f₀ es la frecuencia de repetición (fundamental) de la onda de entrada; un periodo es T = 1/f₀. Los armónicos están en f₀, 2f₀, 3f₀, …; elige f₀ cerca del corte del filtro para ver el mayor cambio de forma.', 'f₀ est la fréquence de répétition (fondamentale) de l’onde d’entrée ; une période vaut T = 1/f₀. Les harmoniques sont à f₀, 2f₀, 3f₀, … — choisis f₀ près de la coupure du filtre pour voir la forme changer le plus.', 'f₀ ist die Wiederholfrequenz (Grundwelle) der Eingangswelle; eine Periode ist T = 1/f₀. Die Harmonischen liegen bei f₀, 2f₀, 3f₀, … — wähle f₀ nahe der Grenzfrequenz des Filters, dann ändert sich die Form am stärksten.', 'f₀ 是输入波形的重复频率（基波）；一个周期 T = 1/f₀。谐波位于 f₀、2f₀、3f₀ …… 把 f₀ 选在滤波器截止频率附近，波形变化最明显。'],
cinf_z0:['Z₀ is the reference (characteristic) impedance of the Smith chart, usually 50 Ω (RF) or 75 Ω (video). The chart shows the input impedance Z normalized to Z₀ and the reflection coefficient Γ: the centre means Z = Z₀ (perfect match, no reflection), the edge |Γ| = 1 means total reflection.', 'Z₀ je referentna (karakteristična) impedansa Smitovog dijagrama, obično 50 Ω (RF) ili 75 Ω (video). Dijagram prikazuje ulaznu impedansu Z normalizovanu na Z₀ i koeficijent refleksije Γ: centar znači Z = Z₀ (savršeno prilagođenje, nema refleksije), a ivica |Γ| = 1 potpunu refleksiju.', 'Z₀ es la impedancia de referencia (característica) de la carta de Smith, normalmente 50 Ω (RF) o 75 Ω (vídeo). La carta muestra la impedancia de entrada Z normalizada a Z₀ y el coeficiente de reflexión Γ: el centro es Z = Z₀ (adaptación perfecta, sin reflexión) y el borde |Γ| = 1, reflexión total.', 'Z₀ est l’impédance de référence (caractéristique) de l’abaque de Smith, en général 50 Ω (RF) ou 75 Ω (vidéo). L’abaque montre l’impédance d’entrée Z normalisée par Z₀ et le coefficient de réflexion Γ : le centre signifie Z = Z₀ (adaptation parfaite), le bord |Γ| = 1 une réflexion totale.', 'Z₀ ist die Bezugs-(Wellen-)Impedanz des Smith-Diagramms, meist 50 Ω (HF) oder 75 Ω (Video). Das Diagramm zeigt die auf Z₀ normierte Eingangsimpedanz Z und den Reflexionsfaktor Γ: Mitte = Z = Z₀ (perfekte Anpassung), Rand |Γ| = 1 = Totalreflexion.', 'Z₀ 是史密斯圆图的参考（特性）阻抗，通常为 50 Ω（射频）或 75 Ω（视频）。圆图显示按 Z₀ 归一化的输入阻抗 Z 及反射系数 Γ：圆心表示 Z = Z₀（完全匹配、无反射），边缘 |Γ| = 1 表示全反射。'],
inf_sch:['Schematic', 'Šema', 'Esquema', 'Schéma', 'Schaltbild', '电路图'],
inf_frm:['Formulas', 'Formule', 'Fórmulas', 'Formules', 'Formeln', '公式'],
inf_noreal:['This part has no real model: it is the ideal reference of the analysis.', 'Ovaj deo nema realni model: on je idealna referenca analize.', 'Esta pieza no tiene modelo real: es la referencia ideal del análisis.', 'Cet élément n’a pas de modèle réel : c’est la référence idéale de l’analyse.', 'Dieses Teil hat kein reales Modell: Es ist die ideale Referenz der Analyse.', '该元件没有实际模型：它是分析的理想参考。'],
inf_vin_d:['The input: an ideal sine voltage source of amplitude 1 V at every frequency, with zero internal resistance. All graphs are relative to it.', 'Ulaz: idealan sinusni naponski izvor amplitude 1 V na svakoj frekvenciji, unutrašnje otpornosti nula. Svi grafici su u odnosu na njega.', 'La entrada: una fuente de tensión senoidal ideal de 1 V de amplitud en cada frecuencia, con resistencia interna nula. Todos los gráficos se refieren a ella.', 'L’entrée : une source de tension sinusoïdale idéale de 1 V d’amplitude à chaque fréquence, de résistance interne nulle. Tous les graphes s’y rapportent.', 'Der Eingang: eine ideale Sinus-Spannungsquelle mit 1 V Amplitude bei jeder Frequenz und null Innenwiderstand. Alle Graphen beziehen sich darauf.', '输入：每个频率下幅值 1 V 的理想正弦电压源，内阻为零。所有曲线都以它为参照。'],
inf_vout_d:['The output: an ideal voltmeter with infinite resistance (it draws no current). Without Vout the app shows the impedance Z seen from Vin.', 'Izlaz: idealan voltmetar beskonačne otpornosti (ne vuče struju). Bez Vout aplikacija prikazuje impedansu Z koju vidi Vin.', 'La salida: un voltímetro ideal de resistencia infinita (no toma corriente). Sin Vout la app muestra la impedancia Z vista desde Vin.', 'La sortie : un voltmètre idéal de résistance infinie (il ne tire aucun courant). Sans Vout, l’app montre l’impédance Z vue depuis Vin.', 'Der Ausgang: ein ideales Voltmeter mit unendlichem Widerstand (zieht keinen Strom). Ohne Vout zeigt die App die von Vin gesehene Impedanz Z.', '输出：电阻无穷大的理想电压表（不取电流）。没有 Vout 时，应用显示从 Vin 看进去的阻抗 Z。'],
inf_gnd_d:['Ground: the reference node with potential 0 V. Every circuit needs it; all GND symbols are the same node.', 'Masa: referentni čvor potencijala 0 V. Svako kolo je mora imati; svi GND simboli su isti čvor.', 'Masa: el nodo de referencia con potencial 0 V. Todo circuito la necesita; todos los símbolos GND son el mismo nodo.', 'Masse : le nœud de référence au potentiel 0 V. Tout circuit en a besoin ; tous les symboles GND sont le même nœud.', 'Masse: der Bezugsknoten mit 0 V. Jede Schaltung braucht ihn; alle GND-Symbole sind derselbe Knoten.', '地：电位为 0 V 的参考节点。每个电路都需要它；所有 GND 符号都是同一个节点。'],
inf_r_d:['A resistor turns electrical energy into heat; voltage and current are in phase.', 'Otpornik pretvara električnu energiju u toplotu; napon i struja su u fazi.', 'Una resistencia convierte energía eléctrica en calor; tensión y corriente están en fase.', 'Une résistance transforme l’énergie électrique en chaleur ; tension et courant sont en phase.', 'Ein Widerstand wandelt elektrische Energie in Wärme; Spannung und Strom sind in Phase.', '电阻把电能转化为热能；电压与电流同相。'],
inf_r_i:['Ideal: the same resistance at every frequency.', 'Idealan: ista otpornost na svakoj frekvenciji.', 'Ideal: la misma resistencia a cualquier frecuencia.', 'Idéal : la même résistance à toute fréquence.', 'Ideal: gleicher Widerstand bei jeder Frequenz.', '理想：任何频率下电阻都相同。'],
inf_r_r:['Real: the leads and the body add a small series inductance L_s, and the ends form a small capacitance C_p. At high frequencies a large resistor looks capacitive and a small one inductive.', 'Realan: izvodi i telo dodaju malu rednu induktivnost L_s, a krajevi čine malu kapacitivnost C_p. Na visokim frekvencijama veliki otpornik izgleda kapacitivno, a mali induktivno.', 'Real: los terminales y el cuerpo añaden una pequeña inductancia en serie L_s, y los extremos forman una pequeña capacidad C_p. A alta frecuencia una resistencia grande parece capacitiva y una pequeña inductiva.', 'Réel : les pattes et le corps ajoutent une petite inductance série L_s, et les extrémités forment une petite capacité C_p. En haute fréquence une grande résistance paraît capacitive et une petite inductive.', 'Real: Anschlüsse und Körper bringen eine kleine Serieninduktivität L_s, die Enden eine kleine Kapazität C_p. Bei hohen Frequenzen wirkt ein großer Widerstand kapazitiv, ein kleiner induktiv.', '实际：引线和本体带来小的串联电感 L_s，两端形成小电容 C_p。高频时大电阻呈容性，小电阻呈感性。'],
inf_l_d:['An inductor (coil) stores energy in its magnetic field; its impedance grows with frequency and the current lags the voltage by 90°.', 'Kalem čuva energiju u magnetnom polju; impedansa mu raste sa frekvencijom, a struja kasni za naponom 90°.', 'Una bobina almacena energía en su campo magnético; su impedancia crece con la frecuencia y la corriente se retrasa 90° respecto a la tensión.', 'Une bobine stocke l’énergie dans son champ magnétique ; son impédance croît avec la fréquence et le courant est en retard de 90° sur la tension.', 'Eine Spule speichert Energie im Magnetfeld; ihre Impedanz wächst mit der Frequenz, der Strom eilt der Spannung um 90° nach.', '电感在磁场中储能；其阻抗随频率增大，电流滞后电压 90°。'],
inf_l_i:['Ideal: pure inductance, no losses, Z grows without limit.', 'Idealan: čista induktivnost, bez gubitaka, Z raste neograničeno.', 'Ideal: inductancia pura, sin pérdidas, Z crece sin límite.', 'Idéal : inductance pure, sans pertes, Z croît sans limite.', 'Ideal: reine Induktivität, verlustfrei, Z wächst unbegrenzt.', '理想：纯电感，无损耗，Z 无限增大。'],
inf_l_r:['Real: the wire has resistance R_dc (losses, finite Q), and neighbouring turns form a capacitance C_p. Above the self-resonant frequency f_SRF the coil behaves like a capacitor.', 'Realan: žica ima otpornost R_dc (gubici, konačan Q), a susedni navoji čine kapacitivnost C_p. Iznad sopstvene rezonantne frekvencije f_SRF kalem se ponaša kao kondenzator.', 'Real: el hilo tiene resistencia R_dc (pérdidas, Q finito) y las espiras vecinas forman una capacidad C_p. Por encima de su frecuencia de autorresonancia f_SRF se comporta como un condensador.', 'Réel : le fil a une résistance R_dc (pertes, Q fini) et les spires voisines forment une capacité C_p. Au-delà de la fréquence d’autorésonance f_SRF, la bobine se comporte comme un condensateur.', 'Real: Der Draht hat den Widerstand R_dc (Verluste, endliches Q), benachbarte Windungen bilden C_p. Oberhalb der Eigenresonanz f_SRF verhält sich die Spule wie ein Kondensator.', '实际：导线有电阻 R_dc（损耗、有限 Q），相邻匝之间形成电容 C_p。超过自谐振频率 f_SRF 后电感表现为电容。'],
inf_c_d:['A capacitor stores energy in its electric field; its impedance falls with frequency and the current leads the voltage by 90°.', 'Kondenzator čuva energiju u električnom polju; impedansa mu opada sa frekvencijom, a struja prednjači naponu za 90°.', 'Un condensador almacena energía en su campo eléctrico; su impedancia baja con la frecuencia y la corriente adelanta 90° a la tensión.', 'Un condensateur stocke l’énergie dans son champ électrique ; son impédance baisse avec la fréquence et le courant est en avance de 90°.', 'Ein Kondensator speichert Energie im elektrischen Feld; seine Impedanz sinkt mit der Frequenz, der Strom eilt der Spannung um 90° voraus.', '电容在电场中储能；其阻抗随频率降低，电流超前电压 90°。'],
inf_c_i:['Ideal: pure capacitance, Z falls without limit (a short circuit at very high frequency).', 'Idealan: čista kapacitivnost, Z opada neograničeno (kratak spoj na vrlo visokoj frekvenciji).', 'Ideal: capacidad pura, Z baja sin límite (cortocircuito a muy alta frecuencia).', 'Idéal : capacité pure, Z baisse sans limite (court-circuit à très haute fréquence).', 'Ideal: reine Kapazität, Z sinkt unbegrenzt (Kurzschluss bei sehr hoher Frequenz).', '理想：纯电容，Z 无限减小（极高频时相当于短路）。'],
inf_c_r:['Real: the plates and leads add series resistance ESR and series inductance ESL, and the dielectric leaks through R_p. |Z| has a minimum (= ESR) at f_SRF; above it the capacitor behaves like an inductor — that is why decoupling uses several capacitors.', 'Realan: ploče i izvodi dodaju rednu otpornost ESR i rednu induktivnost ESL, a dielektrik propušta kroz R_p. |Z| ima minimum (= ESR) na f_SRF; iznad nje kondenzator se ponaša kao kalem — zato se za blokadu koristi više kondenzatora.', 'Real: las placas y terminales añaden la resistencia ESR y la inductancia ESL en serie, y el dieléctrico fuga a través de R_p. |Z| tiene un mínimo (= ESR) en f_SRF; por encima se comporta como una bobina; por eso el desacoplo usa varios condensadores.', 'Réel : les armatures et les pattes ajoutent la résistance série ESR et l’inductance série ESL, et le diélectrique fuit par R_p. |Z| a un minimum (= ESR) à f_SRF ; au-delà il se comporte comme une bobine — d’où plusieurs condensateurs de découplage.', 'Real: Beläge und Anschlüsse bringen den Serienwiderstand ESR und die Serieninduktivität ESL, das Dielektrikum leckt über R_p. |Z| hat bei f_SRF ein Minimum (= ESR); darüber wirkt er wie eine Spule — deshalb nutzt man mehrere Abblockkondensatoren.', '实际：极板和引线带来串联电阻 ESR 和串联电感 ESL，介质通过 R_p 漏电。|Z| 在 f_SRF 处最小（= ESR）；高于此频率电容表现为电感——所以去耦要用多个电容。'],
inf_p_d:['A potentiometer is a resistive track R with a sliding contact (wiper W); it divides the voltage between ends A and B. α is the wiper position from A (0 … 100 %).', 'Potenciometar je otporna staza R sa kliznim kontaktom (klizač W); deli napon između krajeva A i B. α je položaj klizača od A (0 … 100 %).', 'Un potenciómetro es una pista resistiva R con un contacto deslizante (cursor W); divide la tensión entre los extremos A y B. α es la posición del cursor desde A (0 … 100 %).', 'Un potentiomètre est une piste résistive R avec un contact glissant (curseur W) ; il divise la tension entre les extrémités A et B. α est la position du curseur depuis A (0 … 100 %).', 'Ein Potentiometer ist eine Widerstandsbahn R mit Schleifer W; es teilt die Spannung zwischen den Enden A und B. α ist die Schleiferstellung ab A (0 … 100 %).', '电位器是一条带滑动触点（滑动端 W）的电阻轨道 R，在两端 A、B 之间分压。α 是滑动端距 A 的位置（0 … 100 %）。'],
inf_p_i:['Ideal: two resistors αR and (1−α)R joined at the wiper.', 'Idealan: dva otpornika αR i (1−α)R spojena u klizaču.', 'Ideal: dos resistencias αR y (1−α)R unidas en el cursor.', 'Idéal : deux résistances αR et (1−α)R reliées au curseur.', 'Ideal: zwei Widerstände αR und (1−α)R, am Schleifer verbunden.', '理想：αR 与 (1−α)R 两个电阻在滑动端相连。'],
inf_p_r:['Real: the track has inductance L_s (split in the same ratio), the wiper has contact resistance R_w, and there is a capacitance C_p across the whole track.', 'Realan: staza ima induktivnost L_s (deli se u istom odnosu), klizač ima kontaktnu otpornost R_w, a preko cele staze postoji kapacitivnost C_p.', 'Real: la pista tiene inductancia L_s (repartida en la misma proporción), el cursor tiene resistencia de contacto R_w y hay una capacidad C_p sobre toda la pista.', 'Réel : la piste a une inductance L_s (partagée dans le même rapport), le curseur une résistance de contact R_w, et une capacité C_p existe sur toute la piste.', 'Real: Die Bahn hat die Induktivität L_s (gleich geteilt), der Schleifer den Übergangswiderstand R_w, und über die ganze Bahn liegt C_p.', '实际：轨道有电感 L_s（按相同比例分配），滑动端有接触电阻 R_w，整条轨道两端有电容 C_p。'],
inf_oa_d:['An operational amplifier amplifies the voltage difference between its inputs (+ and −) very strongly. With negative feedback (output back to the − input) the circuit gain is set by the external components.', 'Operacioni pojačavač veoma jako pojačava razliku napona između ulaza (+ i −). Uz negativnu povratnu spregu (izlaz vraćen na − ulaz) pojačanje kola određuju spoljašnje komponente.', 'Un amplificador operacional amplifica muchísimo la diferencia de tensión entre sus entradas (+ y −). Con realimentación negativa (salida hacia la entrada −) la ganancia la fijan los componentes externos.', 'Un amplificateur opérationnel amplifie très fortement la différence de tension entre ses entrées (+ et −). Avec contre-réaction (sortie ramenée sur −), le gain est fixé par les composants extérieurs.', 'Ein Operationsverstärker verstärkt die Spannungsdifferenz zwischen seinen Eingängen (+ und −) sehr stark. Mit Gegenkopplung (Ausgang zurück auf −) bestimmen die äußeren Bauteile die Verstärkung.', '运算放大器把两个输入端（+、−）之间的电压差极大地放大。有负反馈（输出接回 − 输入）时，电路增益由外部元件决定。'],
inf_oa_i:['Ideal: infinite gain and bandwidth, no input current, zero output resistance. With feedback this gives V+ = V− (virtual short) and the formulas depend only on R and C.', 'Idealan: beskonačno pojačanje i opseg, ulazi ne vuku struju, izlazna otpornost nula. Uz povratnu spregu to daje V+ = V− (virtuelni kratak spoj), pa formule zavise samo od R i C.', 'Ideal: ganancia y ancho de banda infinitos, sin corriente de entrada, resistencia de salida nula. Con realimentación da V+ = V− (cortocircuito virtual) y las fórmulas dependen solo de R y C.', 'Idéal : gain et bande infinis, aucun courant d’entrée, résistance de sortie nulle. Avec contre-réaction on a V+ = V− (court-circuit virtuel) et les formules ne dépendent que de R et C.', 'Ideal: unendliche Verstärkung und Bandbreite, kein Eingangsstrom, Ausgangswiderstand null. Mit Rückkopplung gilt V+ = V− (virtueller Kurzschluss), die Formeln hängen nur von R und C ab.', '理想：增益和带宽无穷大，输入无电流，输出电阻为零。有反馈时 V+ = V−（虚短），公式只与 R、C 有关。'],
inf_oa_r:['Real: finite gain A₀ that falls 20 dB/dec above the pole ω_p and reaches 1 at GBW, so the closed-loop gain drops at high frequencies (H = A/(1+Aβ)). Inputs have L_in, R_in and C_in, the output has R_out, L_out and C_out.', 'Realan: konačno pojačanje A₀ koje iznad pola ω_p pada 20 dB/dek i na GBW postaje 1, pa pojačanje kola opada na visokim frekvencijama (H = A/(1+Aβ)). Ulazi imaju L_in, R_in i C_in, a izlaz R_out, L_out i C_out.', 'Real: ganancia finita A₀ que cae 20 dB/déc por encima del polo ω_p y vale 1 en GBW, así que la ganancia en lazo cerrado baja a alta frecuencia (H = A/(1+Aβ)). Las entradas tienen L_in, R_in y C_in; la salida R_out, L_out y C_out.', 'Réel : gain fini A₀ qui chute de 20 dB/déc au-delà du pôle ω_p et vaut 1 à GBW, donc le gain en boucle fermée baisse en haute fréquence (H = A/(1+Aβ)). Les entrées ont L_in, R_in et C_in, la sortie R_out, L_out et C_out.', 'Real: endliche Verstärkung A₀, die oberhalb des Pols ω_p mit 20 dB/Dek fällt und bei GBW 1 erreicht; daher sinkt die Schleifenverstärkung bei hohen Frequenzen (H = A/(1+Aβ)). Eingänge mit L_in, R_in, C_in, Ausgang mit R_out, L_out, C_out.', '实际：有限增益 A₀，在极点 ω_p 以上按 20 dB/十倍频下降，在 GBW 处为 1，因此闭环增益在高频下降（H = A/(1+Aβ)）。输入有 L_in、R_in、C_in，输出有 R_out、L_out、C_out。'],
f_help:["Guide","Uputstvo","Guía","Guide","Anleitung","使用说明"],
inf_oa_gbw:["GBW (gain–bandwidth product) is the frequency at which the open-loop gain of the op-amp has fallen to 1 (0 dB). Above the pole f<sub>p</sub> the gain falls 20 dB per decade, so gain × frequency stays constant and equals GBW. It tells how fast the op-amp is: a stage with closed-loop gain G (for the inverting amplifier use 1 + R₂/R₁) has a bandwidth of about GBW/G. Example: GBW = 1 MHz and G = 10 give about 100 kHz. GBW and A₀ are set on each op-amp and matter only in real mode; the ideal op-amp has infinite GBW.","GBW (proizvod pojačanja i propusnog opsega) je frekvencija na kojoj pojačanje op-pojačavača bez povratne sprege padne na 1 (0 dB). Iznad pola f<sub>p</sub> pojačanje pada 20 dB po dekadi, pa je proizvod pojačanje × frekvencija stalan i jednak GBW. Govori koliko je pojačavač brz: stepen sa pojačanjem G u zatvorenoj petlji (za invertujući uzmi 1 + R₂/R₁) ima propusni opseg oko GBW/G. Primer: GBW = 1 MHz i G = 10 daju oko 100 kHz. GBW i A₀ se podešavaju na svakom op-pojačavaču i važe samo u realnom modu; idealan op-pojačavač ima beskonačan GBW.","GBW (producto ganancia–ancho de banda) es la frecuencia a la que la ganancia en lazo abierto del amplificador operacional cae a 1 (0 dB). Por encima del polo f<sub>p</sub> la ganancia cae 20 dB por década, así que ganancia × frecuencia se mantiene constante e igual a GBW. Indica lo rápido que es el amplificador: una etapa con ganancia en lazo cerrado G (en el inversor usa 1 + R₂/R₁) tiene un ancho de banda de unos GBW/G. Ejemplo: GBW = 1 MHz y G = 10 dan unos 100 kHz. GBW y A₀ se ajustan en cada amplificador y solo cuentan en el modo real; el amplificador ideal tiene GBW infinito.","Le GBW (produit gain–bande passante) est la fréquence à laquelle le gain en boucle ouverte de l’ampli-op tombe à 1 (0 dB). Au-dessus du pôle f<sub>p</sub>, le gain baisse de 20 dB par décade : le produit gain × fréquence reste constant et vaut GBW. Il indique la rapidité de l’ampli : un étage de gain en boucle fermée G (pour l’inverseur, prendre 1 + R₂/R₁) a une bande passante d’environ GBW/G. Exemple : GBW = 1 MHz et G = 10 donnent environ 100 kHz. GBW et A₀ se règlent sur chaque ampli-op et ne comptent qu’en mode réel ; l’ampli-op idéal a un GBW infini.","GBW (Verstärkungs-Bandbreite-Produkt) ist die Frequenz, bei der die Leerlaufverstärkung des OPV auf 1 (0 dB) gefallen ist. Oberhalb des Pols f<sub>p</sub> fällt die Verstärkung mit 20 dB pro Dekade, daher bleibt Verstärkung × Frequenz konstant und gleich GBW. Es zeigt, wie schnell der OPV ist: Eine Stufe mit Verstärkung G im geschlossenen Kreis (beim invertierenden Verstärker 1 + R₂/R₁ nehmen) hat etwa die Bandbreite GBW/G. Beispiel: GBW = 1 MHz und G = 10 ergeben etwa 100 kHz. GBW und A₀ werden an jedem OPV eingestellt und gelten nur im Real-Modus; der ideale OPV hat ein unendliches GBW.","GBW（增益带宽积）是运放开环增益下降到 1（0 dB）时的频率。在极点 f<sub>p</sub> 以上，增益每十倍频下降 20 dB，所以增益 × 频率保持不变，等于 GBW。它表示运放有多快：闭环增益为 G 的电路（反相放大器取 1 + R₂/R₁）带宽约为 GBW/G。例如 GBW = 1 MHz、G = 10 时约为 100 kHz。GBW 和 A₀ 在每个运放上设置，只在实际模式下起作用；理想运放的 GBW 为无穷大。"],
g_title:["How to use Heaviside","Uputstvo za Heaviside","Cómo usar Heaviside","Utiliser Heaviside","So benutzt du Heaviside","Heaviside 使用说明"],
g_intro:["Heaviside computes the frequency response of circuits made of R, L, C, potentiometers and op-amps. Draw the circuit in the lower part of the screen; the graphs at the top update immediately.","Heaviside računa frekventni odziv kola sa R, L, C, potenciometrima i op-pojačavačima. Kolo crtaš u donjem delu ekrana, a grafici gore se odmah osvežavaju.","Heaviside calcula la respuesta en frecuencia de circuitos con R, L, C, potenciómetros y amplificadores operacionales. Dibuja el circuito en la parte inferior de la pantalla; los gráficos de arriba se actualizan al instante.","Heaviside calcule la réponse en fréquence de circuits faits de R, L, C, potentiomètres et amplis-op. Dessinez le circuit en bas de l’écran ; les graphiques du haut se mettent à jour immédiatement.","Heaviside berechnet den Frequenzgang von Schaltungen aus R, L, C, Potentiometern und OPVs. Zeichne die Schaltung im unteren Bildschirmteil; die Diagramme oben werden sofort aktualisiert.","Heaviside 计算由 R、L、C、电位器和运放组成的电路的频率响应。在屏幕下半部分画电路，上方的图表会立即更新。"],
g_s_graph:["Graphs (top)","Grafici (gore)","Gráficos (arriba)","Graphiques (en haut)","Diagramme (oben)","图表（上方）"],
g_tabs:["<b>Bode</b>: magnitude (dB) and phase of H = Vout/Vin. <b>Ω</b>: input impedance |Zin| and its phase. <b>Nyquist</b>: H (or Z) in the complex plane. <b>Spectrum</b>: what a square, triangle, sawtooth, pulse or sine wave looks like after the circuit. <b>Smith</b>: Zin on the Smith chart for the chosen Z₀.","<b>Bode</b>: amplituda (dB) i faza za H = Vout/Vin. <b>Ω</b>: ulazna impedansa |Zin| i njena faza. <b>Nyquist</b>: H (ili Z) u kompleksnoj ravni. <b>Spektar</b>: kako izgleda kvadratni, trougaoni, testerasti, impulsni ili sinusni signal posle kola. <b>Smith</b>: Zin na Smithovom dijagramu za izabrano Z₀.","<b>Bode</b>: módulo (dB) y fase de H = Vout/Vin. <b>Ω</b>: impedancia de entrada |Zin| y su fase. <b>Nyquist</b>: H (o Z) en el plano complejo. <b>Espectro</b>: cómo queda una onda cuadrada, triangular, diente de sierra, de pulsos o senoidal tras el circuito. <b>Smith</b>: Zin en la carta de Smith para el Z₀ elegido.","<b>Bode</b> : module (dB) et phase de H = Vout/Vin. <b>Ω</b> : impédance d’entrée |Zin| et sa phase. <b>Nyquist</b> : H (ou Z) dans le plan complexe. <b>Spectre</b> : l’allure d’un signal carré, triangulaire, en dents de scie, impulsionnel ou sinusoïdal après le circuit. <b>Smith</b> : Zin sur l’abaque de Smith pour le Z₀ choisi.","<b>Bode</b>: Betrag (dB) und Phase von H = Vout/Vin. <b>Ω</b>: Eingangsimpedanz |Zin| und ihre Phase. <b>Nyquist</b>: H (oder Z) in der komplexen Ebene. <b>Spektrum</b>: wie ein Rechteck-, Dreieck-, Sägezahn-, Puls- oder Sinussignal nach der Schaltung aussieht. <b>Smith</b>: Zin im Smith-Diagramm für das gewählte Z₀.","<b>Bode</b>：H = Vout/Vin 的幅度（dB）和相位。<b>Ω</b>：输入阻抗 |Zin| 及其相位。<b>Nyquist</b>：H（或 Z）在复平面上的曲线。<b>频谱</b>：方波、三角波、锯齿波、脉冲或正弦波经过电路后的样子。<b>Smith</b>：在所选 Z₀ 下 Zin 在史密斯圆图上的位置。"],
g_time:["<b>Time</b>: step response (output after Vin jumps to 1 V) and impulse response, with τ, rise time, overshoot and settling time. Pinch to stretch the time axis.","<b>Vreme</b>: odziv na skok (izlaz kad Vin skoči na 1 V) i odziv na impuls, sa τ, vremenom uspona, prebačajem i vremenom smirivanja. Sa dva prsta razvlačiš vremensku osu.","<b>Tiempo</b>: respuesta al escalón (salida cuando Vin salta a 1 V) y al impulso, con τ, tiempo de subida, sobreoscilación y tiempo de establecimiento. Pellizca para estirar el eje de tiempo.","<b>Temps</b> : réponse indicielle (sortie quand Vin passe à 1 V) et impulsionnelle, avec τ, temps de montée, dépassement et temps de réponse. Pincez pour étirer l’axe du temps.","<b>Zeit</b>: Sprungantwort (Ausgang, wenn Vin auf 1 V springt) und Impulsantwort, mit τ, Anstiegszeit, Überschwingen und Einschwingzeit. Mit zwei Fingern die Zeitachse dehnen.","<b>时域</b>：阶跃响应（Vin 跳到 1 V 时的输出）和冲激响应，显示 τ、上升时间、超调和调节时间。双指缩放时间轴。"],
g_pz:["<b>Poles</b>: poles ✕ and zeros ○ of H(s) (or Z(s)) in the s-plane. Poles in the right half-plane mean an unstable circuit; a pole close to the jω axis gives a high, narrow peak. Tap one to see its frequency, ζ and Q.","<b>Polovi</b>: polovi ✕ i nule ○ funkcije H(s) (ili Z(s)) u s-ravni. Pol u desnoj poluravni znači nestabilno kolo; pol blizu jω ose daje visok i uzak pik. Dodirni ga da vidiš frekvenciju, ζ i Q.","<b>Polos</b>: polos ✕ y ceros ○ de H(s) (o Z(s)) en el plano s. Un polo en el semiplano derecho significa un circuito inestable; un polo cerca del eje jω da un pico alto y estrecho. Tócalo para ver su frecuencia, ζ y Q.","<b>Pôles</b> : pôles ✕ et zéros ○ de H(s) (ou Z(s)) dans le plan s. Un pôle dans le demi-plan droit signifie un circuit instable ; un pôle proche de l’axe jω donne un pic haut et étroit. Touchez-le pour voir sa fréquence, ζ et Q.","<b>Pole</b>: Pole ✕ und Nullstellen ○ von H(s) (oder Z(s)) in der s-Ebene. Ein Pol in der rechten Halbebene bedeutet eine instabile Schaltung; ein Pol nahe der jω-Achse ergibt eine hohe, schmale Spitze. Antippen zeigt Frequenz, ζ und Q.","<b>零极点</b>：H(s)（或 Z(s)）在 s 平面上的极点 ✕ 和零点 ○。右半平面的极点表示电路不稳定；靠近 jω 轴的极点会产生又高又窄的峰。点一下可查看其频率、ζ 和 Q。"],
g_std:["<b>Standard values</b> (E24): every R, L, C is rounded to the nearest value you can buy (E6, E12, E24 or E96 — tap the E24 label to change). The dashed curve is the exact design, and the chips show how far each point moved.","<b>Standardne vrednosti</b> (E24): svaki R, L, C se zaokruži na najbližu vrednost koja se može kupiti (E6, E12, E24 ili E96 — dodirni oznaku E24 da promeniš). Isprekidana kriva je tačan proračun, a oznake pokazuju koliko se svaka tačka pomerila.","<b>Valores normalizados</b> (E24): cada R, L, C se redondea al valor comercial más cercano (E6, E12, E24 o E96; toca la etiqueta E24 para cambiar). La curva a trazos es el diseño exacto y las etiquetas muestran cuánto se movió cada punto.","<b>Valeurs normalisées</b> (E24) : chaque R, L, C est arrondi à la valeur du commerce la plus proche (E6, E12, E24 ou E96 ; touchez l’étiquette E24 pour changer). La courbe en pointillés est le calcul exact et les étiquettes montrent le décalage de chaque point.","<b>Normwerte</b> (E24): jedes R, L, C wird auf den nächsten käuflichen Wert gerundet (E6, E12, E24 oder E96 — E24-Anzeige antippen zum Wechseln). Die gestrichelte Kurve ist der exakte Entwurf, die Chips zeigen die Verschiebung jedes Punktes.","<b>标准值</b>（E24）：每个 R、L、C 取最接近的可购买值（E6、E12、E24 或 E96，点 E24 标签切换）。虚线是精确设计，标签显示每个点移动了多少。"],
g_tol:["<b>Tolerances</b> (in Sliders): set ±% for each part; the graphs show a shaded band of 60 random circuits, and the chips show the range of the −3 dB and resonance frequencies.","<b>Tolerancije</b> (u Klizačima): podesi ±% za svaki deo; grafici pokazuju osenčeni pojas za 60 nasumičnih kola, a oznake opseg u kome se nalaze −3 dB i rezonantna frekvencija.","<b>Tolerancias</b> (en Deslizadores): fija ±% para cada pieza; los gráficos muestran una banda sombreada de 60 circuitos aleatorios y las etiquetas el rango de las frecuencias de −3 dB y de resonancia.","<b>Tolérances</b> (dans Curseurs) : réglez ±% pour chaque composant ; les graphiques montrent une bande ombrée de 60 circuits aléatoires et les étiquettes la plage des fréquences à −3 dB et de résonance.","<b>Toleranzen</b> (in Regler): ±% für jedes Bauteil einstellen; die Diagramme zeigen ein schattiertes Band aus 60 Zufallsschaltungen, die Chips den Bereich der −3-dB- und Resonanzfrequenzen.","<b>公差</b>（在滑块中）：为每个元件设置 ±%；图表显示 60 个随机电路形成的阴影带，标签显示 −3 dB 和谐振频率的范围。"],
g_cursor:["Touch or drag on a graph to move the cursor; the values at that frequency are shown above the graph.","Dodirni ili prevuci prstom po grafiku da pomeriš kursor; vrednosti na toj frekvenciji pišu iznad grafika.","Toca o arrastra sobre un gráfico para mover el cursor; los valores a esa frecuencia aparecen encima del gráfico.","Touchez ou glissez sur un graphique pour déplacer le curseur ; les valeurs à cette fréquence s’affichent au-dessus.","Tippe oder ziehe auf einem Diagramm, um den Cursor zu bewegen; die Werte bei dieser Frequenz stehen über dem Diagramm.","在图表上点按或拖动可移动光标；该频率下的数值显示在图表上方。"],
g_zoomF:["<b>Bode</b> and <b>Ω</b>: pinch with two fingers (or use the mouse wheel) to zoom the frequency range.","<b>Bode</b> i <b>Ω</b>: raširi ili skupi dva prsta (ili točkić miša) da zumiraš opseg frekvencija.","<b>Bode</b> y <b>Ω</b>: pellizca con dos dedos (o usa la rueda del ratón) para ampliar el rango de frecuencias.","<b>Bode</b> et <b>Ω</b> : pincez à deux doigts (ou utilisez la molette) pour zoomer sur la plage de fréquences.","<b>Bode</b> und <b>Ω</b>: mit zwei Fingern spreizen oder zusammenziehen (oder Mausrad), um den Frequenzbereich zu zoomen.","<b>Bode</b> 和 <b>Ω</b>：双指缩放（或鼠标滚轮）可缩放频率范围。"],
g_zoomS:["<b>Nyquist</b> and <b>Smith</b>: pinch or tap + / − to zoom, ⟲ or a double tap resets the view; when zoomed in, drag beside the curve to move around.","<b>Nyquist</b> i <b>Smith</b>: zumiraj prstima ili dugmićima + / −, a ⟲ ili dupli dodir vraća prikaz; kad je uvećano, prevlačenjem pored krive pomeraš prikaz.","<b>Nyquist</b> y <b>Smith</b>: pellizca o toca + / − para hacer zoom; ⟲ o un doble toque restablece la vista; con zoom, arrastra junto a la curva para desplazarte.","<b>Nyquist</b> et <b>Smith</b> : pincez ou touchez + / − pour zoomer ; ⟲ ou un double appui réinitialise la vue ; une fois zoomé, glissez à côté de la courbe pour vous déplacer.","<b>Nyquist</b> und <b>Smith</b>: mit zwei Fingern oder + / − zoomen; ⟲ oder doppeltes Tippen setzt die Ansicht zurück; vergrößert verschiebst du die Ansicht durch Ziehen neben der Kurve.","<b>Nyquist</b> 和 <b>Smith</b>：双指缩放或点 + / − 缩放，⟲ 或双击恢复视图；放大后在曲线旁拖动可移动视图。"],
g_chips:["The chips under the graph mark important points: −3 dB cutoff, resonance, maximum, minimum. Tap one to put the cursor there.","Oznake ispod grafika pokazuju važne tačke: granicu −3 dB, rezonanciju, maksimum, minimum. Dodirni oznaku i kursor skače na tu tačku.","Las etiquetas bajo el gráfico marcan puntos importantes: corte a −3 dB, resonancia, máximo, mínimo. Toca una para llevar el cursor allí.","Les étiquettes sous le graphique marquent les points importants : coupure à −3 dB, résonance, maximum, minimum. Touchez-en une pour y placer le curseur.","Die Chips unter dem Diagramm markieren wichtige Punkte: −3-dB-Grenze, Resonanz, Maximum, Minimum. Tippe darauf, um den Cursor dorthin zu setzen.","图表下方的标签标出重要的点：−3 dB 截止、谐振、最大值、最小值。点一下即可把光标移到该处。"],
g_lang:["Choose the language.","Izbor jezika.","Elegir el idioma.","Choisir la langue.","Sprache wählen.","选择语言。"],
g_range:["Frequency range: type “from” and “to” and choose the unit (mHz … THz), or press Auto.","Opseg frekvencija: upiši „od” i „do” i izaberi jedinicu (mHz … THz), ili pritisni Auto.","Rango de frecuencias: escribe “desde” y “hasta” y elige la unidad (mHz … THz), o pulsa Auto.","Plage de fréquences : saisissez « de » et « à » et choisissez l’unité (mHz … THz), ou appuyez sur Auto.","Frequenzbereich: „von“ und „bis“ eingeben und die Einheit wählen (mHz … THz), oder Auto drücken.","频率范围：输入“从”和“到”并选择单位（mHz … THz），或按“自动”。"],
g_max:["Enlarge the graph to the whole screen; tap again to go back.","Uvećava grafik preko celog ekrana; ponovni dodir vraća nazad.","Amplía el gráfico a toda la pantalla; tócalo otra vez para volver.","Agrandit le graphique en plein écran ; touchez de nouveau pour revenir.","Vergrößert das Diagramm auf den ganzen Bildschirm; erneut tippen, um zurückzukehren.","将图表放大到全屏；再点一次返回。"],
g_hide:["Hide the graphs to get more room for the schematic; tap again to show them.","Sakriva grafike da bude više mesta za šemu; ponovni dodir ih vraća.","Oculta los gráficos para tener más sitio para el esquema; tócalo otra vez para mostrarlos.","Masque les graphiques pour laisser plus de place au schéma ; touchez de nouveau pour les afficher.","Blendet die Diagramme aus, damit mehr Platz für den Schaltplan bleibt; erneut tippen zeigt sie wieder.","隐藏图表，给电路图留出更多空间；再点一次重新显示。"],
g_cinfo:["The ⓘ buttons (next to Input, f₀ and Z₀, and on every element in the drawer) explain that setting or element, with schematics and formulas.","Dugmad ⓘ (pored Input, f₀ i Z₀, i na svakom elementu u meniju) objašnjavaju to podešavanje ili element, sa šemom i formulama.","Los botones ⓘ (junto a Entrada, f₀ y Z₀, y en cada elemento del menú) explican ese ajuste o elemento, con esquemas y fórmulas.","Les boutons ⓘ (à côté d’Entrée, f₀ et Z₀, et sur chaque élément du menu) expliquent ce réglage ou cet élément, avec schémas et formules.","Die ⓘ-Knöpfe (neben Eingang, f₀ und Z₀ sowie an jedem Bauteil im Menü) erklären diese Einstellung oder dieses Bauteil, mit Schaltbild und Formeln.","ⓘ 按钮（在输入、f₀、Z₀ 旁边，以及菜单中每个元件上）会用电路图和公式解释该设置或元件。"],
g_s_sch:["Schematic (bottom)","Šema (dole)","Esquema (abajo)","Schéma (en bas)","Schaltplan (unten)","电路图（下方）"],
g_wire:["<b>Wires</b>: tap the end of an element (it turns blue), tap grey grid dots to lead the wire, and finish on the end of another element. Wires connect only at their ends: a white dot marks a junction, wires that just cross are not connected.","<b>Žice</b>: dodirni kraj elementa (postane plav), zatim sive tačke mreže kuda žica ide, i završi na kraju drugog elementa. Žice se spajaju samo krajevima: bela tačka je spoj, a žice koje se samo seku nisu spojene.","<b>Cables</b>: toca el extremo de un elemento (se vuelve azul), toca puntos grises de la rejilla para guiar el cable y termina en el extremo de otro elemento. Los cables solo se unen por sus extremos: un punto blanco marca una unión; los que solo se cruzan no están conectados.","<b>Fils</b> : touchez l’extrémité d’un élément (elle devient bleue), touchez les points gris de la grille pour guider le fil et terminez sur l’extrémité d’un autre élément. Les fils ne se relient que par leurs extrémités : un point blanc marque une jonction, des fils qui se croisent ne sont pas reliés.","<b>Leitungen</b>: Tippe auf das Ende eines Bauteils (es wird blau), dann auf graue Rasterpunkte für den Verlauf, und beende am Ende eines anderen Bauteils. Leitungen verbinden sich nur an ihren Enden: Ein weißer Punkt ist ein Knoten, sich nur kreuzende Leitungen sind nicht verbunden.","<b>导线</b>：点元件的一端（变成蓝色），再点灰色网格点引导导线，最后点另一个元件的一端结束。导线只在端点处连接：白点表示连接点，仅仅交叉的导线不相连。"],
g_move:["<b>Move</b>: hold an element or wire for 0.4 s until the phone vibrates, then drag it. Moving the finger sooner pans the view; pinch to zoom the schematic.","<b>Pomeranje</b>: drži element ili žicu 0,4 s dok telefon ne zavibrira, pa prevuci. Ako pomeriš prst ranije, pomeraš prikaz; sa dva prsta zumiraš šemu.","<b>Mover</b>: mantén pulsado un elemento o cable 0,4 s hasta que el teléfono vibre y luego arrástralo. Si mueves el dedo antes, desplazas la vista; pellizca para ampliar el esquema.","<b>Déplacer</b> : maintenez un élément ou un fil 0,4 s jusqu’à la vibration, puis faites-le glisser. Bouger le doigt plus tôt déplace la vue ; pincez pour zoomer sur le schéma.","<b>Verschieben</b>: Halte ein Bauteil oder eine Leitung 0,4 s, bis das Handy vibriert, dann ziehen. Bewegst du den Finger früher, verschiebst du die Ansicht; mit zwei Fingern zoomst du den Schaltplan.","<b>移动</b>：按住元件或导线 0.4 秒，手机振动后拖动。提前移动手指则是平移视图；双指缩放电路图。"],
g_select:["<b>Select</b>: tap an element. Its value appears at the bottom (type it or use the slider), and in real mode also its parasitic parts and an ideal/real switch. Delete and Rotate appear on the right.","<b>Izbor</b>: dodirni element. Dole se pojavi njegova vrednost (upiši je ili pomeri klizač), a u realnom modu i parazitni delovi i prekidač idealno/realno. Desno se pojave Obriši i Okreni.","<b>Seleccionar</b>: toca un elemento. Abajo aparece su valor (escríbelo o usa el deslizador) y, en modo real, sus partes parásitas y un interruptor ideal/real. A la derecha aparecen Eliminar y Girar.","<b>Sélectionner</b> : touchez un élément. Sa valeur apparaît en bas (saisissez-la ou utilisez le curseur), et en mode réel aussi ses éléments parasites et un choix idéal/réel. Supprimer et Pivoter apparaissent à droite.","<b>Auswählen</b>: Tippe auf ein Bauteil. Unten erscheint sein Wert (eintippen oder Regler), im Real-Modus auch seine parasitären Anteile und ein Schalter ideal/real. Rechts erscheinen Löschen und Drehen.","<b>选择</b>：点一个元件。下方显示它的数值（可输入或用滑块），在实际模式下还有寄生参数和理想/实际开关。右侧出现删除和旋转。"],
g_status:["The label at the top left of the schematic shows what is computed: H = Vout/Vin when there is a Vout, otherwise the impedance between Vin and GND.","Oznaka gore levo na šemi pokazuje šta se računa: H = Vout/Vin kad postoji Vout, a inače impedansa između Vin i GND.","La etiqueta arriba a la izquierda del esquema indica qué se calcula: H = Vout/Vin si hay un Vout; si no, la impedancia entre Vin y GND.","L’étiquette en haut à gauche du schéma indique ce qui est calculé : H = Vout/Vin s’il y a un Vout, sinon l’impédance entre Vin et GND.","Die Anzeige oben links im Schaltplan zeigt, was berechnet wird: H = Vout/Vin, wenn es ein Vout gibt, sonst die Impedanz zwischen Vin und GND.","电路图左上角的标签说明计算的内容：有 Vout 时为 H = Vout/Vin，否则为 Vin 与 GND 之间的阻抗。"],
g_s_left:["Buttons on the left","Dugmad levo","Botones de la izquierda","Boutons à gauche","Knöpfe links","左侧按钮"],
g_fx:["<b>Formulas</b>: step-by-step derivation of H(s) and Zin (nodal equations, simplification, zeros and resonances), with PDF export.","<b>Formule</b>: izvođenje H(s) i Zin korak po korak (jednačine čvorova, sređivanje, nule i rezonancije), sa izvozom u PDF.","<b>Fórmulas</b>: deducción paso a paso de H(s) y Zin (ecuaciones de nodos, simplificación, ceros y resonancias), con exportación a PDF.","<b>Formules</b> : dérivation pas à pas de H(s) et Zin (équations aux nœuds, simplification, zéros et résonances), avec export PDF.","<b>Formeln</b>: schrittweise Herleitung von H(s) und Zin (Knotengleichungen, Vereinfachung, Nullstellen und Resonanzen), mit PDF-Export.","<b>公式</b>：逐步推导 H(s) 和 Zin（节点方程、化简、零点和谐振），可导出 PDF。"],
g_ex:["<b>Examples</b>: ready-made circuits — filters, resonant circuits, real components and op-amp circuits.","<b>Primeri</b>: gotova kola — filtri, rezonantna kola, realne komponente i kola sa op-pojačavačima.","<b>Ejemplos</b>: circuitos listos — filtros, circuitos resonantes, componentes reales y circuitos con amplificadores operacionales.","<b>Exemples</b> : circuits tout prêts — filtres, circuits résonants, composants réels et montages à ampli-op.","<b>Beispiele</b>: fertige Schaltungen — Filter, Schwingkreise, reale Bauteile und OPV-Schaltungen.","<b>示例</b>：现成的电路——滤波器、谐振电路、实际元件和运放电路。"],
g_sl:["<b>Sliders</b>: the values of all elements in one list, so you can change them while watching the graph.","<b>Klizači</b>: vrednosti svih elemenata na jednom mestu, da ih menjaš dok gledaš grafik.","<b>Deslizadores</b>: los valores de todos los elementos en una lista, para cambiarlos mientras miras el gráfico.","<b>Curseurs</b> : les valeurs de tous les éléments dans une liste, pour les modifier en regardant le graphique.","<b>Regler</b>: die Werte aller Bauteile in einer Liste, um sie zu ändern, während du das Diagramm beobachtest.","<b>滑块</b>：所有元件的数值集中在一个列表中，可以一边看图一边调整。"],
g_undo:["<b>Undo</b> the last change.","<b>Poništi</b> poslednju izmenu.","<b>Deshacer</b> el último cambio.","<b>Annuler</b> la dernière modification.","<b>Rückgängig</b>: letzte Änderung zurücknehmen.","<b>撤销</b>上一次修改。"],
g_fit:["<b>Fit</b> the whole schematic on the screen.","<b>Uklopi</b> celu šemu u ekran.","<b>Ajustar</b> todo el esquema a la pantalla.","<b>Ajuster</b> tout le schéma à l’écran.","<b>Einpassen</b>: ganzen Schaltplan auf den Bildschirm bringen.","<b>适应屏幕</b>：把整个电路图显示在屏幕内。"],
g_s_right:["Buttons on the right","Dugmad desno","Botones de la derecha","Boutons à droite","Knöpfe rechts","右侧按钮"],
g_help:["<b>Guide</b>: this page.","<b>Uputstvo</b>: ova stranica.","<b>Guía</b>: esta página.","<b>Guide</b> : cette page.","<b>Anleitung</b>: diese Seite.","<b>使用说明</b>：本页面。"],
g_file:["<b>Save / Open</b>: save the circuit with a name and description on this device, and open or delete saved circuits.","<b>Sačuvaj / Otvori</b>: čuva kolo sa imenom i opisom na ovom uređaju, i otvara ili briše sačuvana kola.","<b>Guardar / Abrir</b>: guarda el circuito con nombre y descripción en este dispositivo, y abre o elimina los guardados.","<b>Enregistrer / Ouvrir</b> : enregistre le circuit avec un nom et une description sur cet appareil, et ouvre ou supprime les circuits enregistrés.","<b>Speichern / Öffnen</b>: speichert die Schaltung mit Name und Beschreibung auf diesem Gerät und öffnet oder löscht gespeicherte Schaltungen.","<b>保存 / 打开</b>：在本设备上以名称和说明保存电路，并打开或删除已保存的电路。"],
g_realm:["<b>Real mode</b>: every element gets its parasitics (ESR and ESL of capacitors, winding resistance and capacitance of inductors, gain A₀ and GBW of op-amps…), so you see how a real circuit behaves. Each element can also be switched to ideal separately.","<b>Realni mod</b>: svaki element dobija parazitne vrednosti (ESR i ESL kondenzatora, otpornost i kapacitivnost namotaja zavojnice, pojačanje A₀ i GBW op-pojačavača…), pa vidiš kako se ponaša pravo kolo. Svaki element može posebno da se vrati na idealan.","<b>Modo real</b>: cada elemento recibe sus parásitos (ESR y ESL de los condensadores, resistencia y capacidad del devanado de las bobinas, ganancia A₀ y GBW de los amplificadores…), para ver cómo se comporta un circuito real. Cada elemento puede ponerse ideal por separado.","<b>Mode réel</b> : chaque élément reçoit ses parasites (ESR et ESL des condensateurs, résistance et capacité de bobinage des inductances, gain A₀ et GBW des amplis-op…), pour voir le comportement d’un vrai circuit. Chaque élément peut aussi être remis en idéal séparément.","<b>Real-Modus</b>: Jedes Bauteil erhält seine parasitären Werte (ESR und ESL bei Kondensatoren, Wicklungswiderstand und -kapazität bei Spulen, Verstärkung A₀ und GBW bei OPVs…), so siehst du, wie sich eine echte Schaltung verhält. Jedes Bauteil kann auch einzeln ideal bleiben.","<b>实际模式</b>：每个元件都加上寄生参数（电容的 ESR 和 ESL、电感的绕组电阻和电容、运放的增益 A₀ 和 GBW……），从而看到真实电路的表现。每个元件也可以单独设为理想。"],
g_add:["<b>Add element</b>: Vin, Vout, ground, resistor, inductor, capacitor, potentiometer, op-amp. Tap one and it is placed on the schematic.","<b>Dodaj element</b>: Vin, Vout, masa, otpornik, zavojnica, kondenzator, potenciometar, op-pojačavač. Dodirni ga i pojavi se na šemi.","<b>Añadir elemento</b>: Vin, Vout, masa, resistencia, bobina, condensador, potenciómetro, amplificador operacional. Tócalo y se coloca en el esquema.","<b>Ajouter un élément</b> : Vin, Vout, masse, résistance, inductance, condensateur, potentiomètre, ampli-op. Touchez-le et il est placé sur le schéma.","<b>Element hinzufügen</b>: Vin, Vout, Masse, Widerstand, Spule, Kondensator, Potentiometer, OPV. Antippen, und es wird in den Schaltplan gesetzt.","<b>添加元件</b>：Vin、Vout、地、电阻、电感、电容、电位器、运放。点一下即放到电路图上。"],
g_del:["<b>Delete</b> the selected element or wire (shown only when something is selected).","<b>Obriši</b> izabrani element ili žicu (vidi se samo kad je nešto izabrano).","<b>Eliminar</b> el elemento o cable seleccionado (solo aparece si hay algo seleccionado).","<b>Supprimer</b> l’élément ou le fil sélectionné (visible seulement quand quelque chose est sélectionné).","<b>Löschen</b>: ausgewähltes Bauteil oder Leitung entfernen (nur sichtbar, wenn etwas ausgewählt ist).","<b>删除</b>所选元件或导线（仅在选中时显示）。"],
g_rot:["<b>Rotate</b> the selected element.","<b>Okreni</b> izabrani element.","<b>Girar</b> el elemento seleccionado.","<b>Pivoter</b> l’élément sélectionné.","<b>Drehen</b>: ausgewähltes Bauteil drehen.","<b>旋转</b>所选元件。"],
g_hold:["Hold a finger still on an empty spot for 1 s to see the names of all buttons.","Drži prst mirno 1 s na praznom mestu i pojaviće se nazivi svih dugmadi.","Mantén el dedo quieto 1 s en un sitio vacío para ver los nombres de todos los botones.","Gardez le doigt immobile 1 s sur un endroit vide pour voir le nom de tous les boutons.","Halte einen Finger 1 s still auf eine leere Stelle, um die Namen aller Knöpfe zu sehen.","在空白处按住手指 1 秒不动，即可看到所有按钮的名称。"],
ex_tnotch2_d:['Same idea, but a second follower U2 isolates the divider R4–R5 (k = 0.9) from the legs, so the formulas hold exactly: notch at 1.59 kHz, Q = 1/(4(1−k)) = 2.5 (the passive twin-T has Q = 0.25).', 'Ista ideja, ali drugi sledbenik U2 odvaja razdelnik R4–R5 (k = 0,9) od krakova, pa formule važe tačno: zarez na 1,59 kHz, Q = 1/(4(1−k)) = 2,5 (pasivni dvostruko-T ima Q = 0,25).', 'La misma idea, pero un segundo seguidor U2 aísla el divisor R4–R5 (k = 0,9) de las ramas y las fórmulas se cumplen exactamente: muesca en 1,59 kHz, Q = 1/(4(1−k)) = 2,5 (el doble T pasivo tiene Q = 0,25).', 'Même idée, mais un second suiveur U2 isole le diviseur R4–R5 (k = 0,9) des branches : les formules sont exactes, encoche à 1,59 kHz, Q = 1/(4(1−k)) = 2,5 (le double T passif a Q = 0,25).', 'Gleiche Idee, aber ein zweiter Folger U2 trennt den Teiler R4–R5 (k = 0,9) von den Zweigen, die Formeln gelten exakt: Kerbe bei 1,59 kHz, Q = 1/(4(1−k)) = 2,5 (das passive Doppel-T hat Q = 0,25).', '思路相同，但第二个跟随器 U2 把分压器 R4–R5（k = 0.9）与支路隔离，公式严格成立：陷波在 1.59 kHz，Q = 1/(4(1−k)) = 2.5（无源双 T 的 Q = 0.25）。'],
ex_tnotch2_n:['Twin-T notch with adjustable Q (2 op-amps)', 'Dvostruko-T notch sa podesivim Q (2 op. pojačavača)', 'Notch doble T con Q ajustable (2 amp. op.)', 'Réjecteur double T à Q réglable (2 ampli-op)', 'Doppel-T-Kerbfilter mit einstellbarem Q (2 OPV)', 'Q 可调的双 T 陷波（2 个运放）'],
ex_tnotch1_d:['A follower buffers the twin-T and drives its legs (2C, R/2) from the divider R4–R5 with k = 0.9 instead of ground: Q = 1/(4(1−k)) ≈ 2.5. The divider also loads the legs, so the notch moves a little (1.56 kHz instead of 1.59 kHz).', 'Sledbenik baferuje dvostruko-T i njegove krake (2C, R/2) napaja sa razdelnika R4–R5, k = 0,9, umesto sa mase: Q = 1/(4(1−k)) ≈ 2,5. Razdelnik i opterećuje krake, pa se zarez malo pomeri (1,56 kHz umesto 1,59 kHz).', 'Un seguidor separa el doble T y alimenta sus ramas (2C, R/2) desde el divisor R4–R5 con k = 0,9 en lugar de masa: Q = 1/(4(1−k)) ≈ 2,5. El divisor también carga las ramas y la muesca se desplaza un poco (1,56 kHz en vez de 1,59 kHz).', 'Un suiveur isole le double T et alimente ses branches (2C, R/2) depuis le diviseur R4–R5, k = 0,9, au lieu de la masse : Q = 1/(4(1−k)) ≈ 2,5. Le diviseur charge aussi les branches, l’encoche se décale un peu (1,56 kHz au lieu de 1,59 kHz).', 'Ein Folger puffert das Doppel-T und speist dessen Querzweige (2C, R/2) aus dem Teiler R4–R5 mit k = 0,9 statt aus Masse: Q = 1/(4(1−k)) ≈ 2,5. Der Teiler belastet die Zweige, die Kerbe verschiebt sich etwas (1,56 kHz statt 1,59 kHz).', '跟随器缓冲双 T 网络，并由分压器 R4–R5（k = 0.9）而不是地来驱动其支路（2C、R/2）：Q = 1/(4(1−k)) ≈ 2.5。分压器也加载了支路，陷波点略有偏移（1.56 kHz 而非 1.59 kHz）。'],
ex_tnotch1_n:['Twin-T notch with adjustable Q (1 op-amp)', 'Dvostruko-T notch sa podesivim Q (1 op. pojačavač)', 'Notch doble T con Q ajustable (1 amp. op.)', 'Réjecteur double T à Q réglable (1 ampli-op)', 'Doppel-T-Kerbfilter mit einstellbarem Q (1 OPV)', 'Q 可调的双 T 陷波（1 个运放）'],
ex_hp4_d:['Two unity-gain Sallen-Key stages with 27 nF capacitors (values from the forum schematic; the 4.5 V reference is AC ground). With the output coupling C5–R5 the slope is 5th order: −100 dB/dec.', 'Dva Sallen-Key stepena jediničnog pojačanja sa kondenzatorima od 27 nF (vrednosti sa šeme sa foruma; referenca 4,5 V je AC masa). Sa izlaznim C5–R5 nagib je 5. reda: −100 dB/dek.', 'Dos etapas Sallen-Key de ganancia unidad con condensadores de 27 nF (valores del esquema del foro; la referencia de 4,5 V es masa de AC). Con el acoplo de salida C5–R5 la pendiente es de 5.º orden: −100 dB/déc.', 'Deux étages Sallen-Key à gain unité avec des condensateurs de 27 nF (valeurs du schéma du forum ; la référence 4,5 V est une masse alternative). Avec la liaison de sortie C5–R5 la pente est d’ordre 5 : −100 dB/déc.', 'Zwei Sallen-Key-Stufen mit Verstärkung 1 und 27-nF-Kondensatoren (Werte aus dem Forumsschaltbild; die 4,5-V-Referenz ist AC-Masse). Mit der Ausgangskopplung C5–R5 ist die Flanke 5. Ordnung: −100 dB/Dek.', '两级单位增益 Sallen-Key，电容均为 27 nF（数值取自论坛原理图；4.5 V 参考对交流相当于地）。加上输出耦合 C5–R5 后斜率为五阶：−100 dB/十倍频。'],
ex_hp4_n:['Audio high-pass, 4th order (2× Sallen-Key)', 'Audio visokopropusni 4. reda (2× Sallen-Key)', 'Paso alto de audio de 4.º orden (2× Sallen-Key)', 'Passe-haut audio 4e ordre (2× Sallen-Key)', 'Audio-Hochpass 4. Ordnung (2× Sallen-Key)', '音频四阶高通（2 级 Sallen-Key）'],
ex_skhp_d:['C and R swapped compared with the low-pass. Equal C1 = C2 and R1 (to ground) = 2·R2 (feedback) give Butterworth, Q = 0.707, f₀ = 1.13 kHz, +40 dB/dec.', 'C i R zamenjeni u odnosu na niskopropusni. Jednaki C1 = C2 i R1 (ka masi) = 2·R2 (povratna sprega) daju Batervort, Q = 0,707, f₀ = 1,13 kHz, +40 dB/dek.', 'C y R intercambiados respecto al paso bajo. C1 = C2 y R1 (a masa) = 2·R2 (realimentación) dan Butterworth, Q = 0,707, f₀ = 1,13 kHz, +40 dB/déc.', 'C et R échangés par rapport au passe-bas. C1 = C2 et R1 (vers la masse) = 2·R2 (contre-réaction) donnent Butterworth, Q = 0,707, f₀ = 1,13 kHz, +40 dB/déc.', 'C und R gegenüber dem Tiefpass vertauscht. C1 = C2 und R1 (nach Masse) = 2·R2 (Rückführung) ergeben Butterworth, Q = 0,707, f₀ = 1,13 kHz, +40 dB/Dek.', '与低通相比 C、R 互换。C1 = C2 且 R1（接地）= 2·R2（反馈）得到巴特沃斯，Q = 0.707，f₀ = 1.13 kHz，+40 dB/十倍频。'],
ex_skhp_n:['Sallen-Key high-pass (2nd order)', 'Sallen-Key visokopropusni (2. reda)', 'Paso alto Sallen-Key (2.º orden)', 'Passe-haut Sallen-Key (2e ordre)', 'Sallen-Key-Hochpass (2. Ordnung)', 'Sallen-Key 高通（二阶）'],
g_oaBasic:['Op-amp: basic circuits', 'Op. pojačavač: osnovna kola', 'Amp. operacional: circuitos básicos', 'Ampli-op : circuits de base', 'OPV: Grundschaltungen', '运放：基本电路'],
