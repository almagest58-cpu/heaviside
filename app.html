ex_follower_n:['Voltage follower (buffer)', 'Naponski sledbenik (bafer)', 'Seguidor de tensión (búfer)', 'Suiveur de tension (tampon)', 'Spannungsfolger (Puffer)', '电压跟随器（缓冲器）'],
ex_follower_d:['H = 1 and Z_in = ∞: it copies the voltage without loading the source and drives R1. Real mode: the gain falls near GBW.', 'H = 1 i Z_in = ∞: kopira napon bez opterećenja izvora i pokreće R1. Realni režim: pojačanje opada oko GBW.', 'H = 1 y Z_in = ∞: copia la tensión sin cargar la fuente y alimenta R1. Modo real: la ganancia cae hacia GBW.', 'H = 1 et Z_in = ∞ : il recopie la tension sans charger la source et attaque R1. Mode réel : le gain chute vers GBW.', 'H = 1 und Z_in = ∞: kopiert die Spannung, ohne die Quelle zu belasten, und treibt R1. Realmodus: Abfall bei GBW.', 'H = 1，Z_in = ∞：复制电压而不加载信号源，并驱动 R1。实际模式下增益在 GBW 附近下降。'],
ex_summing_n:['Summing amplifier', 'Sumirajući pojačavač', 'Amplificador sumador', 'Amplificateur sommateur', 'Summierverstärker', '加法放大器'],
ex_summing_d:['Vout = −R3·(V1/R1 + V2/R2). Here both inputs come from Vin, so H = −(1 + 0.5) = −1.5.', 'Vout = −R3·(V1/R1 + V2/R2). Ovde oba ulaza dolaze sa Vin, pa je H = −(1 + 0,5) = −1,5.', 'Vout = −R3·(V1/R1 + V2/R2). Aquí ambas entradas vienen de Vin, así que H = −(1 + 0,5) = −1,5.', 'Vout = −R3·(V1/R1 + V2/R2). Ici les deux entrées viennent de Vin, donc H = −(1 + 0,5) = −1,5.', 'Vout = −R3·(V1/R1 + V2/R2). Hier kommen beide Eingänge von Vin, also H = −(1 + 0,5) = −1,5.', 'Vout = −R3·(V1/R1 + V2/R2)。这里两个输入都来自 Vin，所以 H = −(1 + 0.5) = −1.5。'],
ex_diffamp_n:['Difference amplifier', 'Diferencijalni pojačavač', 'Amplificador diferencial', 'Amplificateur différentiel', 'Differenzverstärker', '差分放大器'],
ex_diffamp_d:['Vout = (R4/R1)·(V2 − V1) = 10·(V2 − V1). V1 is grounded and V2 = Vin, so H = 10. Wire R1 to Vin too: H → 0 (common mode rejected).', 'Vout = (R4/R1)·(V2 − V1) = 10·(V2 − V1). V1 je na masi, a V2 = Vin, pa je H = 10. Spoji i R1 na Vin: H → 0 (zajednički signal se potiskuje).', 'Vout = (R4/R1)·(V2 − V1) = 10·(V2 − V1). V1 está a masa y V2 = Vin, así que H = 10. Conecta también R1 a Vin: H → 0 (modo común rechazado).', 'Vout = (R4/R1)·(V2 − V1) = 10·(V2 − V1). V1 est à la masse et V2 = Vin, donc H = 10. Relie aussi R1 à Vin : H → 0 (mode commun rejeté).', 'Vout = (R4/R1)·(V2 − V1) = 10·(V2 − V1). V1 liegt an Masse, V2 = Vin, also H = 10. R1 ebenfalls an Vin: H → 0 (Gleichtakt unterdrückt).', 'Vout = (R4/R1)·(V2 − V1) = 10·(V2 − V1)。V1 接地，V2 = Vin，所以 H = 10。把 R1 也接到 Vin：H → 0（共模被抑制）。'],
ex_inamp_n:['Instrumentation amplifier (3 op-amps)', 'Instrumentacioni pojačavač (3 op. pojačavača)', 'Amplificador de instrumentación (3 amp. op.)', 'Amplificateur d’instrumentation (3 ampli-op)', 'Instrumentenverstärker (3 OPV)', '仪表放大器（3 个运放）'],
ex_inamp_d:['Gain 1 + 2·R1/R2 = 10.1 (20.1 dB), set by one resistor R2 (R_g). Both inputs see Z = ∞; here the second input is grounded.', 'Pojačanje 1 + 2·R1/R2 = 10,1 (20,1 dB), podešava ga jedan otpornik R2 (R_g). Oba ulaza imaju Z = ∞; ovde je drugi ulaz na masi.', 'Ganancia 1 + 2·R1/R2 = 10,1 (20,1 dB), fijada por una sola resistencia R2 (R_g). Ambas entradas ven Z = ∞; aquí la segunda está a masa.', 'Gain 1 + 2·R1/R2 = 10,1 (20,1 dB), réglé par une seule résistance R2 (R_g). Les deux entrées voient Z = ∞ ; ici la seconde est à la masse.', 'Verstärkung 1 + 2·R1/R2 = 10,1 (20,1 dB), eingestellt mit einem Widerstand R2 (R_g). Beide Eingänge Z = ∞; der zweite liegt hier an Masse.', '增益 1 + 2·R1/R2 = 10.1（20.1 dB），只由一个电阻 R2（R_g）设定。两个输入端 Z = ∞；这里第二个输入接地。'],
ex_differ_n:['Differentiator', 'Diferencijator', 'Diferenciador', 'Dérivateur', 'Differenzierer', '微分器'],
ex_differ_d:['H = −s·R2·C1: +20 dB/dec, 0 dB at 159 Hz. R1 and C2 stop the rise above ~16 kHz, otherwise the circuit would amplify noise without limit.', 'H = −s·R2·C1: +20 dB/dek, 0 dB na 159 Hz. R1 i C2 zaustavljaju rast iznad ~16 kHz, inače bi kolo neograničeno pojačavalo šum.', 'H = −s·R2·C1: +20 dB/déc, 0 dB a 159 Hz. R1 y C2 detienen la subida por encima de ~16 kHz; si no, amplificaría el ruido sin límite.', 'H = −s·R2·C1 : +20 dB/déc, 0 dB à 159 Hz. R1 et C2 arrêtent la montée au-delà de ~16 kHz, sinon le bruit serait amplifié sans limite.', 'H = −s·R2·C1: +20 dB/Dek, 0 dB bei 159 Hz. R1 und C2 stoppen den Anstieg oberhalb ~16 kHz, sonst würde Rauschen grenzenlos verstärkt.', 'H = −s·R2·C1：+20 dB/十倍频，159 Hz 处为 0 dB。R1 和 C2 在约 16 kHz 以上阻止继续上升，否则噪声会被无限放大。'],
ex_alp_n:['Active low-pass (1st order, gain 2)', 'Aktivni niskopropusni (1. reda, pojačanje 2)', 'Paso bajo activo (1.er orden, ganancia 2)', 'Passe-bas actif (1er ordre, gain 2)', 'Aktiver Tiefpass (1. Ordnung, Verstärkung 2)', '有源低通（一阶，增益 2）'],
ex_alp_d:['R1–C1 sets f_c = 1 kHz, the non-inverting stage adds gain 1 + R3/R2 = 2 (6 dB) and isolates the filter from the load.', 'R1–C1 daje f_c = 1 kHz, neinvertujući stepen dodaje pojačanje 1 + R3/R2 = 2 (6 dB) i odvaja filter od opterećenja.', 'R1–C1 fija f_c = 1 kHz; la etapa no inversora añade ganancia 1 + R3/R2 = 2 (6 dB) y aísla el filtro de la carga.', 'R1–C1 fixe f_c = 1 kHz ; l’étage non inverseur ajoute un gain 1 + R3/R2 = 2 (6 dB) et isole le filtre de la charge.', 'R1–C1 legt f_c = 1 kHz fest, die nichtinvertierende Stufe bringt 1 + R3/R2 = 2 (6 dB) und trennt das Filter von der Last.', 'R1–C1 决定 f_c = 1 kHz，同相级提供增益 1 + R3/R2 = 2（6 dB），并把滤波器与负载隔离。'],
ex_ahp_n:['Active high-pass (1st order, gain 2)', 'Aktivni visokopropusni (1. reda, pojačanje 2)', 'Paso alto activo (1.er orden, ganancia 2)', 'Passe-haut actif (1er ordre, gain 2)', 'Aktiver Hochpass (1. Ordnung, Verstärkung 2)', '有源高通（一阶，增益 2）'],
ex_ahp_d:['C1–R1 sets f_c = 1 kHz, +20 dB/dec below it; above it the gain is 1 + R3/R2 = 2 (6 dB).', 'C1–R1 daje f_c = 1 kHz, ispod nje +20 dB/dek; iznad nje pojačanje je 1 + R3/R2 = 2 (6 dB).', 'C1–R1 fija f_c = 1 kHz, +20 dB/déc por debajo; por encima la ganancia es 1 + R3/R2 = 2 (6 dB).', 'C1–R1 fixe f_c = 1 kHz, +20 dB/déc en dessous ; au-dessus le gain vaut 1 + R3/R2 = 2 (6 dB).', 'C1–R1 legt f_c = 1 kHz fest, darunter +20 dB/Dek; darüber Verstärkung 1 + R3/R2 = 2 (6 dB).', 'C1–R1 决定 f_c = 1 kHz，以下为 +20 dB/十倍频；以上增益为 1 + R3/R2 = 2（6 dB）。'],
ex_notch_n:['Notch filter (Wien bridge)', 'Notch filter (Vinov most)', 'Filtro notch (puente de Wien)', 'Filtre réjecteur (pont de Wien)', 'Kerbfilter (Wien-Brücke)', '陷波滤波器（文氏电桥）'],
ex_notch_d:['Vout = 1.5·V_A − 0.5·Vin. At 1 kHz the Wien network gives exactly V_A = Vin/3, so the output cancels (−70 dB); elsewhere the gain is 0.5 (−6 dB).', 'Vout = 1,5·V_A − 0,5·Vin. Na 1 kHz Vinova mreža daje tačno V_A = Vin/3, pa se izlaz poništi (−70 dB); drugde je pojačanje 0,5 (−6 dB).', 'Vout = 1,5·V_A − 0,5·Vin. A 1 kHz la red de Wien da exactamente V_A = Vin/3 y la salida se anula (−70 dB); en el resto la ganancia es 0,5 (−6 dB).', 'Vout = 1,5·V_A − 0,5·Vin. À 1 kHz le réseau de Wien donne exactement V_A = Vin/3 : la sortie s’annule (−70 dB) ; ailleurs le gain vaut 0,5 (−6 dB).', 'Vout = 1,5·V_A − 0,5·Vin. Bei 1 kHz liefert das Wien-Netzwerk genau V_A = Vin/3, der Ausgang löscht sich aus (−70 dB); sonst Verstärkung 0,5 (−6 dB).', 'Vout = 1.5·V_A − 0.5·Vin。在 1 kHz 处文氏网络恰好给出 V_A = Vin/3，输出相互抵消（−70 dB）；其他频率增益为 0.5（−6 dB）。'],
ex_erramp_n:['Error amplifier (Type II compensation)', 'Pojačavač greške (kompenzacija tipa II)', 'Amplificador de error (compensación tipo II)', 'Amplificateur d’erreur (compensation type II)', 'Fehlerverstärker (Typ-II-Kompensation)', '误差放大器（II 型补偿）'],
ex_erramp_d:['As in switching regulators: an integrator at low frequencies, a zero at 159 Hz (R2·C1), a flat 20 dB, then a pole at ~16 kHz (R2·C2).', 'Kao u prekidačkim regulatorima: integrator na niskim frekvencijama, nula na 159 Hz (R2·C1), ravnih 20 dB, pa pol na ~16 kHz (R2·C2).', 'Como en los reguladores conmutados: integrador en baja frecuencia, un cero en 159 Hz (R2·C1), 20 dB planos y un polo hacia 16 kHz (R2·C2).', 'Comme dans les alimentations à découpage : intégrateur en basse fréquence, un zéro à 159 Hz (R2·C1), 20 dB plats, puis un pôle vers 16 kHz (R2·C2).', 'Wie in Schaltreglern: Integrator bei tiefen Frequenzen, Nullstelle bei 159 Hz (R2·C1), flache 20 dB, dann Pol bei ~16 kHz (R2·C2).', '与开关稳压器中一样：低频为积分器，159 Hz 处有零点（R2·C1），中间平坦 20 dB，约 16 kHz 处有极点（R2·C2）。'],
ex_howland_n:['Constant-current source (Howland)', 'Konstantni strujni izvor (Hauland)', 'Fuente de corriente constante (Howland)', 'Source de courant constant (Howland)', 'Konstantstromquelle (Howland)', '恒流源（Howland）'],
ex_howland_d:['I = Vin/R3 = 0.1 mA/V flows into the load R5, whatever its value. Vout is the load voltage: change R5 and H changes in proportion, since the current stays the same.', 'I = Vin/R3 = 0,1 mA/V teče kroz opterećenje R5, kolika god da je. Vout je napon na opterećenju: promeni R5 i H se menja srazmerno, jer struja ostaje ista.', 'I = Vin/R3 = 0,1 mA/V circula por la carga R5, sea cual sea. Vout es la tensión en la carga: cambia R5 y H cambia en proporción, porque la corriente no varía.', 'I = Vin/R3 = 0,1 mA/V traverse la charge R5, quelle que soit sa valeur. Vout est la tension sur la charge : change R5 et H varie en proportion, car le courant reste le même.', 'I = Vin/R3 = 0,1 mA/V fließt durch die Last R5, egal welchen Wert sie hat. Vout ist die Lastspannung: R5 ändern, H ändert sich proportional, weil der Strom gleich bleibt.', 'I = Vin/R3 = 0.1 mA/V 流过负载 R5，与其阻值无关。Vout 是负载电压：改变 R5，H 按比例变化，因为电流不变。'],
ex_isense_n:['Current-sense amplifier (shunt)', 'Pojačavač za merenje struje (šant)', 'Amplificador de medida de corriente (shunt)', 'Amplificateur de mesure de courant (shunt)', 'Strommessverstärker (Shunt)', '电流检测放大器（分流电阻）'],
ex_isense_d:['The load current flows through the 0.1 Ω shunt R1; the difference amplifier (gain 100) gives Vout = 100·0.1 Ω·I = 10 V/A. With R2 = 4.9 Ω, H = 2.', 'Struja opterećenja teče kroz šant R1 od 0,1 Ω; diferencijalni pojačavač (pojačanje 100) daje Vout = 100·0,1 Ω·I = 10 V/A. Sa R2 = 4,9 Ω, H = 2.', 'La corriente de carga pasa por el shunt R1 de 0,1 Ω; el amplificador diferencial (ganancia 100) da Vout = 100·0,1 Ω·I = 10 V/A. Con R2 = 4,9 Ω, H = 2.', 'Le courant de charge traverse le shunt R1 de 0,1 Ω ; l’amplificateur différentiel (gain 100) donne Vout = 100·0,1 Ω·I = 10 V/A. Avec R2 = 4,9 Ω, H = 2.', 'Der Laststrom fließt durch den 0,1-Ω-Shunt R1; der Differenzverstärker (Verstärkung 100) liefert Vout = 100·0,1 Ω·I = 10 V/A. Mit R2 = 4,9 Ω ist H = 2.', '负载电流流过 0.1 Ω 分流电阻 R1；差分放大器（增益 100）给出 Vout = 100·0.1 Ω·I = 10 V/A。R2 = 4.9 Ω 时 H = 2。'],
ex_wienloop_n:['Wien bridge oscillator (loop opened)', 'Vinov oscilator (otvorena petlja)', 'Oscilador de puente de Wien (lazo abierto)', 'Oscillateur à pont de Wien (boucle ouverte)', 'Wien-Brücken-Oszillator (Schleife offen)', '文氏电桥振荡器（环路断开）'],
ex_wienloop_d:["The graph is the loop gain, with the loop opened at the + input: Vin drives the amplifier (gain 1 + R4/R3 = 3) and Vout is read on the Wien network (1/3 at f₀). At f₀ = 1/(2πRC) ≈ 1.59 kHz it is exactly 0 dB and 0°, the oscillation condition. The oscillation itself is not simulated.","Grafik je pojačanje petlje, sa petljom otvorenom na + ulazu: Vin pobuđuje pojačavač (pojačanje 1 + R4/R3 = 3), a Vout se čita na Vinovoj mreži (1/3 na f₀). Na f₀ = 1/(2πRC) ≈ 1,59 kHz je tačno 0 dB i 0°, to je uslov oscilovanja. Samo oscilovanje se ne simulira.","El gráfico es la ganancia de lazo, con el lazo abierto en la entrada +: Vin excita el amplificador (ganancia 1 + R4/R3 = 3) y Vout se lee en la red de Wien (1/3 en f₀). En f₀ = 1/(2πRC) ≈ 1,59 kHz vale exactamente 0 dB y 0°, la condición de oscilación. La oscilación en sí no se simula.","Le graphe est le gain de boucle, la boucle étant ouverte à l’entrée + : Vin attaque l’amplificateur (gain 1 + R4/R3 = 3) et Vout est lu sur le réseau de Wien (1/3 à f₀). À f₀ = 1/(2πRC) ≈ 1,59 kHz il vaut exactement 0 dB et 0°, la condition d’oscillation. L’oscillation elle-même n’est pas simulée.","Der Graph zeigt die Schleifenverstärkung, die Schleife ist am +-Eingang geöffnet: Vin speist den Verstärker (Verstärkung 1 + R4/R3 = 3), Vout wird am Wien-Netzwerk abgegriffen (1/3 bei f₀). Bei f₀ = 1/(2πRC) ≈ 1,59 kHz genau 0 dB und 0°, die Schwingbedingung. Die Schwingung selbst wird nicht simuliert.","图中为环路增益，环路在 + 输入端断开：Vin 驱动放大器（增益 1 + R4/R3 = 3），Vout 取自文氏网络（f₀ 处为 1/3）。在 f₀ = 1/(2πRC) ≈ 1.59 kHz 处恰为 0 dB、0°，即振荡条件。振荡本身不做仿真。"],
ex_pid_n:['Analog PID controller', 'Analogni PID regulator', 'Regulador PID analógico', 'Régulateur PID analogique', 'Analoger PID-Regler', '模拟 PID 控制器'],
ex_pid_d:["Classic five op-amp PID: P (OP1), D (OP2) and I (OP3) stages, summing amplifier (OP4) and inverter (OP5). H = −[R2/R1 + s·R5·C1/(1 + s·R4·C1) + 1/(s·R7·C2)] (summing and inverter resistors equal; three inverting stages, so the sign is −). I below 1.6 Hz (−20 dB/dec), P = 10 (20 dB) in the middle, D above 1.6 kHz (+20 dB/dec), limited by R4 to 40 dB above 16 kHz.","Klasičan PID sa pet op-pojačavača: P (OP1), D (OP2) i I (OP3) stepen, sabirač (OP4) i invertor (OP5). H = −[R2/R1 + s·R5·C1/(1 + s·R4·C1) + 1/(s·R7·C2)] (otpornici sabirača i invertora su jednaki; tri invertujuća stepena, pa je znak −). I ispod 1,6 Hz (−20 dB/dek), P = 10 (20 dB) u sredini, D iznad 1,6 kHz (+20 dB/dek), koji R4 ograničava na 40 dB iznad 16 kHz.","PID clásico con cinco amplificadores operacionales: etapas P (OP1), D (OP2) e I (OP3), sumador (OP4) e inversor (OP5). H = −[R2/R1 + s·R5·C1/(1 + s·R4·C1) + 1/(s·R7·C2)] (resistencias del sumador e inversor iguales; tres etapas inversoras, así que el signo es −). I por debajo de 1,6 Hz (−20 dB/déc), P = 10 (20 dB) en medio, D por encima de 1,6 kHz (+20 dB/déc), limitada por R4 a 40 dB por encima de 16 kHz.","PID classique à cinq amplis-op : étages P (OP1), D (OP2) et I (OP3), sommateur (OP4) et inverseur (OP5). H = −[R2/R1 + s·R5·C1/(1 + s·R4·C1) + 1/(s·R7·C2)] (résistances du sommateur et de l’inverseur égales ; trois étages inverseurs, d’où le signe −). I sous 1,6 Hz (−20 dB/déc), P = 10 (20 dB) au milieu, D au-delà de 1,6 kHz (+20 dB/déc), limitée par R4 à 40 dB au-delà de 16 kHz.","Klassischer PID mit fünf OPVs: P- (OP1), D- (OP2) und I-Stufe (OP3), Summierer (OP4) und Inverter (OP5). H = −[R2/R1 + s·R5·C1/(1 + s·R4·C1) + 1/(s·R7·C2)] (Summier- und Inverterwiderstände gleich; drei invertierende Stufen, daher das Vorzeichen −). I unter 1,6 Hz (−20 dB/Dek), P = 10 (20 dB) in der Mitte, D über 1,6 kHz (+20 dB/Dek), durch R4 oberhalb 16 kHz auf 40 dB begrenzt.","经典五运放 PID：P（OP1）、D（OP2）、I（OP3）三级，加法器（OP4）和反相器（OP5）。H = −[R2/R1 + s·R5·C1/(1 + s·R4·C1) + 1/(s·R7·C2)]（加法器和反相器电阻相等；三级反相，所以符号为 −）。1.6 Hz 以下为 I（−20 dB/十倍频），中间 P = 10（20 dB），1.6 kHz 以上为 D（+20 dB/十倍频），16 kHz 以上被 R4 限制在 40 dB。"],
ex_sh_n:['Sample-and-hold (track mode)', 'Kolo za uzorkovanje i zadržavanje (praćenje)', 'Muestreo y retención (modo seguimiento)', 'Échantillonneur-bloqueur (mode suivi)', 'Abtast-Halte-Glied (Nachlaufmodus)', '采样保持电路（跟踪模式）'],
ex_sh_d:['The closed switch is R1 = R_on (100 Ω). While tracking, R_on·C1 limits the bandwidth to 1.6 MHz. Hold mode (switch open) is time-dependent and is not simulated.', 'Zatvoren prekidač je R1 = R_on (100 Ω). Dok prati, R_on·C1 ograničava opseg na 1,6 MHz. Režim zadržavanja (otvoren prekidač) zavisi od vremena i ne simulira se.', 'El interruptor cerrado es R1 = R_on (100 Ω). Durante el seguimiento, R_on·C1 limita el ancho de banda a 1,6 MHz. La retención (interruptor abierto) depende del tiempo y no se simula.', 'L’interrupteur fermé est R1 = R_on (100 Ω). En suivi, R_on·C1 limite la bande à 1,6 MHz. Le maintien (interrupteur ouvert) dépend du temps et n’est pas simulé.', 'Der geschlossene Schalter ist R1 = R_on (100 Ω). Beim Nachlaufen begrenzt R_on·C1 die Bandbreite auf 1,6 MHz. Der Haltemodus (Schalter offen) ist zeitabhängig und wird nicht simuliert.', '闭合的开关即 R1 = R_on（100 Ω）。跟踪时 R_on·C1 把带宽限制在 1.6 MHz。保持模式（开关断开）随时间变化，不做仿真。'],
ex_cmp_n:['Comparator: open-loop gain', 'Komparator: pojačanje otvorene petlje', 'Comparador: ganancia en lazo abierto', 'Comparateur : gain en boucle ouverte', 'Komparator: Leerlaufverstärkung', '比较器：开环增益'],
ex_cmp_d:['An op-amp without feedback (comparator, zero-crossing detector). Real mode is switched on: A₀ = 100 dB, pole at 10 Hz, 0 dB at GBW = 1 MHz. The switching to ±supply is not simulated.', 'Op. pojačavač bez povratne sprege (komparator, detektor prolaska kroz nulu). Uključuje se realni režim: A₀ = 100 dB, pol na 10 Hz, 0 dB na GBW = 1 MHz. Prebacivanje na ±napajanje se ne simulira.', 'Un amp. operacional sin realimentación (comparador, detector de paso por cero). Se activa el modo real: A₀ = 100 dB, polo en 10 Hz, 0 dB en GBW = 1 MHz. La conmutación a ±alimentación no se simula.', 'Un ampli-op sans contre-réaction (comparateur, détecteur de passage par zéro). Le mode réel est activé : A₀ = 100 dB, pôle à 10 Hz, 0 dB à GBW = 1 MHz. Le basculement vers ±alimentation n’est pas simulé.', 'Ein OPV ohne Rückkopplung (Komparator, Nulldurchgangsdetektor). Der Realmodus wird eingeschaltet: A₀ = 100 dB, Pol bei 10 Hz, 0 dB bei GBW = 1 MHz. Das Umschalten auf ±Versorgung wird nicht simuliert.', '没有反馈的运放（比较器、过零检测器）。会自动打开实际模式：A₀ = 100 dB，极点在 10 Hz，GBW = 1 MHz 处为 0 dB。翻转到 ±电源的过程不做仿真。'],
d_zeroNoa:['The numerator is zero for every s, so {0}(s) = 0 at all frequencies: the op-amps let no signal reach this point (for Z: an ideal op-amp holds Vin at 0 V, a virtual ground).','Brojilac je nula za svako s, pa je {0}(s) = 0 na svim frekvencijama: op. pojačavači ne propuštaju signal do te tačke (za Z: idealan pojačavač drži Vin na 0 V, virtuelna masa).','El numerador es cero para todo s, así que {0}(s) = 0 en todas las frecuencias: los amp. operacionales no dejan llegar señal a ese punto (para Z: un amp. ideal mantiene Vin a 0 V, masa virtual).','Le numérateur est nul pour tout s : {0}(s) = 0 à toutes les fréquences ; les ampli-op ne laissent aucun signal arriver à ce point (pour Z : un ampli idéal maintient Vin à 0 V, masse virtuelle).','Der Zähler ist für jedes s null, also {0}(s) = 0 bei allen Frequenzen: Die OPV lassen kein Signal zu diesem Punkt (für Z: Ein idealer OPV hält Vin auf 0 V, virtuelle Masse).','分子对所有 s 均为零，所以所有频率下 {0}(s) = 0：运放使信号无法到达该点（对 Z 而言：理想运放把 Vin 钳在 0 V，即虚地）。'],
d_zeroDoa:['The denominator is zero for every s, so {0} is infinite: Vin only drives op-amp inputs, which draw no current, or branches whose current an ideal op-amp forces to zero.','Imenilac je nula za svako s, pa je {0} beskonačno: Vin pobuđuje samo ulaze op. pojačavača, koji ne vuku struju, ili grane u kojima idealan pojačavač drži struju na nuli.','El denominador es cero para todo s, así que {0} es infinito: Vin solo alimenta entradas de amp. operacionales, que no toman corriente, o ramas cuya corriente un amp. ideal fuerza a cero.','Le dénominateur est nul pour tout s : {0} est infini ; Vin n’attaque que des entrées d’ampli-op, qui ne tirent aucun courant, ou des branches dont un ampli idéal annule le courant.','Der Nenner ist für jedes s null, also ist {0} unendlich: Vin speist nur OPV-Eingänge, die keinen Strom ziehen, oder Zweige, deren Strom ein idealer OPV auf null zwingt.','分母对所有 s 均为零，所以 {0} 为无穷大：Vin 只驱动不取电流的运放输入端，或被理想运放强制为零电流的支路。'],
d_nodalIntroOA:['The circuit contains an <b>op-amp</b>, so we use the <b>node voltage method</b> (it handles any circuit; the op-amp only adds its own equation):</p><p>1) Ground (GND) is the reference, potential 0. 2) For each node we write Kirchhoff’s current law: the sum of currents leaving the node is zero. 3) The current through a branch is written with the potentials at its ends: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) We solve the system of equations.', 'Kolo sadrži <b>operacioni pojačavač</b>, pa koristimo <b>metodu potencijala čvorova</b> (radi za svako kolo; pojačavač samo dodaje svoju jednačinu):</p><p>1) Masa (GND) je referenca, potencijal 0. 2) Za svaki čvor napišemo prvi Kirhofov zakon: zbir struja koje izlaze iz čvora je nula. 3) Struju kroz granu izrazimo preko potencijala na njenim krajevima: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) Rešimo sistem jednačina.', 'El circuito contiene un <b>amplificador operacional</b>, así que usamos el <b>método de tensiones de nodo</b> (sirve para cualquier circuito; el amplificador solo añade su propia ecuación):</p><p>1) La tierra (GND) es la referencia, potencial 0. 2) Para cada nodo escribimos la ley de corrientes de Kirchhoff: la suma de corrientes que salen del nodo es cero. 3) La corriente de una rama se expresa con los potenciales de sus extremos: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) Resolvemos el sistema de ecuaciones.', 'Le circuit contient un <b>ampli-op</b>, on utilise donc la <b>méthode des potentiels de nœuds</b> (elle convient à tout circuit ; l’ampli ajoute seulement sa propre équation) :</p><p>1) La masse (GND) est la référence, potentiel 0. 2) Pour chaque nœud on écrit la loi des nœuds de Kirchhoff : la somme des courants sortant du nœud est nulle. 3) Le courant d’une branche s’exprime avec les potentiels à ses extrémités : <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) On résout le système d’équations.', 'Die Schaltung enthält einen <b>Operationsverstärker</b>, daher verwenden wir das <b>Knotenpotenzialverfahren</b> (es funktioniert für jede Schaltung; der OPV fügt nur seine eigene Gleichung hinzu):</p><p>1) Masse (GND) ist der Bezug, Potenzial 0. 2) Für jeden Knoten schreiben wir die Kirchhoffsche Knotenregel: Die Summe der aus dem Knoten fließenden Ströme ist null. 3) Der Strom durch einen Zweig wird über die Potenziale an seinen Enden ausgedrückt: <code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>. 4) Wir lösen das Gleichungssystem.', '电路含有<b>运算放大器</b>，因此采用<b>节点电压法</b>（适用于任何电路；运放只增加它自己的方程）：</p><p>1）地（GND）为参考点，电位为 0。2）对每个节点写出基尔霍夫电流定律：流出节点的电流之和为零。3）支路电流用其两端电位表示：<code>I = (V_a − V_b)/Z = Y·(V_a − V_b)</code>。4）求解方程组。'],
d_matOA:['In the row of each op-amp output stands the op-amp equation instead of a KCL sum.', 'U redu izlaza svakog op. pojačavača stoji jednačina pojačavača umesto zbira struja.', 'En la fila de la salida de cada amp. operacional está su ecuación en lugar de la suma de corrientes.', 'Dans la ligne de la sortie de chaque ampli-op figure son équation au lieu de la somme des courants.', 'In der Zeile jedes OPV-Ausgangs steht statt der Stromsumme die OPV-Gleichung.', '每个运放输出节点所在的行是运放方程，而不是电流之和。'],

ex_sklp_d:['Unity gain: the output goes straight back to the − input. C2 (feedback) = 2·C1 gives Butterworth, Q = 0.707, f₀ = 1.13 kHz, −40 dB/dec.', 'Jedinično pojačanje: izlaz je direktno vraćen na − ulaz. C2 (povratna sprega) = 2·C1 daje Batervort, Q = 0,707, f₀ = 1,13 kHz, −40 dB/dek.', 'Ganancia unidad: la salida vuelve directamente a la entrada −. C2 (realimentación) = 2·C1 da Butterworth, Q = 0,707, f₀ = 1,13 kHz, −40 dB/déc.', 'Gain unité : la sortie revient directement sur l’entrée −. C2 (contre-réaction) = 2·C1 donne Butterworth, Q = 0,707, f₀ = 1,13 kHz, −40 dB/déc.', 'Verstärkung 1: Der Ausgang geht direkt auf den −-Eingang. C2 (Rückführung) = 2·C1 ergibt Butterworth, Q = 0,707, f₀ = 1,13 kHz, −40 dB/Dek.', '单位增益：输出直接接回 − 输入端。C2（反馈）= 2·C1 得到巴特沃斯，Q = 0.707，f₀ = 1.13 kHz，−40 dB/十倍频。'],

e_zzero:['Z = 0 at every frequency: an ideal op-amp holds Vin at 0 V (virtual ground).','Z = 0 na svim frekvencijama: idealan op. pojačavač drži Vin na 0 V (virtuelna masa).','Z = 0 en todas las frecuencias: un amp. operacional ideal mantiene Vin a 0 V (masa virtual).','Z = 0 à toutes les fréquences : un ampli-op idéal maintient Vin à 0 V (masse virtuelle).','Z = 0 bei allen Frequenzen: Ein idealer OPV hält Vin auf 0 V (virtuelle Masse).','所有频率下 Z = 0：理想运放把 Vin 钳在 0 V（虚地）。'],
e_hzeroP:['H = 0 at every frequency: Vout is not connected to Vin (only through ground), so no signal reaches it.','H = 0 na svim frekvencijama: Vout nije povezan sa Vin (samo preko mase), pa do njega ne stiže signal.','H = 0 en todas las frecuencias: Vout no está conectado a Vin (solo a través de masa), así que no le llega señal.','H = 0 à toutes les fréquences : Vout n’est pas relié à Vin (seulement par la masse), aucun signal ne lui parvient.','H = 0 bei allen Frequenzen: Vout ist nicht mit Vin verbunden (nur über Masse), daher kommt kein Signal an.','所有频率下 H = 0：Vout 与 Vin 没有连接（只经过地），信号无法到达。'],

sb_posHint:['Wiper position α: 0 % = at end A, 100 % = at end B. R_a = α·R (A–wiper), R_b = (1−α)·R (wiper–B).','Položaj klizača α: 0 % = kod kraja A, 100 % = kod kraja B. R_a = α·R (A–klizač), R_b = (1−α)·R (klizač–B).','Posición del cursor α: 0 % = en el extremo A, 100 % = en el extremo B. R_a = α·R (A–cursor), R_b = (1−α)·R (cursor–B).','Position du curseur α : 0 % = à l’extrémité A, 100 % = à l’extrémité B. R_a = α·R (A–curseur), R_b = (1−α)·R (curseur–B).','Schleiferstellung α: 0 % = am Ende A, 100 % = am Ende B. R_a = α·R (A–Schleifer), R_b = (1−α)·R (Schleifer–B).','滑动端位置 α：0 % = 在 A 端，100 % = 在 B 端。R_a = α·R（A–滑动端），R_b = (1−α)·R（滑动端–B）。'],
sb_oaIdeal:['Ideal op-amp: V+ = V−, no input current, zero output resistance. It needs negative feedback (output back to the − input).','Idealan op. pojačavač: V+ = V−, ulazi ne vuku struju, izlazna otpornost 0. Potrebna mu je negativna povratna sprega (izlaz vraćen na − ulaz).','Amp. operacional ideal: V+ = V−, sin corriente de entrada, resistencia de salida nula. Necesita realimentación negativa (salida hacia la entrada −).','Ampli-op idéal : V+ = V−, aucun courant d’entrée, résistance de sortie nulle. Il faut une contre-réaction (sortie ramenée sur l’entrée −).','Idealer OPV: V+ = V−, kein Eingangsstrom, Ausgangswiderstand null. Er braucht Gegenkopplung (Ausgang zurück auf den −-Eingang).','理想运放：V+ = V−，输入无电流，输出电阻为零。需要负反馈（输出接回 − 输入端）。'],
sb_oaReal:['Real op-amp: gain A₀ with one pole (GBW), input L, R, C and output R, L, C below.','Realan op. pojačavač: pojačanje A₀ sa jednim polom (GBW), ulazni L, R, C i izlazni R, L, C ispod.','Amp. operacional real: ganancia A₀ con un polo (GBW), L, R, C de entrada y R, L, C de salida abajo.','Ampli-op réel : gain A₀ avec un pôle (GBW), L, R, C d’entrée et R, L, C de sortie ci-dessous.','Realer OPV: Verstärkung A₀ mit einem Pol (GBW), Eingangs-L, -R, -C und Ausgangs-R, -L, -C unten.','实际运放：增益 A₀ 带一个极点（GBW），下方为输入 L、R、C 与输出 R、L、C。'],
e_oaVin:['{0}: the output of an ideal op-amp must not be connected to Vin.','{0}: izlaz idealnog op. pojačavača ne sme biti spojen na Vin.','{0}: la salida de un amp. operacional ideal no debe conectarse a Vin.','{0} : la sortie d’un ampli-op idéal ne doit pas être reliée à Vin.','{0}: Der Ausgang eines idealen OPV darf nicht an Vin liegen.','{0}：理想运放的输出不能接到 Vin。'],
e_oaGnd:['{0}: the output of an ideal op-amp must not be connected to GND.','{0}: izlaz idealnog op. pojačavača ne sme biti spojen na GND.','{0}: la salida de un amp. operacional ideal no debe conectarse a GND.','{0} : la sortie d’un ampli-op idéal ne doit pas être reliée à GND.','{0}: Der Ausgang eines idealen OPV darf nicht an GND liegen.','{0}：理想运放的输出不能接到 GND。'],
e_oa2:['{0} and {1}: the outputs of two ideal op-amps must not be connected together.','{0} i {1}: izlazi dva idealna op. pojačavača ne smeju biti spojeni zajedno.','{0} y {1}: las salidas de dos amp. operacionales ideales no deben unirse.','{0} et {1} : les sorties de deux ampli-op idéaux ne doivent pas être reliées.','{0} und {1}: Die Ausgänge zweier idealer OPV dürfen nicht verbunden sein.','{0} 与 {1}：两个理想运放的输出不能连在一起。'],
e_oaFloat:['{0}: an input is not connected to the circuit, so its voltage is undefined.','{0}: jedan ulaz nije spojen na kolo, pa mu napon nije određen.','{0}: una entrada no está conectada al circuito, su tensión queda indefinida.','{0} : une entrée n’est pas reliée au circuit, sa tension est indéfinie.','{0}: Ein Eingang ist nicht mit der Schaltung verbunden, seine Spannung ist unbestimmt.','{0}：有输入端未接入电路，其电压无法确定。'],
e_zinf:['Vin only drives op-amp inputs, so no current flows: Z = ∞. Add Vout, or a path from Vin to GND.','Vin pobuđuje samo ulaze op. pojačavača, struja ne teče: Z = ∞. Dodaj Vout ili put od Vin do GND.','Vin solo alimenta entradas de amp. operacionales, no circula corriente: Z = ∞. Añade Vout o un camino de Vin a GND.','Vin n’attaque que des entrées d’ampli-op, aucun courant ne circule : Z = ∞. Ajoute Vout ou un chemin de Vin à GND.','Vin speist nur OPV-Eingänge, es fließt kein Strom: Z = ∞. Füge Vout oder einen Pfad von Vin nach GND hinzu.','Vin 只驱动运放输入端，没有电流：Z = ∞。请添加 Vout 或 Vin 到 GND 的通路。'],
e_zinfTab:['Zin = ∞: Vin only drives op-amp inputs, which draw no current.','Zin = ∞: Vin pobuđuje samo ulaze op. pojačavača, koji ne vuku struju.','Zin = ∞: Vin solo alimenta entradas de amp. operacionales, que no toman corriente.','Zin = ∞ : Vin n’attaque que des entrées d’ampli-op, qui ne tirent aucun courant.','Zin = ∞: Vin speist nur OPV-Eingänge, die keinen Strom ziehen.','Zin = ∞：Vin 只驱动运放输入端，输入端不取电流。'],
e_vdcShort:['The DC voltage source {0} is short-circuited.','Jednosmerni naponski izvor {0} je kratko spojen.','La fuente de tensión continua {0} está en cortocircuito.','La source de tension continue {0} est court-circuitée.','Die Gleichspannungsquelle {0} ist kurzgeschlossen.','直流电压源 {0} 被短路。'],
e_vinVdc:['Vin is tied to ground through a DC voltage source: for the AC signal that is a short circuit.','Vin je preko jednosmernog naponskog izvora vezan na masu: za naizmenični signal to je kratak spoj.','Vin está unida a masa a través de una fuente de tensión continua: para la señal alterna es un cortocircuito.','Vin est reliée à la masse par une source de tension continue : pour le signal alternatif c’est un court-circuit.','Vin liegt über eine Gleichspannungsquelle an Masse: Für das Wechselsignal ist das ein Kurzschluss.','Vin 经直流电压源接地：对交流信号而言这是短路。'],
e_vLoop:['Voltage sources form a loop or are shorted ({0}): the DC operating point has no solution.','Naponski izvori čine petlju ili su kratko spojeni ({0}): jednosmerna radna tačka nema rešenje.','Las fuentes de tensión forman un lazo o están en cortocircuito ({0}): el punto de trabajo no tiene solución.','Des sources de tension forment une boucle ou sont court-circuitées ({0}) : le point de fonctionnement n’a pas de solution.','Spannungsquellen bilden eine Masche oder sind kurzgeschlossen ({0}): Der Arbeitspunkt hat keine Lösung.','电压源构成回路或被短路（{0}）：直流工作点无解。'],
e_vLoopOA:['An op-amp output is tied directly to a voltage source or to another output: the DC operating point has no solution.','Izlaz op. pojačavača je direktno vezan na naponski izvor ili na drugi izlaz: jednosmerna radna tačka nema rešenje.','La salida de un amp. operacional está unida directamente a una fuente de tensión o a otra salida: el punto de trabajo no tiene solución.','La sortie d’un ampli-op est reliée directement à une source de tension ou à une autre sortie : le point de fonctionnement n’a pas de solution.','Ein OPV-Ausgang liegt direkt an einer Spannungsquelle oder einem anderen Ausgang: Der Arbeitspunkt hat keine Lösung.','运放输出直接接到电压源或另一输出：直流工作点无解。'],
e_opFloat:['No DC path for {0}: a terminal has no DC connection to ground (only through a capacitor, a MOSFET gate or nothing), so the operating point is undefined. Add a bias resistor.','Nema DC putanje za {0}: neki izvod nema jednosmernu vezu sa masom (samo preko kondenzatora, gejta MOSFET-a ili nikako), pa radna tačka nije određena. Dodajte otpornik za polarizaciju.','No hay camino de continua para {0}: un terminal no tiene conexión de continua con masa (solo a través de un condensador, una puerta de MOSFET o nada), así que el punto de trabajo no está definido. Añada una resistencia de polarización.','Pas de chemin continu pour {0} : une borne n’a pas de liaison continue avec la masse (seulement par un condensateur, une grille de MOSFET ou rien), le point de fonctionnement est donc indéfini. Ajoutez une résistance de polarisation.','Kein Gleichstrompfad für {0}: Ein Anschluss hat keine Gleichstromverbindung zur Masse (nur über einen Kondensator, ein MOSFET-Gate oder gar nicht), daher ist der Arbeitspunkt unbestimmt. Fügen Sie einen Vorwiderstand zur Arbeitspunkteinstellung hinzu.','{0} 没有直流通路：某个端子与地之间没有直流连接（只经电容、MOSFET 栅极或根本未连接），工作点无法确定。请加偏置电阻。'],
e_opOver:['Unrealistic operating point: the current through {0} exceeds 10 A (a junction is probably connected directly across a voltage source). Add a series resistor.','Nerealna radna tačka: struja kroz {0} je veća od 10 A (verovatno je p-n spoj direktno na naponskom izvoru). Dodajte redni otpornik.','Punto de trabajo irreal: la corriente por {0} supera 10 A (probablemente una unión está conectada directamente a una fuente de tensión). Añada una resistencia en serie.','Point de fonctionnement irréaliste : le courant dans {0} dépasse 10 A (une jonction est probablement branchée directement sur une source de tension). Ajoutez une résistance série.','Unrealistischer Arbeitspunkt: Der Strom durch {0} übersteigt 10 A (vermutlich liegt ein pn-Übergang direkt an einer Spannungsquelle). Fügen Sie einen Serienwiderstand hinzu.','工作点不现实：流过 {0} 的电流超过 10 A（可能有 PN 结直接接在电压源上）。请串联电阻。'],
e_opOverV:['Unrealistic operating point: a node voltage exceeds 10 kV (check the op-amp feedback and the sources).','Nerealna radna tačka: napon nekog čvora je veći od 10 kV (proverite povratnu spregu op. pojačavača i izvore).','Punto de trabajo irreal: la tensión de un nodo supera 10 kV (revise la realimentación del amp. operacional y las fuentes).','Point de fonctionnement irréaliste : la tension d’un nœud dépasse 10 kV (vérifiez la contre-réaction de l’ampli-op et les sources).','Unrealistischer Arbeitspunkt: Eine Knotenspannung übersteigt 10 kV (prüfen Sie die OPV-Rückkopplung und die Quellen).','工作点不现实：某节点电压超过 10 kV（请检查运放反馈和电源）。'],
e_opNoConv:['The DC operating point could not be found (the Newton iteration did not converge). Check the bias network.','Jednosmerna radna tačka nije pronađena (Njutnov postupak nije konvergirao). Proverite mrežu za polarizaciju.','No se encontró el punto de trabajo de continua (la iteración de Newton no convergió). Revise la red de polarización.','Le point de fonctionnement continu n’a pas été trouvé (l’itération de Newton n’a pas convergé). Vérifiez le réseau de polarisation.','Der Gleichstrom-Arbeitspunkt wurde nicht gefunden (die Newton-Iteration konvergierte nicht). Prüfen Sie das Netzwerk zur Arbeitspunkteinstellung.','未能求得直流工作点（牛顿迭代不收敛）。请检查偏置网络。'],
e_sing:['The equations have no unique solution: some node has no defined voltage (it is reached only through a current source).','Jednačine nemaju jedinstveno rešenje: neki čvor nema određen napon (dostupan je samo preko strujnog izvora).','Las ecuaciones no tienen solución única: algún nodo no tiene tensión definida (solo se llega a él a través de una fuente de corriente).','Les équations n’ont pas de solution unique : un nœud n’a pas de tension définie (on ne l’atteint que par une source de courant).','Die Gleichungen haben keine eindeutige Lösung: Ein Knoten hat keine bestimmte Spannung (er ist nur über eine Stromquelle erreichbar).','方程没有唯一解：某节点电压不确定（只经电流源与电路相连）。'],
e_ssNoPath:['In the small-signal circuit Vin is not connected to ground (for example only to the gate of a MOSFET that is off and has no capacitances), so the response is zero.','U kolu za male signale Vin nije povezan sa masom (na primer samo na gejt zakočenog MOSFET-a bez kapacitivnosti), pa je odziv nula.','En el circuito de pequeña señal Vin no está conectada a masa (por ejemplo solo a la puerta de un MOSFET en corte sin capacidades), así que la respuesta es cero.','Dans le circuit petits signaux, Vin n’est pas relié à la masse (par exemple seulement à la grille d’un MOSFET bloqué sans capacités) : la réponse est nulle.','In der Kleinsignalschaltung ist Vin nicht mit Masse verbunden (z. B. nur mit dem Gate eines gesperrten MOSFET ohne Kapazitäten), daher ist die Antwort null.','在小信号电路中 Vin 没有与地相连（例如只接到截止且无电容的 MOSFET 栅极），因此响应为零。'],

op_none:['No operating point (the circuit is not complete or has an error).','Nema radne tačke (kolo nije kompletno ili ima grešku).','Sin punto de trabajo (el circuito no está completo o tiene un error).','Pas de point de fonctionnement (circuit incomplet ou erroné).','Kein Arbeitspunkt (Schaltung unvollständig oder fehlerhaft).','无工作点（电路不完整或有错误）。'],

sb_vdc:['For the small signal (graphs) a DC voltage source is a short circuit; it only sets the operating point.','Za male signale (grafici) DC naponski izvor je kratak spoj; on samo postavlja radnu tačku.','Para la pequeña señal (gráficas) una fuente de tensión continua es un cortocircuito; solo fija el punto de trabajo.','Pour les petits signaux (graphiques), une source de tension continue est un court-circuit ; elle ne fixe que le point de fonctionnement.','Für das Kleinsignal (Diagramme) ist eine Gleichspannungsquelle ein Kurzschluss; sie legt nur den Arbeitspunkt fest.','对小信号（图形）而言，直流电压源相当于短路，只用于设置工作点。'],
sb_idc:['For the small signal (graphs) a DC current source is an open circuit; it only sets the operating point. The arrow shows the direction of the current.','Za male signale (grafici) DC strujni izvor je otvorena veza; on samo postavlja radnu tačku. Strelica pokazuje smer struje.','Para la pequeña señal (gráficas) una fuente de corriente continua es un circuito abierto; solo fija el punto de trabajo. La flecha indica el sentido de la corriente.','Pour les petits signaux (graphiques), une source de courant continu est un circuit ouvert ; elle ne fixe que le point de fonctionnement. La flèche indique le sens du courant.','Für das Kleinsignal (Diagramme) ist eine Gleichstromquelle ein Leerlauf; sie legt nur den Arbeitspunkt fest. Der Pfeil zeigt die Stromrichtung.','对小信号（图形）而言，直流电流源相当于开路，只用于设置工作点。箭头表示电流方向。'],
sb_vindc:['DC level of Vin (only for the operating point of diodes and transistors; the graphs show the small-signal response around it).','DC nivo ulaza Vin (samo za radnu tačku dioda i tranzistora; grafici prikazuju odziv na male signale oko nje).','Nivel de continua de Vin (solo para el punto de trabajo de diodos y transistores; las gráficas muestran la respuesta de pequeña señal en torno a él).','Niveau continu de Vin (seulement pour le point de fonctionnement des diodes et transistors ; les graphiques montrent la réponse petits signaux autour de lui).','Gleichanteil von Vin (nur für den Arbeitspunkt der Dioden und Transistoren; die Diagramme zeigen die Kleinsignalantwort um ihn herum).','Vin 的直流电平（只用于二极管和晶体管的工作点；图形显示其附近的小信号响应）。'],
sb_vinidc:['DC current pushed into Vin (only for the operating point; the impedance is the small-signal one around it).','DC struja koja se utiskuje u Vin (samo za radnu tačku; impedansa je ona za male signale oko nje).','Corriente continua inyectada en Vin (solo para el punto de trabajo; la impedancia es la de pequeña señal en torno a él).','Courant continu injecté dans Vin (seulement pour le point de fonctionnement ; l’impédance est celle des petits signaux autour de lui).','In Vin eingespeister Gleichstrom (nur für den Arbeitspunkt; die Impedanz ist die Kleinsignalimpedanz um ihn herum).','注入 Vin 的直流电流（只用于工作点；阻抗为其附近的小信号阻抗）。'],
g_semi:['Transistors and diodes (small signal)','Tranzistori i diode (mali signali)','Transistores y diodos (pequeña señal)','Transistors et diodes (petits signaux)','Transistoren und Dioden (Kleinsignal)','晶体管与二极管（小信号）'],
ex_ce_n:['Common-emitter amplifier','Pojačavač sa zajedničkim emitorom','Amplificador en emisor común','Amplificateur émetteur commun','Emitterschaltung','共射放大器'],
ex_ce_d:['Divider bias, bypassed R<sub>E</sub>. Mid-band gain ≈ −g<sub>m</sub>(R<sub>C</sub>∥R<sub>L</sub>) ≈ −170 (45 dB); coupling capacitors set the low cut-off, C<sub>π</sub> and the Miller-multiplied C<sub>μ</sub> the high one. Tap Q1 to see its operating point.','Polarizacija razdelnikom, R<sub>E</sub> premošćen. Pojačanje u srednjem opsegu ≈ −g<sub>m</sub>(R<sub>C</sub>∥R<sub>L</sub>) ≈ −170 (45 dB); kondenzatori za spregu određuju donju graničnu učestanost, a C<sub>π</sub> i Milerom uvećana C<sub>μ</sub> gornju. Dodirni Q1 za radnu tačku.','Polarización por divisor, R<sub>E</sub> desacoplada. Ganancia en banda media ≈ −g<sub>m</sub>(R<sub>C</sub>∥R<sub>L</sub>) ≈ −170 (45 dB); los condensadores de acoplamiento fijan el corte inferior, C<sub>π</sub> y C<sub>μ</sub> multiplicada por Miller el superior. Toca Q1 para ver su punto de trabajo.','Polarisation par pont, R<sub>E</sub> découplée. Gain en bande médiane ≈ −g<sub>m</sub>(R<sub>C</sub>∥R<sub>L</sub>) ≈ −170 (45 dB) ; les condensateurs de liaison fixent la coupure basse, C<sub>π</sub> et C<sub>μ</sub> multipliée par Miller la haute. Touchez Q1 pour voir son point de fonctionnement.','Spannungsteiler-Arbeitspunkt, R<sub>E</sub> überbrückt. Verstärkung im mittleren Bereich ≈ −g<sub>m</sub>(R<sub>C</sub>∥R<sub>L</sub>) ≈ −170 (45 dB); die Koppelkondensatoren bestimmen die untere, C<sub>π</sub> und die durch Miller vergrößerte C<sub>μ</sub> die obere Grenzfrequenz. Tippen Sie auf Q1 für den Arbeitspunkt.','分压偏置，R<sub>E</sub> 旁路。中频增益 ≈ −g<sub>m</sub>(R<sub>C</sub>∥R<sub>L</sub>) ≈ −170（45 dB）；耦合电容决定下限频率，C<sub>π</sub> 和经米勒效应放大的 C<sub>μ</sub> 决定上限频率。点按 Q1 查看工作点。'],
ex_cs_n:['Common-source amplifier (MOSFET)','Pojačavač sa zajedničkim sorsom (MOSFET)','Amplificador en fuente común (MOSFET)','Amplificateur source commune (MOSFET)','Sourceschaltung (MOSFET)','共源放大器（MOSFET）'],
ex_cs_d:['N-channel MOSFET in saturation, I<sub>D</sub> ≈ 1.6 mA. Gain ≈ −g<sub>m</sub>(R<sub>D</sub>∥R<sub>L</sub>) ≈ −8 (18 dB); g<sub>m</sub> = √(2kI_D). The gate draws no DC current, so the divider can be in the MΩ range.','N-kanalni MOSFET u zasićenju, I<sub>D</sub> ≈ 1,6 mA. Pojačanje ≈ −g<sub>m</sub>(R<sub>D</sub>∥R<sub>L</sub>) ≈ −8 (18 dB); g<sub>m</sub> = √(2kI_D). Gejt ne vuče DC struju, pa razdelnik može biti reda MΩ.','MOSFET de canal N en saturación, I<sub>D</sub> ≈ 1,6 mA. Ganancia ≈ −g<sub>m</sub>(R<sub>D</sub>∥R<sub>L</sub>) ≈ −8 (18 dB); g<sub>m</sub> = √(2kI_D). La puerta no toma corriente continua, así que el divisor puede ser de MΩ.','MOSFET canal N en saturation, I<sub>D</sub> ≈ 1,6 mA. Gain ≈ −g<sub>m</sub>(R<sub>D</sub>∥R<sub>L</sub>) ≈ −8 (18 dB) ; g<sub>m</sub> = √(2kI_D). La grille ne prend pas de courant continu, le pont peut donc être de l’ordre du MΩ.','N-Kanal-MOSFET in Sättigung, I<sub>D</sub> ≈ 1,6 mA. Verstärkung ≈ −g<sub>m</sub>(R<sub>D</sub>∥R<sub>L</sub>) ≈ −8 (18 dB); g<sub>m</sub> = √(2kI_D). Das Gate zieht keinen Gleichstrom, daher darf der Teiler im MΩ-Bereich liegen.','N 沟道 MOSFET 工作在饱和区，I<sub>D</sub> ≈ 1.6 mA。增益 ≈ −g<sub>m</sub>(R<sub>D</sub>∥R<sub>L</sub>) ≈ −8（18 dB）；g<sub>m</sub> = √(2kI_D)。栅极不取直流电流，因此分压电阻可取 MΩ 级。'],
ex_cc_n:['Emitter follower','Emitorski sledilac','Seguidor de emisor','Émetteur suiveur','Emitterfolger','射极跟随器'],
ex_cc_d:['Common collector: gain just below 1, high input and low output impedance (switch the Ω tab to Zin). Output resistance ≈ 1/g<sub>m</sub> + R<sub>s</sub>/β.','Zajednički kolektor: pojačanje malo ispod 1, velika ulazna i mala izlazna impedansa (kartica Ω za Zin). Izlazna otpornost ≈ 1/g<sub>m</sub> + R<sub>s</sub>/β.','Colector común: ganancia algo menor que 1, impedancia de entrada alta y de salida baja (pestaña Ω para Zin). Resistencia de salida ≈ 1/g<sub>m</sub> + R<sub>s</sub>/β.','Collecteur commun : gain juste sous 1, impédance d’entrée élevée et de sortie faible (onglet Ω pour Zin). Résistance de sortie ≈ 1/g<sub>m</sub> + R<sub>s</sub>/β.','Kollektorschaltung: Verstärkung knapp unter 1, hohe Eingangs- und niedrige Ausgangsimpedanz (Reiter Ω für Zin). Ausgangswiderstand ≈ 1/g<sub>m</sub> + R<sub>s</sub>/β.','共集电极：增益略小于 1，输入阻抗高、输出阻抗低（Ω 页查看 Zin）。输出电阻 ≈ 1/g<sub>m</sub> + R<sub>s</sub>/β。'],
ex_diff_n:['Differential pair','Diferencijalni par','Par diferencial','Paire différentielle','Differenzverstärker','差分对'],
ex_diff_d:['Two NPN transistors with a 1 mA tail current source and ±12 V supplies. Single-ended gain from base of Q1 to collector of Q2 ≈ g<sub>m</sub>·R<sub>C</sub>/2 ≈ 97 (39.7 dB).','Dva NPN tranzistora sa strujnim izvorom 1 mA u repu i napajanjem ±12 V. Pojačanje od baze Q1 do kolektora Q2 ≈ g<sub>m</sub>·R<sub>C</sub>/2 ≈ 97 (39,7 dB).','Dos transistores NPN con fuente de corriente de cola de 1 mA y alimentación ±12 V. Ganancia de la base de Q1 al colector de Q2 ≈ g<sub>m</sub>·R<sub>C</sub>/2 ≈ 97 (39,7 dB).','Deux transistors NPN avec source de courant de queue de 1 mA et alimentation ±12 V. Gain de la base de Q1 au collecteur de Q2 ≈ g<sub>m</sub>·R<sub>C</sub>/2 ≈ 97 (39,7 dB).','Zwei NPN-Transistoren mit 1-mA-Fußpunktstromquelle und ±12 V Versorgung. Verstärkung von der Basis von Q1 zum Kollektor von Q2 ≈ g<sub>m</sub>·R<sub>C</sub>/2 ≈ 97 (39,7 dB).','两只 NPN 晶体管，尾电流源 1 mA，±12 V 电源。从 Q1 基极到 Q2 集电极的增益 ≈ g<sub>m</sub>·R<sub>C</sub>/2 ≈ 97（39.7 dB）。'],
ex_dio_n:['Diode as a variable resistor','Dioda kao promenljivi otpornik','Diodo como resistencia variable','Diode en résistance variable','Diode als veränderlicher Widerstand','二极管作可变电阻'],
ex_dio_d:['A DC current biases the diode (C1 keeps it out of Vin); for the signal the diode is r<sub>d</sub> = nV_T/I<sub>D</sub> (259 Ω at 100 µA), so the divider gives r<sub>d</sub>/(R + r<sub>d</sub>) ≈ −13.7 dB. Change I1 and watch the gain follow.','DC struja polarizuje diodu (C1 ne da da ode u Vin); za signal dioda je r<sub>d</sub> = nV_T/I<sub>D</sub> (259 Ω pri 100 µA), pa razdelnik daje r<sub>d</sub>/(R + r<sub>d</sub>) ≈ −13,7 dB. Menjaj I1 i prati kako se menja pojačanje.','Una corriente continua polariza el diodo; para la señal es r<sub>d</sub> = nV_T/I<sub>D</sub> (259 Ω a 100 µA), así que el divisor da r<sub>d</sub>/(R + r<sub>d</sub>). Cambia I1 y observa la ganancia.','Un courant continu polarise la diode ; pour le signal elle vaut r<sub>d</sub> = nV_T/I<sub>D</sub> (259 Ω à 100 µA), le pont donne donc r<sub>d</sub>/(R + r<sub>d</sub>). Changez I1 et observez le gain.','Ein Gleichstrom stellt die Diode ein; für das Signal ist sie r<sub>d</sub> = nV_T/I<sub>D</sub> (259 Ω bei 100 µA), der Teiler ergibt also r<sub>d</sub>/(R + r<sub>d</sub>). Ändern Sie I1 und beobachten Sie die Verstärkung.','直流电流为二极管提供偏置；对信号而言其电阻 r<sub>d</sub> = nV_T/I<sub>D</sub>（100 µA 时为 259 Ω），因此分压比为 r<sub>d</sub>/(R + r<sub>d</sub>)。改变 I1，观察增益变化。'],
st_op:['Operating point and small-signal model','Radna tačka i model za male signale','Punto de trabajo y modelo de pequeña señal','Point de fonctionnement et modèle petits signaux','Arbeitspunkt und Kleinsignalmodell','工作点与小信号模型'],
d_opIntro:['First the DC operating point is found: every inductor is a short, every capacitor is open, the DC sources and the DC level of Vin are applied, and the nonlinear device equations are solved by Newton’s method (as in SPICE). Then each device is replaced by its small-signal model, whose values are the derivatives of the device currents at that point:','Prvo se nalazi jednosmerna radna tačka: svaki kalem je kratak spoj, svaki kondenzator otvorena veza, uključeni su DC izvori i DC nivo ulaza Vin, a nelinearne jednačine elemenata rešavaju se Njutnovom metodom (kao u SPICE-u). Zatim se svaki element zamenjuje modelom za male signale čije su vrednosti izvodi struja elementa u toj tački:','Primero se halla el punto de trabajo de continua: cada bobina es un cortocircuito, cada condensador un circuito abierto, se aplican las fuentes de continua y el nivel de continua de Vin, y las ecuaciones no lineales se resuelven por el método de Newton (como en SPICE). Luego cada dispositivo se sustituye por su modelo de pequeña señal, cuyos valores son las derivadas de sus corrientes en ese punto:','On cherche d’abord le point de fonctionnement continu : chaque bobine est un court-circuit, chaque condensateur un circuit ouvert, les sources continues et le niveau continu de Vin sont appliqués, et les équations non linéaires sont résolues par la méthode de Newton (comme dans SPICE). Chaque composant est ensuite remplacé par son modèle petits signaux, dont les valeurs sont les dérivées de ses courants en ce point :','Zuerst wird der Gleichstrom-Arbeitspunkt bestimmt: Jede Spule ist ein Kurzschluss, jeder Kondensator offen, die Gleichquellen und der Gleichanteil von Vin liegen an, und die nichtlinearen Bauteilgleichungen werden mit dem Newton-Verfahren gelöst (wie in SPICE). Dann wird jedes Bauteil durch sein Kleinsignalmodell ersetzt, dessen Werte die Ableitungen seiner Ströme in diesem Punkt sind:','首先求直流工作点：电感短路、电容开路，加上直流电源和 Vin 的直流电平，用牛顿法求解非线性器件方程（与 SPICE 相同）。然后用小信号模型代替每个器件，其参数为器件电流在该点的导数：'],

d_vccs:['Controlled current sources (transistor g<sub>m</sub>), current from the first node to the second:','Kontrolisani strujni izvori (g<sub>m</sub> tranzistora), struja od prvog ka drugom čvoru:','Fuentes de corriente controladas (g<sub>m</sub> de los transistores), corriente del primer nodo al segundo:','Sources de courant commandées (g<sub>m</sub> des transistors), courant du premier nœud vers le second :','Gesteuerte Stromquellen (g<sub>m</sub> der Transistoren), Strom vom ersten zum zweiten Knoten:','受控电流源（晶体管 g<sub>m</sub>），电流从第一个节点流向第二个节点：'],

d_ssNote:['The values in brackets are the usual textbook approximations, for comparison; the calculation uses the exact values. From here on the circuit is linear and is solved like any other.','Vrednosti u zagradama su uobičajene udžbeničke aproksimacije, radi poređenja; proračun koristi tačne vrednosti. Odavde je kolo linearno i rešava se kao svako drugo.','Los valores entre paréntesis son las aproximaciones habituales de libro, para comparar; el cálculo usa los valores exactos. A partir de aquí el circuito es lineal y se resuelve como cualquier otro.','Les valeurs entre parenthèses sont les approximations usuelles des manuels, pour comparaison ; le calcul utilise les valeurs exactes. À partir d’ici le circuit est linéaire et se résout comme les autres.','Die Werte in Klammern sind die üblichen Lehrbuchnäherungen zum Vergleich; gerechnet wird mit den exakten Werten. Ab hier ist die Schaltung linear und wird wie jede andere gelöst.','括号中的数值是常见的教科书近似值，仅供比较；计算使用精确值。此后电路为线性电路，按常规方法求解。'],
dr_q:['Bipolar transistor (BJT)','Bipolarni tranzistor (BJT)','Transistor bipolar (BJT)','Transistor bipolaire (BJT)','Bipolartransistor (BJT)','双极型晶体管（BJT）'],
dr_m:['MOSFET','MOSFET','MOSFET','MOSFET','MOSFET','MOSFET'],
inf_dc:['DC model (operating point)','DC model (radna tačka)','Modelo de continua (punto de trabajo)','Modèle continu (point de fonctionnement)','Gleichstrommodell (Arbeitspunkt)','直流模型（工作点）'],
inf_ss:['Small-signal model (all graphs)','Model za male signale (svi grafici)','Modelo de pequeña señal (todas las gráficas)','Modèle petits signaux (tous les graphiques)','Kleinsignalmodell (alle Diagramme)','小信号模型（所有图形）'],
inf_semiNote:['The app first finds the DC operating point (inductors shorted, capacitors open, DC sources and the DC level of Vin applied) by Newton’s method, exactly as SPICE does, and then replaces the device by its linear small-signal model at that point. The graphs are therefore valid for small signals around the operating point: large swings (clipping, saturation) are not simulated.','Aplikacija prvo nalazi jednosmernu radnu tačku (kalemovi kratko spojeni, kondenzatori otvoreni, DC izvori i DC nivo ulaza Vin uključeni) Njutnovom metodom, isto kao SPICE, a zatim element zamenjuje linearnim modelom za male signale u toj tački. Grafici zato važe za male signale oko radne tačke: veliki signali (odsecanje, zasićenje) se ne simuliraju.','La app primero halla el punto de trabajo de continua (bobinas en cortocircuito, condensadores abiertos, fuentes de continua y nivel de continua de Vin aplicados) por el método de Newton, igual que SPICE, y luego sustituye el dispositivo por su modelo lineal de pequeña señal en ese punto. Las gráficas valen para señales pequeñas alrededor del punto de trabajo: no se simulan grandes excursiones (recorte, saturación).','L’application trouve d’abord le point de fonctionnement continu (bobines en court-circuit, condensateurs ouverts, sources continues et niveau continu de Vin appliqués) par la méthode de Newton, comme SPICE, puis remplace le composant par son modèle linéaire petits signaux en ce point. Les graphiques valent donc pour de petits signaux autour du point de fonctionnement : les grandes excursions (écrêtage, saturation) ne sont pas simulées.','Die App bestimmt zuerst den Gleichstrom-Arbeitspunkt (Spulen kurzgeschlossen, Kondensatoren offen, Gleichquellen und der Gleichanteil von Vin angelegt) mit dem Newton-Verfahren wie SPICE und ersetzt das Bauteil dann durch sein lineares Kleinsignalmodell in diesem Punkt. Die Diagramme gelten daher für kleine Signale um den Arbeitspunkt; große Aussteuerung (Begrenzung, Sättigung) wird nicht simuliert.','本应用先用牛顿法求出直流工作点（电感短路、电容开路，加上直流电源和 Vin 的直流电平），与 SPICE 相同；然后在该点用线性小信号模型代替器件。因此图形只适用于工作点附近的小信号：大信号（削波、饱和）不作仿真。'],
inf_vdc_d:['An ideal DC voltage source: it sets the operating point (supply V<sub>CC</sub>, V<sub>DD</sub>, a bias voltage). The long plate is the + terminal. For the small signal it is a short circuit, so a supply rail is AC ground.','Idealni DC naponski izvor: postavlja radnu tačku (napajanje V<sub>CC</sub>, V<sub>DD</sub>, napon polarizacije). Duža ploča je + kraj. Za male signale to je kratak spoj, pa je šina napajanja naizmenična masa.','Fuente ideal de tensión continua: fija el punto de trabajo (alimentación V<sub>CC</sub>, V<sub>DD</sub>, una tensión de polarización). La placa larga es el terminal +. Para la pequeña señal es un cortocircuito, así que la línea de alimentación es masa de alterna.','Source idéale de tension continue : elle fixe le point de fonctionnement (alimentation V<sub>CC</sub>, V<sub>DD</sub>, tension de polarisation). La plaque longue est la borne +. Pour les petits signaux c’est un court-circuit : le rail d’alimentation est une masse alternative.','Ideale Gleichspannungsquelle: legt den Arbeitspunkt fest (Versorgung V<sub>CC</sub>, V<sub>DD</sub>, eine Vorspannung). Die lange Platte ist der Pluspol. Für das Kleinsignal ist sie ein Kurzschluss, die Versorgungsschiene ist also Wechselstrommasse.','理想直流电压源：设置工作点（电源 V<sub>CC</sub>、V<sub>DD</sub>、偏置电压）。长极板为正端。对小信号它是短路，所以电源轨是交流地。'],
inf_idc_d:['An ideal DC current source (e.g. the tail current of a differential pair or a bias current for a diode). The current flows through the source in the direction of the arrow. For the small signal it is an open circuit (infinite internal resistance).','Idealni DC strujni izvor (npr. struja repa diferencijalnog para ili struja polarizacije diode). Struja teče kroz izvor u smeru strelice. Za male signale to je otvorena veza (beskonačna unutrašnja otpornost).','Fuente ideal de corriente continua (p. ej. la corriente de cola de un par diferencial o la de polarización de un diodo). La corriente atraviesa la fuente en el sentido de la flecha. Para la pequeña señal es un circuito abierto (resistencia interna infinita).','Source idéale de courant continu (par ex. le courant de queue d’une paire différentielle ou le courant de polarisation d’une diode). Le courant traverse la source dans le sens de la flèche. Pour les petits signaux c’est un circuit ouvert (résistance interne infinie).','Ideale Gleichstromquelle (z. B. der Fußpunktstrom eines Differenzverstärkers oder der Vorstrom einer Diode). Der Strom fließt in Pfeilrichtung durch die Quelle. Für das Kleinsignal ist sie ein Leerlauf (unendlicher Innenwiderstand).','理想直流电流源（例如差分对的尾电流或二极管的偏置电流）。电流按箭头方向流过电源。对小信号它是开路（内阻无穷大）。'],
inf_d_d:['A pn diode (anode on the triangle side, cathode at the bar). Si and Ge presets differ in I<sub>S</sub>, i.e. in the forward voltage (≈ 0.65 V and ≈ 0.3 V at 1 mA).','P-n dioda (anoda na strani trougla, katoda kod crte). Si i Ge se razlikuju po I<sub>S</sub>, tj. po naponu provođenja (≈ 0,65 V i ≈ 0,3 V pri 1 mA).','Diodo pn (ánodo del lado del triángulo, cátodo en la barra). Los ajustes Si y Ge difieren en I<sub>S</sub>, es decir, en la tensión directa (≈ 0,65 V y ≈ 0,3 V a 1 mA).','Diode pn (anode côté triangle, cathode à la barre). Les préréglages Si et Ge diffèrent par I<sub>S</sub>, donc par la tension directe (≈ 0,65 V et ≈ 0,3 V à 1 mA).','pn-Diode (Anode auf der Dreieckseite, Kathode am Strich). Si und Ge unterscheiden sich in I<sub>S</sub>, also in der Flussspannung (≈ 0,65 V bzw. ≈ 0,3 V bei 1 mA).','PN 二极管（三角形一侧为阳极，竖线处为阴极）。Si 与 Ge 预设的区别在于 I<sub>S</sub>，即正向电压（1 mA 时约 0.65 V 和约 0.3 V）。'],
inf_d_dc:['Shockley equation with emission coefficient n (as in SPICE, with a tiny conductance of 10⁻¹² S across the junction).','Šoklijeva jednačina sa koeficijentom emisije n (kao u SPICE-u, uz sićušnu provodnost 10⁻¹² S paralelno spoju).','Ecuación de Shockley con coeficiente de emisión n (como en SPICE, con una conductancia mínima de 10⁻¹² S en paralelo con la unión).','Équation de Shockley avec coefficient d’émission n (comme dans SPICE, avec une conductance infime de 10⁻¹² S en parallèle sur la jonction).','Shockley-Gleichung mit Emissionskoeffizient n (wie in SPICE, mit einem winzigen Leitwert von 10⁻¹² S parallel zum Übergang).','肖克利方程，发射系数为 n（与 SPICE 相同，结上并联 10⁻¹² S 的极小电导）。'],
inf_d_ss:['Around the operating point the diode is a resistor r<sub>d</sub> (smaller for a larger current) in parallel with its capacitance: junction C<sub>j</sub> plus diffusion τ<sub>T</sub>/r<sub>d</sub>.','Oko radne tačke dioda je otpornik r<sub>d</sub> (manji za veću struju) paralelno sa kapacitivnošću: spojna C<sub>j</sub> plus difuziona τ<sub>T</sub>/r<sub>d</sub>.','Alrededor del punto de trabajo el diodo es una resistencia r<sub>d</sub> (menor cuanto mayor es la corriente) en paralelo con su capacidad: de unión C<sub>j</sub> más de difusión τ<sub>T</sub>/r<sub>d</sub>.','Autour du point de fonctionnement la diode est une résistance r<sub>d</sub> (plus faible pour un courant plus fort) en parallèle avec sa capacité : de jonction C<sub>j</sub> plus de diffusion τ<sub>T</sub>/r<sub>d</sub>.','Um den Arbeitspunkt ist die Diode ein Widerstand r<sub>d</sub> (kleiner bei größerem Strom) parallel zu ihrer Kapazität: Sperrschicht C<sub>j</sub> plus Diffusion τ<sub>T</sub>/r<sub>d</sub>.','在工作点附近，二极管相当于电阻 r<sub>d</sub>（电流越大越小）并联其电容：结电容 C<sub>j</sub> 加扩散电容 τ<sub>T</sub>/r<sub>d</sub>。'],
inf_q_d:['NPN or PNP bipolar transistor: base (left), collector and emitter (arrow). Mirror/flip it with the rotate button. Parameters: current gain β, Early voltage V<sub>A</sub> (∞ = no Early effect), saturation current I<sub>S</sub>, reverse gain β<sub>R</sub> and the capacitances C<sub>π</sub>, C<sub>μ</sub>.','NPN ili PNP bipolarni tranzistor: baza (levo), kolektor i emitor (strelica). Dugme za rotaciju ga ogleda/obrće. Parametri: strujno pojačanje β, Erlijev napon V<sub>A</sub> (∞ = bez Erlijevog efekta), struja zasićenja I<sub>S</sub>, inverzno pojačanje β<sub>R</sub> i kapacitivnosti C<sub>π</sub>, C<sub>μ</sub>.','Transistor bipolar NPN o PNP: base (izquierda), colector y emisor (flecha). El botón de girar lo refleja/voltea. Parámetros: ganancia de corriente β, tensión de Early V<sub>A</sub> (∞ = sin efecto Early), corriente de saturación I<sub>S</sub>, ganancia inversa β<sub>R</sub> y las capacidades C<sub>π</sub>, C<sub>μ</sub>.','Transistor bipolaire NPN ou PNP : base (à gauche), collecteur et émetteur (flèche). Le bouton de rotation le retourne en miroir. Paramètres : gain en courant β, tension d’Early V<sub>A</sub> (∞ = sans effet Early), courant de saturation I<sub>S</sub>, gain inverse β<sub>R</sub> et les capacités C<sub>π</sub>, C<sub>μ</sub>.','NPN- oder PNP-Bipolartransistor: Basis (links), Kollektor und Emitter (Pfeil). Die Dreh-Taste spiegelt/kippt ihn. Parameter: Stromverstärkung β, Early-Spannung V<sub>A</sub> (∞ = kein Early-Effekt), Sättigungsstrom I<sub>S</sub>, Rückwärtsverstärkung β<sub>R</sub> und die Kapazitäten C<sub>π</sub>, C<sub>μ</sub>.','NPN 或 PNP 双极型晶体管：基极（左）、集电极和发射极（箭头）。旋转按钮可镜像/翻转。参数：电流增益 β、厄利电压 V<sub>A</sub>（∞ 表示无厄利效应）、饱和电流 I<sub>S</sub>、反向增益 β<sub>R</sub> 以及电容 C<sub>π</sub>、C<sub>μ</sub>。'],
inf_q_dc:['Gummel–Poon model reduced to the parameters above (the same equations as the SPICE BJT with IS, BF, BR, VAF). It covers all regions: active, saturation, cut-off and reverse active; the region is shown next to the transistor.','Gamel–Pun model sveden na gornje parametre (iste jednačine kao SPICE BJT sa IS, BF, BR, VAF). Pokriva sve oblasti: aktivnu, zasićenje, zakočenje i inverznu; oblast se ispisuje pored tranzistora.','Modelo de Gummel–Poon reducido a los parámetros anteriores (las mismas ecuaciones que el BJT de SPICE con IS, BF, BR, VAF). Cubre todas las regiones: activa, saturación, corte y activa inversa; la región se muestra junto al transistor.','Modèle de Gummel–Poon réduit aux paramètres ci-dessus (mêmes équations que le BJT de SPICE avec IS, BF, BR, VAF). Il couvre toutes les régions : active, saturation, blocage et active inverse ; la région est affichée à côté du transistor.','Gummel-Poon-Modell, reduziert auf die obigen Parameter (dieselben Gleichungen wie der SPICE-BJT mit IS, BF, BR, VAF). Es deckt alle Bereiche ab: aktiv, Sättigung, Sperrbereich und invers aktiv; der Bereich wird neben dem Transistor angezeigt.','简化到上述参数的 Gummel–Poon 模型（与 SPICE 中使用 IS、BF、BR、VAF 的 BJT 方程相同）。覆盖所有工作区：放大、饱和、截止和反向放大；工作区显示在晶体管旁边。'],
inf_q_ss:['The hybrid-π model. g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> (and r<sub>μ</sub> when it matters, e.g. in saturation) are computed exactly as derivatives of the DC model at the operating point; the approximate textbook formulas below agree with them in the active region.','Hibridni π model. g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> (i r<sub>μ</sub> kada je bitna, npr. u zasićenju) računaju se tačno kao izvodi DC modela u radnoj tački; približne udžbeničke formule ispod se sa njima slažu u aktivnoj oblasti.','El modelo híbrido-π. g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> (y r<sub>μ</sub> cuando importa, p. ej. en saturación) se calculan exactamente como derivadas del modelo de continua en el punto de trabajo; las fórmulas aproximadas de libro de abajo coinciden con ellas en la región activa.','Le modèle hybride-π. g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> (et r<sub>μ</sub> quand elle compte, par ex. en saturation) sont calculés exactement comme dérivées du modèle continu au point de fonctionnement ; les formules approchées des manuels ci-dessous concordent en régime actif.','Das Hybrid-π-Modell. g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> (und r<sub>μ</sub>, wenn es darauf ankommt, z. B. in Sättigung) werden exakt als Ableitungen des Gleichstrommodells im Arbeitspunkt berechnet; die Näherungsformeln aus dem Lehrbuch unten stimmen im aktiven Bereich damit überein.','混合 π 模型。g<sub>m</sub>、r<sub>π</sub>、r<sub>o</sub>（必要时还有 r<sub>μ</sub>，例如在饱和区）在工作点处按直流模型的导数精确计算；下面的教科书近似公式在放大区与之一致。'],
inf_m_d:['Enhancement N- or P-channel MOSFET: gate (left), drain and source; the body is tied to the source. Parameters: threshold |V<sub>th</sub>|, transconductance parameter k = μC<sub>ox</sub>·W/L, channel-length modulation λ and the capacitances C<sub>gs</sub>, C<sub>gd</sub>.','N- ili P-kanalni MOSFET sa indukovanim kanalom: gejt (levo), drejn i sors; podloga je vezana na sors. Parametri: napon praga |V<sub>th</sub>|, parametar k = μC<sub>ox</sub>·W/L, modulacija dužine kanala λ i kapacitivnosti C<sub>gs</sub>, C<sub>gd</sub>.','MOSFET de acumulación de canal N o P: puerta (izquierda), drenador y fuente; el sustrato está unido a la fuente. Parámetros: umbral |V<sub>th</sub>|, parámetro k = μC<sub>ox</sub>·W/L, modulación de longitud de canal λ y las capacidades C<sub>gs</sub>, C<sub>gd</sub>.','MOSFET à enrichissement canal N ou P : grille (à gauche), drain et source ; le substrat est relié à la source. Paramètres : seuil |V<sub>th</sub>|, paramètre k = μC<sub>ox</sub>·W/L, modulation de longueur de canal λ et les capacités C<sub>gs</sub>, C<sub>gd</sub>.','Anreicherungs-MOSFET mit N- oder P-Kanal: Gate (links), Drain und Source; das Substrat liegt an der Source. Parameter: Schwellspannung |V<sub>th</sub>|, Parameter k = μC<sub>ox</sub>·W/L, Kanallängenmodulation λ und die Kapazitäten C<sub>gs</sub>, C<sub>gd</sub>.','增强型 N 沟道或 P 沟道 MOSFET：栅极（左）、漏极和源极；衬底接源极。参数：阈值 |V<sub>th</sub>|、跨导参数 k = μC<sub>ox</sub>·W/L、沟道长度调制 λ 以及电容 C<sub>gs</sub>、C<sub>gd</sub>。'],
inf_m_dc:['Square-law (Shichman–Hodges, SPICE level 1) model. For a P-channel device the same equations hold with all voltages and the current reversed.','Model kvadratnog zakona (Šihman–Hodžis, SPICE nivo 1). Za P-kanalni važe iste jednačine sa promenjenim znakom svih napona i struje.','Modelo de ley cuadrática (Shichman–Hodges, SPICE nivel 1). Para canal P valen las mismas ecuaciones con todas las tensiones y la corriente invertidas.','Modèle quadratique (Shichman–Hodges, SPICE niveau 1). Pour un canal P les mêmes équations s’appliquent avec toutes les tensions et le courant inversés.','Quadratisches Modell (Shichman–Hodges, SPICE Level 1). Für P-Kanal gelten dieselben Gleichungen mit umgekehrten Spannungen und Strom.','平方律模型（Shichman–Hodges，SPICE level 1）。P 沟道器件的方程相同，只是所有电压和电流取反。'],
inf_m_ss:['The gate draws no current, so there is no r<sub>π</sub>: the signal model is g<sub>m</sub>·v<sub>gs</sub> with r<sub>ds</sub> and the gate capacitances. In the triode region r<sub>ds</sub> becomes small (the transistor acts as a resistor).','Gejt ne vuče struju, pa nema r<sub>π</sub>: model za signal je g<sub>m</sub>·v<sub>gs</sub> sa r<sub>ds</sub> i kapacitivnostima gejta. U triodnoj oblasti r<sub>ds</sub> postaje mala (tranzistor se ponaša kao otpornik).','La puerta no toma corriente, así que no hay r<sub>π</sub>: el modelo de señal es g<sub>m</sub>·v<sub>gs</sub> con r<sub>ds</sub> y las capacidades de puerta. En la región de tríodo r<sub>ds</sub> se hace pequeña (el transistor actúa como resistencia).','La grille ne prend pas de courant, il n’y a donc pas de r<sub>π</sub> : le modèle de signal est g<sub>m</sub>·v<sub>gs</sub> avec r<sub>ds</sub> et les capacités de grille. En régime ohmique r<sub>ds</sub> devient faible (le transistor se comporte comme une résistance).','Das Gate zieht keinen Strom, daher gibt es kein r<sub>π</sub>: Das Signalmodell ist g<sub>m</sub>·v<sub>gs</sub> mit r<sub>ds</sub> und den Gate-Kapazitäten. Im Triodenbereich wird r<sub>ds</sub> klein (der Transistor wirkt wie ein Widerstand).','栅极不取电流，所以没有 r<sub>π</sub>：信号模型为 g<sub>m</sub>·v<sub>gs</sub> 加 r<sub>ds</sub> 和栅极电容。在线性区 r<sub>ds</sub> 变小（晶体管相当于电阻）。'],
g_semi:['Diodes, NPN/PNP transistors and N/P MOSFETs are analysed for small signals: the app finds the DC operating point (like SPICE .op) and uses the linear model around it for every graph and formula. Tap a part to see its region (active, saturation, cut-off…), currents, g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> and to change β, V<sub>A</sub>, V<sub>th</sub>, k, λ and the capacitances. The rotate button mirrors and flips transistors.','Diode, NPN/PNP tranzistori i N/P MOSFET-ovi analiziraju se za male signale: aplikacija nalazi jednosmernu radnu tačku (kao SPICE .op) i za svaki grafik i formulu koristi linearni model oko nje. Dodirni element da vidiš oblast rada (aktivna, zasićenje, zakočenje…), struje, g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> i da menjaš β, V<sub>A</sub>, V<sub>th</sub>, k, λ i kapacitivnosti. Dugme za rotaciju ogleda i obrće tranzistore.','Los diodos, transistores NPN/PNP y MOSFET N/P se analizan en pequeña señal: la app halla el punto de trabajo de continua (como .op de SPICE) y usa el modelo lineal a su alrededor en todas las gráficas y fórmulas. Toca un componente para ver su región (activa, saturación, corte…), corrientes, g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> y cambiar β, V<sub>A</sub>, V<sub>th</sub>, k, λ y las capacidades. El botón de girar refleja y voltea los transistores.','Diodes, transistors NPN/PNP et MOSFET N/P sont analysés en petits signaux : l’application trouve le point de fonctionnement continu (comme .op de SPICE) et utilise le modèle linéaire autour de lui pour tous les graphiques et formules. Touchez un composant pour voir sa région (actif, saturé, bloqué…), ses courants, g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> et modifier β, V<sub>A</sub>, V<sub>th</sub>, k, λ et les capacités. Le bouton de rotation retourne les transistors.','Dioden, NPN/PNP-Transistoren und N/P-MOSFETs werden im Kleinsignalbetrieb analysiert: Die App bestimmt den Gleichstrom-Arbeitspunkt (wie SPICE .op) und verwendet für alle Diagramme und Formeln das lineare Modell um ihn herum. Tippen Sie auf ein Bauteil, um Bereich (aktiv, Sättigung, Sperrbereich…), Ströme, g<sub>m</sub>, r<sub>π</sub>, r<sub>o</sub> zu sehen und β, V<sub>A</sub>, V<sub>th</sub>, k, λ und die Kapazitäten zu ändern. Die Dreh-Taste spiegelt und kippt Transistoren.','二极管、NPN/PNP 晶体管和 N/P MOSFET 按小信号分析：应用先求直流工作点（如 SPICE 的 .op），所有图形和公式都使用其附近的线性模型。点按元件可查看工作区（放大、饱和、截止…）、电流、g<sub>m</sub>、r<sub>π</sub>、r<sub>o</sub>，并修改 β、V<sub>A</sub>、V<sub>th</sub>、k、λ 和电容。旋转按钮可镜像和翻转晶体管。'],
g_semiDC:['Supplies and bias: DC voltage and current sources (in the “Sources” group) and the DC level of Vin (tap Vin) set the operating point; for the signal a DC voltage source is a short and a DC current source is open.','Napajanje i polarizacija: DC naponski i strujni izvori (grupa „Izvori“) i DC nivo ulaza Vin (dodirni Vin) postavljaju radnu tačku; za signal je DC naponski izvor kratak spoj, a DC strujni izvor otvorena veza.','Alimentación y polarización: las fuentes de tensión y corriente continua (grupo «Fuentes») y el nivel de continua de Vin (toca Vin) fijan el punto de trabajo; para la señal una fuente de tensión continua es un cortocircuito y una de corriente un circuito abierto.','Alimentation et polarisation : les sources de tension et de courant continus (groupe « Sources ») et le niveau continu de Vin (touchez Vin) fixent le point de fonctionnement ; pour le signal une source de tension continue est un court-circuit et une source de courant un circuit ouvert.','Versorgung und Arbeitspunkt: Gleichspannungs- und Gleichstromquellen (Gruppe „Quellen“) und der Gleichanteil von Vin (auf Vin tippen) legen den Arbeitspunkt fest; für das Signal ist eine Gleichspannungsquelle ein Kurzschluss und eine Gleichstromquelle offen.','电源与偏置：直流电压源和电流源（“电源”组）以及 Vin 的直流电平（点按 Vin）决定工作点；对信号而言，直流电压源为短路，直流电流源为开路。'],
e_oaSing:['The circuit with an ideal op-amp has no solution: it needs negative feedback (the output connected back to the − input through elements).','Kolo sa idealnim op. pojačavačem nema rešenje: potrebna je negativna povratna sprega (izlaz preko elemenata vraćen na − ulaz).','El circuito con un amp. operacional ideal no tiene solución: necesita realimentación negativa (la salida conectada de vuelta a la entrada − a través de elementos).','Le circuit avec un ampli-op idéal n’a pas de solution : il faut une contre-réaction (la sortie ramenée sur l’entrée − par des éléments).','Die Schaltung mit idealem OPV hat keine Lösung: Sie braucht Gegenkopplung (Ausgang über Bauelemente zurück auf den −-Eingang).','含理想运放的电路无解：需要负反馈（输出经元件接回 − 输入端）。'],
d_oaConn:['Op-amps and their pins:','Operacioni pojačavači i njihovi pinovi:','Amplificadores operacionales y sus pines:','Ampli-op et leurs broches :','Operationsverstärker und ihre Anschlüsse:','运放及其引脚：'],
d_toGnd:['from the output pin to ground','od izlaznog pina ka masi','del pin de salida a masa','de la broche de sortie à la masse','vom Ausgangspin nach Masse','从输出引脚到地'],
st_oaPot:['Potentiometer and op-amp models','Modeli potenciometra i op. pojačavača','Modelos del potenciómetro y del amp. operacional','Modèles du potentiomètre et de l’ampli-op','Modelle von Potentiometer und OPV','电位器与运放模型'],
d_potIdeal:['{0} (wiper at {1}): a potentiometer is two resistors joined at the wiper; α is the wiper position.','{0} (klizač na {1}): potenciometar su dva otpornika spojena u klizaču; α je položaj klizača.','{0} (cursor en {1}): un potenciómetro son dos resistencias unidas en el cursor; α es la posición del cursor.','{0} (curseur à {1}) : un potentiomètre, ce sont deux résistances reliées au curseur ; α est la position du curseur.','{0} (Schleifer bei {1}): Ein Potentiometer sind zwei Widerstände, die am Schleifer verbunden sind; α ist die Schleiferstellung.','{0}（滑动端在 {1}）：电位器就是在滑动端相连的两个电阻；α 为滑动端位置。'],
d_potReal:['Real model: the track inductance L_s is split in the same ratio, R_w is the wiper contact resistance and C_p is the capacitance across the whole track.','Realni model: induktivnost staze L_s deli se u istom odnosu, R_w je kontaktna otpornost klizača, a C_p kapacitivnost preko cele staze.','Modelo real: la inductancia de la pista L_s se reparte en la misma proporción, R_w es la resistencia de contacto del cursor y C_p la capacidad sobre toda la pista.','Modèle réel : l’inductance de la piste L_s est partagée dans le même rapport, R_w est la résistance de contact du curseur et C_p la capacité sur toute la piste.','Reales Modell: Die Bahninduktivität L_s wird im gleichen Verhältnis geteilt, R_w ist der Schleifer-Übergangswiderstand und C_p die Kapazität über die ganze Bahn.','实际模型：电阻轨道电感 L_s 按同一比例分配，R_w 为滑动端接触电阻，C_p 为整条轨道两端的电容。'],
d_oaIdeal:['{0} is ideal: infinite gain, no input current and zero output resistance. With negative feedback the output settles where V+ = V−. The output current is whatever the circuit needs, so the KCL equation at the output node is not written; the equation V+ = V− takes its place.','{0} je idealan: beskonačno pojačanje, ulazi ne vuku struju, izlazna otpornost je nula. Uz negativnu povratnu spregu izlaz se postavi tako da je V+ = V−. Izlazna struja je onolika koliko kolu treba, pa se KZS za izlazni čvor ne piše; umesto nje ide jednačina V+ = V−.','{0} es ideal: ganancia infinita, sin corriente de entrada y resistencia de salida nula. Con realimentación negativa la salida se ajusta para que V+ = V−. La corriente de salida es la que el circuito necesite, así que la ecuación de Kirchhoff del nodo de salida no se escribe; en su lugar va V+ = V−.','{0} est idéal : gain infini, aucun courant d’entrée et résistance de sortie nulle. Avec contre-réaction, la sortie se place de sorte que V+ = V−. Le courant de sortie est celui dont le circuit a besoin : on n’écrit donc pas la loi des nœuds à la sortie ; l’équation V+ = V− la remplace.','{0} ist ideal: unendliche Verstärkung, kein Eingangsstrom und Ausgangswiderstand null. Mit Gegenkopplung stellt sich der Ausgang so ein, dass V+ = V−. Der Ausgangsstrom ist so groß, wie die Schaltung ihn braucht; deshalb wird die Knotengleichung am Ausgang nicht aufgestellt, an ihre Stelle tritt V+ = V−.','{0} 为理想运放：增益无穷大、输入无电流、输出电阻为零。在负反馈下输出会使 V+ = V−。输出电流由电路决定，因此输出节点不写 KCL 方程，而以 V+ = V− 代替。'],
d_oaReal:['{0} is real: finite gain A₀ with one dominant pole (above ω_p the gain falls 20 dB/dec and reaches 1 at about GBW). Input: L_in in each lead and R_in ∥ C_in between the inputs; output: R_out + L_out and C_out:','{0} je realan: konačno pojačanje A₀ sa jednim dominantnim polom (iznad ω_p pojačanje pada 20 dB/dek i oko GBW postaje 1). Ulaz: L_in u svakom izvodu i R_in ∥ C_in između ulaza; izlaz: R_out + L_out i C_out:','{0} es real: ganancia finita A₀ con un polo dominante (por encima de ω_p la ganancia cae 20 dB/déc y vale 1 hacia GBW). Entrada: L_in en cada terminal y R_in ∥ C_in entre las entradas; salida: R_out + L_out y C_out:','{0} est réel : gain fini A₀ avec un pôle dominant (au-delà de ω_p le gain chute de 20 dB/déc et vaut 1 vers GBW). Entrée : L_in dans chaque patte et R_in ∥ C_in entre les entrées ; sortie : R_out + L_out et C_out :','{0} ist real: endliche Verstärkung A₀ mit einem dominanten Pol (oberhalb ω_p fällt sie mit 20 dB/Dek und erreicht bei etwa GBW den Wert 1). Eingang: L_in in jeder Zuleitung und R_in ∥ C_in zwischen den Eingängen; Ausgang: R_out + L_out und C_out:','{0} 为实际运放：有限增益 A₀，带一个主极点（ω_p 以上增益按 20 dB/十倍频下降，约在 GBW 处降为 1）。输入：每根引线串 L_in，两输入间为 R_in ∥ C_in；输出：R_out + L_out 以及 C_out：'],
d_oaReal2:['The internal voltage source gives (V+ and V− are the inner input nodes, V_o the inner output node):','Unutrašnji naponski izvor daje (V+ i V− su unutrašnji ulazni čvorovi, V_o unutrašnji izlazni čvor):','La fuente de tensión interna da (V+ y V− son los nodos internos de entrada, V_o el nodo interno de salida):','La source de tension interne donne (V+ et V− sont les nœuds d’entrée internes, V_o le nœud de sortie interne) :','Die innere Spannungsquelle liefert (V+ und V− sind die inneren Eingangsknoten, V_o der innere Ausgangsknoten):','内部电压源给出（V+、V− 为内部输入节点，V_o 为内部输出节点）：'],
d_oaKcl:['At the output of each op-amp the KCL equation is replaced by the op-amp equation (the output current is an unknown we do not need):','Na izlazu svakog op. pojačavača KZS je zamenjen jednačinom pojačavača (izlazna struja je nepoznata koja nam ne treba):','En la salida de cada amp. operacional la ecuación de Kirchhoff se sustituye por la del amplificador (la corriente de salida es una incógnita que no necesitamos):','À la sortie de chaque ampli-op, la loi des nœuds est remplacée par l’équation de l’ampli (le courant de sortie est une inconnue inutile ici) :','Am Ausgang jedes OPV wird die Knotengleichung durch die OPV-Gleichung ersetzt (der Ausgangsstrom ist eine Unbekannte, die wir nicht brauchen):','每个运放的输出节点用运放方程代替 KCL 方程（输出电流是我们不需要的未知量）：'],

d_intro:['We solve the circuit in the Laplace (complex) domain, with the variable <code>s</code>. There, inductors and capacitors behave like “resistors” whose impedance depends on <code>s</code>, so the same laws hold as for resistors (Ohm’s and Kirchhoff’s laws). For a sinusoidal signal of frequency <code>f</code> we finally substitute:','Kolo rešavamo u Laplasovom (kompleksnom) domenu, sa promenljivom <code>s</code>. Tu se kalemi i kondenzatori ponašaju kao „otpornici" sa impedansom koja zavisi od <code>s</code>, pa važe isti zakoni kao za otpornike (Omov i Kirhofovi). Za sinusni signal frekvencije <code>f</code> na kraju stavljamo:','Resolvemos el circuito en el dominio de Laplace (complejo), con la variable <code>s</code>. Allí las bobinas y los condensadores se comportan como «resistencias» cuya impedancia depende de <code>s</code>, así que valen las mismas leyes que para las resistencias (Ohm y Kirchhoff). Para una señal senoidal de frecuencia <code>f</code> sustituimos al final:','On résout le circuit dans le domaine de Laplace (complexe), avec la variable <code>s</code>. Les bobines et les condensateurs s’y comportent comme des « résistances » dont l’impédance dépend de <code>s</code>, donc les mêmes lois que pour les résistances s’appliquent (lois d’Ohm et de Kirchhoff). Pour un signal sinusoïdal de fréquence <code>f</code>, on remplace à la fin :','Wir lösen die Schaltung im Laplace-Bereich (komplex) mit der Variablen <code>s</code>. Dort verhalten sich Spulen und Kondensatoren wie „Widerstände“, deren Impedanz von <code>s</code> abhängt, daher gelten dieselben Gesetze wie für Widerstände (Ohm und Kirchhoff). Für ein Sinussignal der Frequenz <code>f</code> setzen wir am Ende ein:','我们在拉普拉斯（复数）域中求解电路，变量为 <code>s</code>。在这里，电感和电容就像阻抗随 <code>s</code> 变化的“电阻”，因此电阻所遵循的定律（欧姆定律和基尔霍夫定律）同样适用。对于频率为 <code>f</code> 的正弦信号，最后代入：'],
