  if(kind==='pz'){const z=ZV.pz,sl=state.pzSel;ZV.pz={s:1,u:0,v:0};state.pzSel=null;const c2=document.createElement('canvas');c2.width=1200;c2.height=1000;try{drawPZ(c2,PRINT_PAL,600,500,2)}finally{ZV.pz=z;state.pzSel=sl}return c2.toDataURL('image/png')}
  if(kind==='smith')drawSmith(c,PRINT_PAL,W,H,2);else if(kind==='specbar')drawSpecBars(c,PRINT_PAL,W,H,2,specData());else if(kind==='spectime')drawSpecTime(c,PRINT_PAL,W,H,2,specData());else if(kind==='nyq')drawNyq(c,PRINT_PAL,W,H,2);else drawFreq(c,series('bode',kind),PRINT_PAL,W,H,2,kind==='mag');return c.toDataURL('image/png')}
async function makeReport(){const prevG=fxG;if(derivBusy)await derivBusy;if(fxG!=='all'||!derived||!document.getElementById('stale').hidden){fxG='all';await runDerive()}
  const r=document.getElementById('report');const isZ=MODE()==='Z';const d=new Date();const b=contentBox();
  const bw=Math.max(1,b.x1-b.x0),bh=Math.max(1,b.y1-b.y0);
  const sch=`<div class="rsw" style="max-width:${Math.min(180,200*bw/bh).toFixed(1)}mm"><div style="padding-top:${(bh/bw*100).toFixed(3)}%"><svg class="sch" viewBox="${b.x0} ${b.y0} ${bw} ${bh}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${schMarkup(true)}</svg></div></div>`;
  const nm=circTitle();
  const dv=document.getElementById('deriv');
  /* first page: the circuit name and its schematic; the graphs and the derivation follow from the second page */
  r.innerHTML=`<section class="rcover"><h1>${esc(nm||t('rp_title'))}</h1>${nm?`<p class="sub">${t('rp_title')}</p>`:''}<p class="meta">${d.toLocaleDateString(LANGS[LI][3])} · ${t(isZ?'rp_modeZ':'rp_modeH')} · ${t('rp_range',si(state.fmin,'Hz'),si(state.fmax,'Hz'))}${state.realMode?' · '+t('f_real'):''}</p>
  <h2>${t('rp_sch')}</h2>${sch}${opRows().length?`<h2>${t('st_op')}</h2>${opTableHtml()}`:''}</section>
  <div class="rblk"><h2>${t('rp_bode')}: ${isZ?'20·log|Z| (dBΩ)':'|H| (dB)'}</h2><img alt="" src="${plotImage('mag')}"></div>
  <div class="rblk"><h2>${t('rp_phase')}</h2><img alt="" src="${plotImage('ph')}"></div>
  ${timeData()?`<div class="rblk"><h2>${t('rp_time')}</h2><img alt="" src="${plotImage('step')}"><img alt="" src="${plotImage('imp')}"></div>${(()=>{const m=timeData().m,L=[];if(m.tau!=null)L.push('τ (63 %): <b>'+si(m.tau,'s',3)+'</b>');if(m.tr!=null)L.push(t('tm_rise')+': <b>'+si(m.tr,'s',3)+'</b>');if(m.over)L.push(t('tm_over')+': <b>'+m.over.toFixed(2)+' %</b>');if(m.ts!=null)L.push(t('tm_settle')+': <b>'+si(m.ts,'s',3)+'</b>');if(timeData().yinf!=null)L.push(t('tm_final')+': <b>'+fmtNum(timeData().yinf)+'</b>');return L.length?'<p>'+L.join('<br>')+'</p>':''})()}`:''}
  <div class="rblk"><h2>${t('rp_nyq')}</h2><img alt="" src="${plotImage('nyq')}"></div>
  <div class="rblk"><h2>${t('tab_spec')}</h2><img alt="" src="${plotImage('specbar')}"><img alt="" src="${plotImage('spectime')}"></div>
  <div class="rblk"><h2>Smith (Z₀ = ${si(state.z0,'Ω')})</h2><img alt="" style="max-width:110mm" src="${plotImage('smith')}"></div>
  ${getPZ()?`<div class="rblk"><h2>${t('rp_pz')}</h2><img alt="" style="max-width:120mm" src="${plotImage('pz')}"></div><p>${getPZ().poles.length?t('pz_pole')+': '+getPZ().poles.map(q=>'<b>'+pzS(q)+'</b> ('+si(pzInfo(q).f,'Hz',3)+')').join(', '):''}${getPZ().zeros.length?'<br>'+t('pz_zero')+': '+getPZ().zeros.map(q=>'<b>'+pzS(q)+'</b> ('+si(pzInfo(q).f,'Hz',3)+')').join(', '):''}</p>`:''}
  ${data&&data.points.length?'<div class="rblk"><h2>'+t('rp_pts')+'</h2><p>'+data.points.map(p=>esc(t(p.label))+': <b>'+si(p.f,'Hz',4)+'</b>').join('<br>')+'</p></div>':''}
  <h2>${t('rp_der')}</h2><div class="${dv.classList.contains('nomath')?'nomath':''}">${dv.innerHTML}</div>`;
  r.querySelectorAll('details').forEach(d=>d.open=true);
  if(prevG!=='all'){fxG=prevG;derivBusy=runDerive()}}

/* ================= graph controls ================= */
const fminI=document.getElementById('fmin'),fmaxI=document.getElementById('fmax');
/* frequency fields: the number is typed, the unit is chosen from a list */
const FU=[['THz',1e12],['GHz',1e9],['MHz',1e6],['kHz',1e3],['Hz',1],['mHz',1e-3]];
function setFq(inp,sel,v){let u=FU.find(q=>v>=q[1]*0.99995)||FU[FU.length-1];inp.value=String(parseFloat((v/u[1]).toPrecision(4)));sel.innerHTML=FU.map(q=>`<option value="${q[1]}"${q[0]===u[0]?' selected':''}>${q[0]}</option>`).join('');inp.classList.remove('bad')}
function getFq(inp,sel){const s=String(inp.value).trim().replace(',','.').replace('−','-');if(/[a-zA-Zµμ]/.test(s))return parseSI(s);const x=parseFloat(s);return isFinite(x)?x*(+sel.value):NaN}
const fminU=document.getElementById('fminU'),fmaxU=document.getElementById('fmaxU');
function showRange(){setFq(fminI,fminU,state.fmin);setFq(fmaxI,fmaxU,state.fmax)}
function rangeChange(){const a=getFq(fminI,fminU),b=getFq(fmaxI,fmaxU);if(!(a>=1e-3&&b<=1e12&&b>a*1.5)){(a>=1e-3&&a<b?fmaxI:fminI).classList.add('bad');return}state.fmin=a;state.fmax=b;showRange();onValue()}
fminI.addEventListener('change',rangeChange);fmaxI.addEventListener('change',rangeChange);fminU.addEventListener('change',rangeChange);fmaxU.addEventListener('change',rangeChange);
[fminI,fmaxI].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')i.blur()}));
document.getElementById('fauto').addEventListener('click',()=>{const Rs=[],Ls=[],Cs=[];for(const p of state.parts){if(p.kind==='R'||p.kind==='P')Rs.push(p.val);if(p.kind==='L')Ls.push(p.val);if(p.kind==='C')Cs.push(p.val)}
  const fs=[];for(const C of Cs){for(const R of Rs)fs.push(1/(2*Math.PI*R*C));for(const L of Ls)fs.push(1/(2*Math.PI*Math.sqrt(L*C)))}for(const L of Ls)for(const R of Rs)fs.push(R/(2*Math.PI*L));for(const p of state.parts)if(p.kind==='OA'&&isReal(p)){const q=ensurePar(p);fs.push(q.gbw,q.gbw/q.a0)}
  if(!fs.length)return;const lo=Math.min(...fs),hi=Math.max(...fs);
  state.fmin=Math.max(1e-3,Math.pow(10,Math.floor(Math.log10(lo))-2));state.fmax=Math.min(1e12,Math.pow(10,Math.ceil(Math.log10(hi))+2));if(state.fmax<=state.fmin*10)state.fmax=state.fmin*1e4;
  state.cursor=null;showRange();onValue()});
document.getElementById('bRange').addEventListener('click',()=>{const r=document.getElementById('rangebox');r.hidden=!r.hidden});
const gEl=document.getElementById('graph');
function applyHide(){gEl.classList.toggle('hidden',!!state.ghide);gEl.classList.toggle('big',!!state.gbig&&!state.ghide);stage.classList.toggle('compact',!!state.gbig&&!state.ghide);const bm=document.getElementById('bMax');bm.hidden=!!state.ghide;bm.setAttribute('aria-pressed',!!state.gbig);bm.querySelector('path').setAttribute('d',state.gbig?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');const b=document.getElementById('bHide');b.setAttribute('aria-label',t(state.ghide?'a_show':'a_hide'));b.querySelector('path').setAttribute('d',state.ghide?'M6 9l6 6 6-6':'M6 15l6-6 6 6');requestAnimationFrame(()=>{applyView();drawGraph()})}
document.getElementById('bHide').addEventListener('click',()=>{state.ghide=!state.ghide;if(state.ghide)state.gbig=false;applyHide();save()});
document.getElementById('bMax').addEventListener('click',()=>{state.gbig=!state.gbig;if(state.gbig)state.ghide=false;applyHide();save()});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));try{b.scrollIntoView({inline:'nearest',block:'nearest'})}catch(_){}if(state.ghide){state.ghide=false;applyHide()}save();requestAnimationFrame(()=>{drawGraph();renderPoints();if(state.tolMode)tolStart()})});
document.getElementById('points').addEventListener('click',e=>{const tt=e.target.closest('[data-tt]');if(tt&&data){state.tcur=+tt.dataset.tt;drawGraph();return}
  const pz=e.target.closest('[data-pz]');if(pz&&data&&state._pzChips){const o=state._pzChips[+pz.dataset.pz];state.pzSel=o?{p:o.p,z:o.z}:null;drawGraph();return}
  const b=e.target.closest('[data-pt]');if(!b||!data)return;state.cursor=data.points[+b.dataset.pt].f;drawGraph()});

const spW=document.getElementById('spWave'),spF=document.getElementById('spF0'),spFU=document.getElementById('spF0U'),smZ=document.getElementById('smZ0');
function renderCtl(){spW.innerHTML=WAVES.map(w=>`<option value="${w}"${state.spec.wave===w?' selected':''}>${t('w_'+w)}</option>`).join('');setFq(spF,spFU,state.spec.f0);{const w=document.getElementById('spDw');w.hidden=state.spec.wave!=='pulse';const di=document.getElementById('spD');di.value=String(Math.round(pd()*1000)/10);di.classList.remove('bad')}smZ.value=si(state.z0,'Ω');spF.classList.remove('bad');smZ.classList.remove('bad')}
spW.addEventListener('change',()=>{state.spec.wave=spW.value;document.getElementById('spDw').hidden=spW.value!=='pulse';save();drawGraph()});
const spFch=()=>{const v=getFq(spF,spFU);if(!(v>0&&v<1e11)){spF.classList.add('bad');return}state.spec.f0=v;renderCtl();save();drawGraph()};spF.addEventListener('change',spFch);{const di=document.getElementById('spD');di.addEventListener('change',()=>{const v=parseFloat(String(di.value).replace(',','.').replace('%',''));if(!(v>=1&&v<=99)){di.classList.add('bad');return}state.spec.duty=v/100;renderCtl();save();drawGraph()});di.addEventListener('keydown',e=>{if(e.key==='Enter')di.blur()})}spFU.addEventListener('change',spFch);
smZ.addEventListener('change',()=>{const v=parseSI(smZ.value);if(!(v>0)){smZ.classList.add('bad');return}state.z0=v;renderCtl();save();drawGraph()});
[spF,smZ].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')i.blur()}));
applyLang();renderCtl();applyRealBtn();applyStdBtn();showRange();applyHide();assignNames();NET=netlist();renderSchematic();renderSelBar();update();
requestAnimationFrame(()=>{if(!state.view)fitView();else applyView();drawGraph()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawGraph();renderSchematic()});
